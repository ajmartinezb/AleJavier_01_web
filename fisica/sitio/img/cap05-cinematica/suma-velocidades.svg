<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Tren a 20 metros por segundo con un pasajero que camina hacia adelante a 2 metros por segundo, 22 desde el andén, y otro hacia atrás, 18 desde el andén" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Tren a 20 metros por segundo con un pasajero que camina hacia adelante a 2 metros por segundo, 22 desde el andén, y otro hacia atrás, 18 desde el andén</title>
<rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67700"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<text x="450.0" y="28.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Suma de velocidades de Galileo</text>
<rect x="150" y="90" width="600" height="150" rx="16" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2.5"/>
<rect x="180" y="108" width="80" height="40" rx="6" fill="#ffffff" stroke="#1c7ed6"/>
<rect x="295" y="108" width="80" height="40" rx="6" fill="#ffffff" stroke="#1c7ed6"/>
<rect x="410" y="108" width="80" height="40" rx="6" fill="#ffffff" stroke="#1c7ed6"/>
<rect x="525" y="108" width="80" height="40" rx="6" fill="#ffffff" stroke="#1c7ed6"/>
<rect x="640" y="108" width="80" height="40" rx="6" fill="#ffffff" stroke="#1c7ed6"/>
<circle cx="210" cy="252" r="16" fill="#4a5568"/>
<circle cx="690" cy="252" r="16" fill="#4a5568"/>
<line x1="140.0" y1="270.0" x2="780.0" y2="270.0" stroke="#1a202c" stroke-width="3" />
<line x1="770.0" y1="150.0" x2="870.0" y2="150.0" stroke="#1c7ed6" stroke-width="3" marker-end="url(#ma)"/>
<text x="820.0" y="130.0" font-size="13" text-anchor="middle" fill="#1c7ed6" font-weight="700">tren: 20 m/s</text>
<circle cx="300" cy="172" r="9" fill="#2f9e44"/><line x1="300.0" y1="181.0" x2="300.0" y2="212.0" stroke="#2f9e44" stroke-width="4" /><line x1="300.0" y1="212.0" x2="292.0" y2="232.0" stroke="#2f9e44" stroke-width="3.5" /><line x1="300.0" y1="212.0" x2="308.0" y2="232.0" stroke="#2f9e44" stroke-width="3.5" />
<line x1="315.0" y1="190.0" x2="375.0" y2="190.0" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#mv)"/>
<text x="345.0" y="182.0" font-size="12" text-anchor="middle" fill="#2f9e44" font-weight="700">2 m/s</text>
<circle cx="590" cy="172" r="9" fill="#e67700"/><line x1="590.0" y1="181.0" x2="590.0" y2="212.0" stroke="#e67700" stroke-width="4" /><line x1="590.0" y1="212.0" x2="582.0" y2="232.0" stroke="#e67700" stroke-width="3.5" /><line x1="590.0" y1="212.0" x2="598.0" y2="232.0" stroke="#e67700" stroke-width="3.5" />
<line x1="575.0" y1="190.0" x2="515.0" y2="190.0" stroke="#e67700" stroke-width="2.5" marker-end="url(#mn)"/>
<text x="545.0" y="182.0" font-size="12" text-anchor="middle" fill="#e67700" font-weight="700">2 m/s</text>
<text x="300.0" y="300.0" font-size="14" text-anchor="middle" fill="#2f9e44" font-weight="700">Desde el andén: 20 + 2 = 22 m/s</text>
<text x="590.0" y="300.0" font-size="14" text-anchor="middle" fill="#e67700" font-weight="700">Desde el andén: 20 − 2 = 18 m/s</text>
<text x="450.0" y="325.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">(ambos siguen avanzando en el sentido del tren)</text>
</svg>
