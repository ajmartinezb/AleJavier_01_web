<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Corredor que va de 0 a 400 metros y vuelve a 100 metros: distancia 700 metros y desplazamiento más 100 metros" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Corredor que va de 0 a 400 metros y vuelve a 100 metros: distancia 700 metros y desplazamiento más 100 metros</title>
<rect width="900" height="300" fill="#ffffff"/>
<defs><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67700"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<text x="450.0" y="28.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Distancia recorrida y desplazamiento</text>
<line x1="60.0" y1="200.0" x2="840.0" y2="200.0" stroke="#4a5568" stroke-width="2" marker-end="url(#mg)"/>
<line x1="100.0" y1="194.0" x2="100.0" y2="206.0" stroke="#4a5568" stroke-width="1.5" />
<text x="100.0" y="224.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">0</text>
<line x1="260.0" y1="194.0" x2="260.0" y2="206.0" stroke="#4a5568" stroke-width="1.5" />
<text x="260.0" y="224.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">100</text>
<line x1="420.0" y1="194.0" x2="420.0" y2="206.0" stroke="#4a5568" stroke-width="1.5" />
<text x="420.0" y="224.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">200</text>
<line x1="580.0" y1="194.0" x2="580.0" y2="206.0" stroke="#4a5568" stroke-width="1.5" />
<text x="580.0" y="224.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">300</text>
<line x1="740.0" y1="194.0" x2="740.0" y2="206.0" stroke="#4a5568" stroke-width="1.5" />
<text x="740.0" y="224.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">400</text>
<text x="840.0" y="224.0" font-size="12" text-anchor="end" fill="#4a5568" font-weight="normal">x (m)</text>
<path d="M100,186 L740.0,186" stroke="#e67700" stroke-width="2.5" fill="none" marker-end="url(#mn)"/>
<path d="M740.0,186 q30,-30 0,-50 L260.0,136" stroke="#e67700" stroke-width="2.5" fill="none" marker-end="url(#mn)"/>
<text x="500.0" y="124.0" font-size="13" text-anchor="middle" fill="#e67700" font-weight="700">camino: 400 m de ida + 300 m de vuelta = 700 m (distancia)</text>
<line x1="100.0" y1="250.0" x2="260.0" y2="250.0" stroke="#2f9e44" stroke-width="3.5" marker-end="url(#mv)"/>
<text x="180.0" y="274.0" font-size="13" text-anchor="middle" fill="#2f9e44" font-weight="700">desplazamiento = +100 m</text>
<circle cx="100" cy="200" r="6" fill="#1a202c"/>
<text x="100.0" y="174.0" font-size="11" text-anchor="middle" fill="#1a202c" font-weight="normal">partida</text>
<circle cx="260.0" cy="200" r="6" fill="#c92a2a"/>
<text x="264.0" y="244.0" font-size="11" text-anchor="start" fill="#c92a2a" font-weight="normal">llegada</text>
</svg>
