<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" role="img" aria-label="Reflexión, refracción, difracción en una rendija e interferencia de dos fuentes" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Reflexión, refracción, difracción en una rendija e interferencia de dos fuentes</title>
<rect width="900" height="590" fill="#ffffff"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="fla" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker></defs>
<text x="450.0" y="28.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Cuatro fenómenos ondulatorios</text>
<text x="230.0" y="70.0" font-size="15" text-anchor="middle" fill="#1c7ed6" font-weight="700">Reflexión</text>
<rect x="70" y="240" width="320" height="14" fill="#adb5bd"/>
<line x1="230.0" y1="240.0" x2="230.0" y2="95.0" stroke="#4a5568" stroke-width="1" stroke-dasharray="4 4"/>
<text x="234.0" y="92.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">normal</text>
<line x1="110.0" y1="110.0" x2="226.0" y2="236.0" stroke="#c92a2a" stroke-width="2.5" marker-end="url(#flr)"/>
<line x1="234.0" y1="236.0" x2="350.0" y2="110.0" stroke="#c92a2a" stroke-width="2.5" marker-end="url(#flr)"/>
<text x="190.0" y="180.0" font-size="13" text-anchor="middle" fill="#1a202c" font-weight="normal" font-style="italic">i</text>
<text x="270.0" y="180.0" font-size="13" text-anchor="middle" fill="#1a202c" font-weight="normal" font-style="italic">r</text>
<text x="230.0" y="275.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">ángulo de incidencia = ángulo de reflexión</text>
<text x="670.0" y="70.0" font-size="15" text-anchor="middle" fill="#1c7ed6" font-weight="700">Refracción</text>
<rect x="510" y="180" width="320" height="100" fill="#d0ebff"/>
<text x="520.0" y="172.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">aire (más rápida)</text>
<text x="520.0" y="272.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">agua (más lenta)</text>
<line x1="670.0" y1="90.0" x2="670.0" y2="280.0" stroke="#4a5568" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="580.0" y1="95.0" x2="667.0" y2="177.0" stroke="#c92a2a" stroke-width="2.5" marker-end="url(#flr)"/>
<line x1="670.0" y1="180.0" x2="715.0" y2="270.0" stroke="#c92a2a" stroke-width="2.5" marker-end="url(#flr)"/>
<text x="730.0" y="220.0" font-size="11" text-anchor="start" fill="#c92a2a" font-weight="normal">se acerca a la normal</text>
<text x="670.0" y="300.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">cambia la rapidez y la dirección; la frecuencia no</text>
<text x="230.0" y="332.0" font-size="15" text-anchor="middle" fill="#1c7ed6" font-weight="700">Difracción</text>
<rect x="200" y="355" width="10" height="75" fill="#4a5568"/>
<rect x="200" y="465" width="10" height="75" fill="#4a5568"/>
<line x1="80.0" y1="365.0" x2="80.0" y2="530.0" stroke="#1c7ed6" stroke-width="2" />
<line x1="110.0" y1="365.0" x2="110.0" y2="530.0" stroke="#1c7ed6" stroke-width="2" />
<line x1="140.0" y1="365.0" x2="140.0" y2="530.0" stroke="#1c7ed6" stroke-width="2" />
<line x1="170.0" y1="365.0" x2="170.0" y2="530.0" stroke="#1c7ed6" stroke-width="2" />
<path d="M210,422.5 A25,25 0 0 1 210,472.5" fill="none" stroke="#1c7ed6" stroke-width="2"/>
<path d="M210,397.5 A50,50 0 0 1 210,497.5" fill="none" stroke="#1c7ed6" stroke-width="2"/>
<path d="M210,372.5 A75,75 0 0 1 210,522.5" fill="none" stroke="#1c7ed6" stroke-width="2"/>
<text x="230.0" y="570.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">la onda se abre al pasar por una rendija del tamaño de λ</text>
<text x="670.0" y="332.0" font-size="15" text-anchor="middle" fill="#1c7ed6" font-weight="700">Interferencia</text>
<circle cx="630" cy="455" r="22" fill="none" stroke="#1c7ed6" stroke-width="1.6" opacity="0.8"/>
<circle cx="630" cy="455" r="44" fill="none" stroke="#1c7ed6" stroke-width="1.6" opacity="0.8"/>
<circle cx="630" cy="455" r="66" fill="none" stroke="#1c7ed6" stroke-width="1.6" opacity="0.8"/>
<circle cx="630" cy="455" r="88" fill="none" stroke="#1c7ed6" stroke-width="1.6" opacity="0.8"/>
<circle cx="630" cy="455" r="5" fill="#c92a2a"/>
<circle cx="710" cy="455" r="22" fill="none" stroke="#1c7ed6" stroke-width="1.6" opacity="0.8"/>
<circle cx="710" cy="455" r="44" fill="none" stroke="#1c7ed6" stroke-width="1.6" opacity="0.8"/>
<circle cx="710" cy="455" r="66" fill="none" stroke="#1c7ed6" stroke-width="1.6" opacity="0.8"/>
<circle cx="710" cy="455" r="88" fill="none" stroke="#1c7ed6" stroke-width="1.6" opacity="0.8"/>
<circle cx="710" cy="455" r="5" fill="#c92a2a"/>
<text x="670.0" y="570.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">cresta + cresta: se refuerzan · cresta + valle: se anulan</text>
</svg>
