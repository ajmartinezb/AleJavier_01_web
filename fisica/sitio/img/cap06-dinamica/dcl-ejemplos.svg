<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" width="900" height="345" role="img" aria-label="Tres diagramas de cuerpo libre: libro con peso y normal; caja con peso, normal, fuerza aplicada y roce; lámpara con peso y tensión" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Tres diagramas de cuerpo libre: libro con peso y normal; caja con peso, normal, fuerza aplicada y roce; lámpara con peso y tensión</title>
<rect width="900" height="345" fill="#ffffff"/>
<defs><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67700"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<text x="450.0" y="28.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Diagramas de cuerpo libre</text>
<text x="150.0" y="64.0" font-size="14" text-anchor="middle" fill="#1c7ed6" font-weight="700">Libro sobre la mesa</text>
<rect x="105.0" y="162.0" width="90" height="36" rx="4" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
<line x1="150.0" y1="198.0" x2="150.0" y2="280.0" stroke="#c92a2a" stroke-width="3.5" marker-end="url(#mr)"/><text x="160.0" y="280.0" font-size="13" text-anchor="start" fill="#c92a2a" font-weight="700">P</text>
<line x1="150.0" y1="162.0" x2="150.0" y2="80.0" stroke="#2f9e44" stroke-width="3.5" marker-end="url(#mv)"/><text x="160.0" y="90.0" font-size="13" text-anchor="start" fill="#2f9e44" font-weight="700">N</text>
<text x="450.0" y="64.0" font-size="14" text-anchor="middle" fill="#1c7ed6" font-weight="700">Caja empujada con roce</text>
<rect x="410.0" y="150.0" width="80" height="60" rx="4" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
<line x1="450.0" y1="210.0" x2="450.0" y2="280.0" stroke="#c92a2a" stroke-width="3.5" marker-end="url(#mr)"/><text x="460.0" y="280.0" font-size="13" text-anchor="start" fill="#c92a2a" font-weight="700">P</text>
<line x1="450.0" y1="150.0" x2="450.0" y2="80.0" stroke="#2f9e44" stroke-width="3.5" marker-end="url(#mv)"/><text x="460.0" y="90.0" font-size="13" text-anchor="start" fill="#2f9e44" font-weight="700">N</text>
<line x1="490.0" y1="180.0" x2="580.0" y2="180.0" stroke="#1c7ed6" stroke-width="3.5" marker-end="url(#ma)"/><text x="580.0" y="168.0" font-size="13" text-anchor="middle" fill="#1c7ed6" font-weight="700">F aplicada</text>
<line x1="410.0" y1="200.0" x2="340.0" y2="200.0" stroke="#e67700" stroke-width="3.5" marker-end="url(#mn)"/><text x="340.0" y="190.0" font-size="13" text-anchor="middle" fill="#e67700" font-weight="700">roce</text>
<text x="760.0" y="64.0" font-size="14" text-anchor="middle" fill="#1c7ed6" font-weight="700">Lámpara colgada</text>
<circle cx="760" cy="180" r="24" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
<line x1="760.0" y1="204.0" x2="760.0" y2="280.0" stroke="#c92a2a" stroke-width="3.5" marker-end="url(#mr)"/><text x="770.0" y="280.0" font-size="13" text-anchor="start" fill="#c92a2a" font-weight="700">P</text>
<line x1="760.0" y1="156.0" x2="760.0" y2="80.0" stroke="#2f9e44" stroke-width="3.5" marker-end="url(#mv)"/><text x="770.0" y="90.0" font-size="13" text-anchor="start" fill="#2f9e44" font-weight="700">T</text>
<text x="450.0" y="330.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">Solo las fuerzas que actúan sobre el cuerpo dibujado; cada una tiene un agente que la ejerce.</text>
</svg>
