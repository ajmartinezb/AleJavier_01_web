<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Circuito en serie con pila de 12 voltios y resistores de 2, 4 y 6 ohms: corriente de 1 ampere en todos y voltajes de 2, 4 y 6 voltios" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Circuito en serie con pila de 12 voltios y resistores de 2, 4 y 6 ohms: corriente de 1 ampere en todos y voltajes de 2, 4 y 6 voltios</title>
<rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67700"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<text x="450.0" y="28.0" font-size="17" text-anchor="middle" fill="#1a202c" font-weight="700">Circuito en serie</text>
<polyline points="150.0,170.0 150.0,90.0 750.0,90.0 750.0,290.0 150.0,290.0 150.0,210.0" fill="none" stroke="#343a40" stroke-width="2.5" />
<rect x="128" y="176" width="44" height="28" fill="#ffffff" stroke="none"/><line x1="130.0" y1="184.0" x2="170.0" y2="184.0" stroke="#343a40" stroke-width="3" /><line x1="140.0" y1="196.0" x2="160.0" y2="196.0" stroke="#343a40" stroke-width="5" /><text x="176.0" y="188.0" font-size="14" text-anchor="start" fill="#c92a2a" font-weight="700">+</text><text x="176.0" y="204.0" font-size="14" text-anchor="start" fill="#1c7ed6" font-weight="700">−</text><text x="122.0" y="195.0" font-size="13" text-anchor="end" fill="#1a202c" font-weight="700">12 V</text>
<rect x="265.0" y="80" width="70" height="20" fill="#fff3bf" stroke="#e67700" stroke-width="2.5"/><text x="300.0" y="76.0" font-size="13" text-anchor="middle" fill="#1a202c" font-weight="700">2 Ω</text>
<text x="300.0" y="126.0" font-size="13" text-anchor="middle" fill="#c92a2a" font-weight="700">2 V</text>
<rect x="415.0" y="80" width="70" height="20" fill="#fff3bf" stroke="#e67700" stroke-width="2.5"/><text x="450.0" y="76.0" font-size="13" text-anchor="middle" fill="#1a202c" font-weight="700">4 Ω</text>
<text x="450.0" y="126.0" font-size="13" text-anchor="middle" fill="#c92a2a" font-weight="700">4 V</text>
<rect x="565.0" y="80" width="70" height="20" fill="#fff3bf" stroke="#e67700" stroke-width="2.5"/><text x="600.0" y="76.0" font-size="13" text-anchor="middle" fill="#1a202c" font-weight="700">6 Ω</text>
<text x="600.0" y="126.0" font-size="13" text-anchor="middle" fill="#c92a2a" font-weight="700">6 V</text>
<line x1="420.0" y1="274.0" x2="500.0" y2="274.0" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#mv)"/>
<text x="460.0" y="264.0" font-size="13" text-anchor="middle" fill="#2f9e44" font-weight="700">I = 1 A en todo el circuito</text>
<text x="450.0" y="340.0" font-size="13" text-anchor="middle" fill="#1a202c" font-weight="normal">Voltajes: 2 V + 4 V + 6 V = 12 V · Resistencia equivalente: 2 + 4 + 6 = 12 Ω</text>
</svg>
