<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-label="Fuente puntual con sombra nítida y eclipse de Sol con sombra y penumbra de la Luna sobre la Tierra" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
