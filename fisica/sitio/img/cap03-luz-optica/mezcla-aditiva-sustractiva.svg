<text x="235.0" y="74.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">Luces: rojo, verde y azul</text>
<circle cx="190" cy="195" r="85" fill="#ff0000" style="mix-blend-mode:screen"/>
