<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Haz de luz blanca que entra a un prisma y sale separado en colores, con el rojo menos desviado y el violeta más desviado" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
