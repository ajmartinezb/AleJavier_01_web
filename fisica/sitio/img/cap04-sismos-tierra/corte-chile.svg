<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485" width="900" height="485" role="img" aria-label="Corte oeste-este de Chile central con la placa de Nazca que se hunde bajo la Sudamericana, la fosa, la cordillera de la Costa, la depresión intermedia y los Andes con volcanes, y sismos cada vez más profundos hacia el este" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Corte oeste-este de Chile central con la placa de Nazca que se hunde bajo la Sudamericana, la fosa, la cordillera de la Costa, la depresión intermedia y los Andes con volcanes, y sismos cada vez más profundos hacia el este</title>
<rect width="900" height="485" fill="#ffffff"/>
<defs><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67700"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<text x="450.0" y="28.0" font-size="17" text-anchor="middle" fill="#1a202c" font-weight="700">Corte esquemático de Chile central (oeste → este)</text>
<rect x="20" y="140" width="230" height="30" fill="#a5d8ff" opacity="0.7"/>
<path d="M20,170 L250,170 L270,210 L300,160 L360,120 L420,150 L500,145 L560,80 L620,40 L680,60 L760,110 L880,130 L880,230 L20,230 z" fill="#8d6e63" opacity="0.85"/>
