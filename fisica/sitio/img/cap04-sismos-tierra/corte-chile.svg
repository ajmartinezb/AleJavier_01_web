<text x="800.0" y="190.0" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700">placa Sudamericana</text>
<text x="270.0" y="256.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="700">fosa</text>
<text x="350.0" y="100.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="700">cordillera de la Costa</text>
<text x="500.0" y="125.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="700">depresión intermedia</text>
<text x="760.0" y="98.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="700">cordillera de los Andes</text>
<path d="M605,50 L620,20 L635,50 z" fill="#c92a2a"/>
<circle cx="300" cy="230" r="5" fill="#f59f00" stroke="#1a202c"/>
<circle cx="360" cy="250" r="5" fill="#f59f00" stroke="#1a202c"/>
