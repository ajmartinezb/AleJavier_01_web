<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Gráfico del período orbital al cuadrado, en años al cuadrado, en función del semieje mayor al cubo, en unidades astronómicas al cubo. Mercurio, Venus, la Tierra, Marte y Ceres caen sobre una misma recta que pasa por el origen, de pendiente 1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
