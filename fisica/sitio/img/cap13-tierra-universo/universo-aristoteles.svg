<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Esferas concéntricas con la Tierra inmóvil en el centro; hacia afuera, las esferas de la Luna, Mercurio, Venus, el Sol, Marte, Júpiter, Saturno y las estrellas fijas. Bajo la Luna está el mundo sublunar, de cuatro elementos y cambiante; desde la Luna hacia afuera, el mundo supralunar, de éter, perfecto y con movimiento circular" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Esferas concéntricas con la Tierra inmóvil en el centro; hacia afuera, las esferas de la Luna, Mercurio, Venus, el Sol, Marte, Júpiter, Saturno y las estrellas fijas. Bajo la Luna está el mundo sublunar, de cuatro elementos y cambiante; desde la Luna hacia afuera, el mundo supralunar, de éter, perfecto y con movimiento circular</title>
<rect width="900" height="560" fill="#ffffff"/>
<defs><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67700"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<text x="450.0" y="28.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">El universo de Aristóteles</text>
<circle cx="300.0" cy="300.0" r="240.0" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5" />
<circle cx="300.0" cy="300.0" r="34.0" fill="#e7f5ff" stroke="none" stroke-width="1.5" />
<circle cx="300.0" cy="300.0" r="222.0" fill="none" stroke="#7048e8" stroke-width="2" />
<circle cx="300.0" cy="300.0" r="192.0" fill="none" stroke="#4a5568" stroke-width="1.3" />
<circle cx="300.0" cy="300.0" r="166.0" fill="none" stroke="#4a5568" stroke-width="1.3" />
<circle cx="300.0" cy="300.0" r="140.0" fill="none" stroke="#4a5568" stroke-width="1.3" />
<circle cx="300.0" cy="300.0" r="114.0" fill="none" stroke="#f59f00" stroke-width="1.3" />
<circle cx="300.0" cy="300.0" r="88.0" fill="none" stroke="#4a5568" stroke-width="1.3" />
<circle cx="300.0" cy="300.0" r="62.0" fill="none" stroke="#4a5568" stroke-width="1.3" />
<circle cx="300.0" cy="300.0" r="34.0" fill="none" stroke="#4a5568" stroke-width="2" />
<circle cx="327.9" cy="280.5" r="5.0" fill="#1a202c" stroke="none" stroke-width="1.5" />
<circle cx="350.8" cy="264.4" r="5.0" fill="#1a202c" stroke="none" stroke-width="1.5" />
<circle cx="372.1" cy="249.5" r="5.0" fill="#1a202c" stroke="none" stroke-width="1.5" />
<circle cx="393.4" cy="234.6" r="5.0" fill="#f59f00" stroke="none" stroke-width="1.5" />
<circle cx="414.7" cy="219.7" r="5.0" fill="#1a202c" stroke="none" stroke-width="1.5" />
<circle cx="436.0" cy="204.8" r="5.0" fill="#1a202c" stroke="none" stroke-width="1.5" />
<circle cx="457.3" cy="189.9" r="5.0" fill="#1a202c" stroke="none" stroke-width="1.5" />
<circle cx="481.9" cy="172.7" r="3.0" fill="#7048e8" stroke="none" stroke-width="1.5" />
<text x="300.0" y="286.0" font-size="10" text-anchor="middle" fill="#1a202c" font-weight="normal">Luna</text>
<text x="300.0" y="252.0" font-size="10" text-anchor="middle" fill="#1a202c" font-weight="normal">Mercurio</text>
<text x="300.0" y="226.0" font-size="10" text-anchor="middle" fill="#1a202c" font-weight="normal">Venus</text>
<text x="300.0" y="200.0" font-size="11" text-anchor="middle" fill="#1a202c" font-weight="normal">Sol</text>
<text x="300.0" y="174.0" font-size="11" text-anchor="middle" fill="#1a202c" font-weight="normal">Marte</text>
<text x="300.0" y="148.0" font-size="11" text-anchor="middle" fill="#1a202c" font-weight="normal">Júpiter</text>
<text x="300.0" y="122.0" font-size="11" text-anchor="middle" fill="#1a202c" font-weight="normal">Saturno</text>
<text x="300.0" y="92.0" font-size="11" text-anchor="middle" fill="#1a202c" font-weight="normal">estrellas fijas</text>
<circle cx="300.0" cy="300.0" r="10.0" fill="#2f9e44" stroke="none" stroke-width="1.5" />
<text x="300.0" y="324.0" font-size="11" text-anchor="middle" fill="#1a202c" font-weight="700">Tierra</text>
<text x="300.0" y="532.0" font-size="11" text-anchor="middle" fill="#7048e8" font-weight="normal" font-style="italic">primer motor</text>
<rect x="570" y="80" width="300" height="130" rx="10" fill="#e7f5ff" stroke="#1c7ed6"/>
<text x="584.0" y="104.0" font-size="14" text-anchor="start" fill="#1c7ed6" font-weight="700">Mundo sublunar</text>
<text x="584.0" y="126.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">Bajo la esfera de la Luna.</text>
<text x="584.0" y="144.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">Cuatro elementos: tierra, agua,</text>
<text x="584.0" y="162.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">aire y fuego.</text>
<text x="584.0" y="180.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">Todo cambia, nace y muere.</text>
<text x="584.0" y="198.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">Movimiento natural: rectilíneo.</text>
<rect x="570" y="240" width="300" height="130" rx="10" fill="#f3f0ff" stroke="#7048e8"/>
<text x="584.0" y="264.0" font-size="14" text-anchor="start" fill="#7048e8" font-weight="700">Mundo supralunar</text>
<text x="584.0" y="286.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">Desde la Luna hacia afuera.</text>
<text x="584.0" y="304.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">Un quinto elemento: el éter.</text>
<text x="584.0" y="322.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">Perfecto e inmutable.</text>
<text x="584.0" y="340.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">Movimiento natural: circular</text>
<text x="584.0" y="358.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">y uniforme, para siempre.</text>
<text x="570.0" y="410.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">La Tierra, inmóvil, en el centro;</text>
<text x="570.0" y="428.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">cada astro va en su esfera transparente.</text>
<text x="570.0" y="446.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">Esquema simplificado; sin escala.</text>
</svg>
