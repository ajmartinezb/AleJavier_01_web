<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Gráfico de la rapidez de alejamiento de galaxias, en kilómetros por segundo, en función de su distancia, en megapársecs. Los puntos siguen una recta que pasa por el origen, cuya pendiente es la constante de Hubble, de unos 70 kilómetros por segundo por megapársec" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
