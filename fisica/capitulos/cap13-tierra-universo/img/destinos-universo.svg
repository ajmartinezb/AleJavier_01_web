<text x="450.0" y="28.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">¿Cómo podría terminar el universo?</text>
<line x1="110.0" y1="450.0" x2="830.0" y2="450.0" stroke="#4a5568" stroke-width="1.5" marker-end="url(#mg)"/>
