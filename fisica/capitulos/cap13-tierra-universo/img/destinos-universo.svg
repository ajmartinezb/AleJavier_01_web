<text x="830.0" y="476.0" font-size="12" text-anchor="end" fill="#4a5568" font-weight="normal">tiempo</text>
<text x="116.0" y="74.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">tamaño del universo (distancia entre galaxias)</text>
