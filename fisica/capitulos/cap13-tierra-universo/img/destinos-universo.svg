<text x="792.0" y="422.4" font-size="13" text-anchor="end" fill="#2f9e44" font-weight="700">Big Crunch</text>
<text x="792.0" y="438.4" font-size="11" text-anchor="end" fill="#2f9e44" font-weight="normal">(gran implosión)</text>
<text x="826.0" y="173.4" font-size="13" text-anchor="end" fill="#1c7ed6" font-weight="700">Big Freeze</text>
<text x="826.0" y="189.4" font-size="11" text-anchor="end" fill="#1c7ed6" font-weight="normal">(expansión eterna; todo se enfría)</text>
