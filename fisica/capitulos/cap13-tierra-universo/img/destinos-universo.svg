<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" width="900" height="505" role="img" aria-label="Gráfico cualitativo del tamaño del universo en función del tiempo. Desde el Big Bang hasta hoy la curva crece. Después se abren cuatro posibilidades: Big Crunch, en que el universo deja de expandirse y colapsa; Big Freeze, expansión eterna cada vez más lenta; expansión acelerada, que es lo que se mide hoy; y Big Rip, en que la expansión se vuelve infinita en un tiempo finito" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Gráfico cualitativo del tamaño del universo en función del tiempo. Desde el Big Bang hasta hoy la curva crece. Después se abren cuatro posibilidades: Big Crunch, en que el universo deja de expandirse y colapsa; Big Freeze, expansión eterna cada vez más lenta; expansión acelerada, que es lo que se mide hoy; y Big Rip, en que la expansión se vuelve infinita en un tiempo finito</title>
