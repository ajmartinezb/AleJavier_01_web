<text x="615.4" y="316.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">650</text>
<line x1="712.7" y1="292.0" x2="712.7" y2="300.0" stroke="#4a5568" stroke-width="1" />
<text x="712.7" y="316.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">700</text>
<line x1="810.0" y1="292.0" x2="810.0" y2="300.0" stroke="#4a5568" stroke-width="1" />
<text x="810.0" y="316.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">750</text>
<text x="810.0" y="336.0" font-size="12" text-anchor="end" fill="#4a5568" font-weight="normal">longitud de onda λ (nm)</text>
<text x="450.0" y="368.0" font-size="13" text-anchor="middle" fill="#1a202c" font-weight="700">Las mismas líneas aparecen desplazadas hacia longitudes de onda mayores (hacia el rojo).</text>
<text x="450.0" y="388.0" font-size="13" text-anchor="middle" fill="#1a202c" font-weight="normal">z = Δλ / λ = (689 − 656) / 656 ≈ 0,05. Para z pequeño, v ≈ z · c ≈ 15 000 km/s de alejamiento.</text>
