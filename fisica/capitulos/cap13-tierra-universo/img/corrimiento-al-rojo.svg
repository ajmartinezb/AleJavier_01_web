<line x1="627.7" y1="80.0" x2="627.7" y2="140.0" stroke="#000" stroke-width="3.5" />
<text x="90.0" y="220.0" font-size="14" text-anchor="start" fill="#1a202c" font-weight="700">Hidrógeno en una galaxia lejana (z = 0,05)</text>
