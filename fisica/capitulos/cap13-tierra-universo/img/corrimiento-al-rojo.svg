<text x="226.2" y="316.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">450</text>
<line x1="323.5" y1="292.0" x2="323.5" y2="300.0" stroke="#4a5568" stroke-width="1" />
<text x="323.5" y="316.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">500</text>
<line x1="420.8" y1="292.0" x2="420.8" y2="300.0" stroke="#4a5568" stroke-width="1" />
<text x="420.8" y="316.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">550</text>
