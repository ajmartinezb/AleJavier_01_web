<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 405" width="900" height="405" role="img" aria-label="Dos franjas del espectro visible con cuatro líneas oscuras del hidrógeno. En la franja de laboratorio las líneas están en 410, 434, 486 y 656 nanómetros; en la de una galaxia lejana las mismas líneas aparecen desplazadas unos 5 por ciento hacia longitudes de onda mayores, hacia el rojo" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Dos franjas del espectro visible con cuatro líneas oscuras del hidrógeno. En la franja de laboratorio las líneas están en 410, 434, 486 y 656 nanómetros; en la de una galaxia lejana las mismas líneas aparecen desplazadas unos 5 por ciento hacia longitudes de onda mayores, hacia el rojo</title>
<rect width="900" height="405" fill="#ffffff"/>
<defs><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67700"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<text x="450.0" y="28.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Corrimiento al rojo en el espectro de una galaxia</text>
