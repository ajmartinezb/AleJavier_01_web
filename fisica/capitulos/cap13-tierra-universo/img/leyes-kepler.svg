<text x="142.0" y="274.0" font-size="13" text-anchor="end" fill="#c92a2a" font-weight="700">perihelio</text>
<text x="758.0" y="274.0" font-size="13" text-anchor="start" fill="#2f9e44" font-weight="700">afelio</text>
<text x="140.0" y="120.0" font-size="12" text-anchor="end" fill="#c92a2a" font-weight="normal">arco largo: el planeta</text>
