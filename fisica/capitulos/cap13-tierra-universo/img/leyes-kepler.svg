<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586.0" width="900" height="586.0" role="img" aria-label="Órbita elíptica muy alargada con el Sol en uno de los focos y el otro foco vacío. Cerca del Sol está el perihelio y en el extremo opuesto el afelio. Dos sectores sombreados de igual área: el del perihelio es corto y ancho, con un arco largo, y el del afelio es largo y angosto, con un arco corto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Órbita elíptica muy alargada con el Sol en uno de los focos y el otro foco vacío. Cerca del Sol está el perihelio y en el extremo opuesto el afelio. Dos sectores sombreados de igual área: el del perihelio es corto y ancho, con un arco largo, y el del afelio es largo y angosto, con un arco corto</title>
