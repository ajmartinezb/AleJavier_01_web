<text x="680.0" y="150.0" font-size="12" text-anchor="end" fill="#2f9e44" font-weight="normal">arco corto: va</text>
<text x="680.0" y="166.0" font-size="12" text-anchor="end" fill="#2f9e44" font-weight="normal">más lento</text>
<text x="450.0" y="548.0" font-size="13" text-anchor="middle" fill="#1a202c" font-weight="700">Las dos áreas sombreadas son iguales: el planeta las barre en el mismo tiempo.</text>
<text x="450.0" y="568.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal" font-style="italic">Excentricidad muy exagerada: la órbita de la Tierra (e ≈ 0,017) se vería como una circunferencia.</text>
