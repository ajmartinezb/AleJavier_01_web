<circle cx="660.0" cy="240.0" r="95.0" fill="none" stroke="#e67700" stroke-width="1.5" stroke-dasharray="3 4"/>
<circle cx="660.0" cy="440.0" r="10.0" fill="#2f9e44" stroke="none" stroke-width="1.5" />
<text x="660.0" y="468.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="700">Tierra</text>
<circle cx="660.0" cy="335.0" r="7.0" fill="#fff3bf" stroke="#e67700" stroke-width="1" />
<circle cx="742.3" cy="287.5" r="7.0" fill="#fff3bf" stroke="#e67700" stroke-width="1" />
<circle cx="742.3" cy="192.5" r="7.0" fill="#fff3bf" stroke="#e67700" stroke-width="1" />
<circle cx="660.0" cy="145.0" r="7.0" fill="#fff3bf" stroke="#e67700" stroke-width="1" />
<circle cx="577.7" cy="192.5" r="7.0" fill="#fff3bf" stroke="#e67700" stroke-width="1" />
<circle cx="577.7" cy="287.5" r="7.0" fill="#fff3bf" stroke="#e67700" stroke-width="1" />
<text x="660.0" y="131.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="normal">lejos: casi llena y pequeña</text>
<text x="676.0" y="357.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">cerca: creciente y grande</text>
