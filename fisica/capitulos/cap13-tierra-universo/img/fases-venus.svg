<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="Dos esquemas. A la izquierda, el modelo de Ptolomeo: Venus gira en un epiciclo siempre entre la Tierra y el Sol, por lo que desde la Tierra solo se vería nueva o creciente. A la derecha, el modelo heliocéntrico: Venus gira en torno al Sol y desde la Tierra se ve casi llena y pequeña cuando está lejos, detrás del Sol, y creciente y grande cuando está cerca" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Dos esquemas. A la izquierda, el modelo de Ptolomeo: Venus gira en un epiciclo siempre entre la Tierra y el Sol, por lo que desde la Tierra solo se vería nueva o creciente. A la derecha, el modelo heliocéntrico: Venus gira en torno al Sol y desde la Tierra se ve casi llena y pequeña cuando está lejos, detrás del Sol, y creciente y grande cuando está cerca</title>
<rect width="900" height="580" fill="#ffffff"/>
