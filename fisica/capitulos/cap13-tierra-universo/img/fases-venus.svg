<circle cx="220.0" cy="315.0" r="7.0" fill="#fff3bf" stroke="#e67700" stroke-width="1" />
<circle cx="267.6" cy="287.5" r="7.0" fill="#fff3bf" stroke="#e67700" stroke-width="1" />
<circle cx="267.6" cy="232.5" r="7.0" fill="#fff3bf" stroke="#e67700" stroke-width="1" />
<rect x="100" y="334" width="240" height="60" fill="#fff"/>
<text x="220.0" y="350.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="normal">Venus nunca pasa detrás del Sol:</text>
<text x="220.0" y="368.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="normal">desde la Tierra se vería</text>
<text x="220.0" y="386.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="normal">solo nueva o creciente</text>
