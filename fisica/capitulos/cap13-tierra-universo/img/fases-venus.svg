<circle cx="196.0" cy="500.0" r="14.0" fill="#343a40" stroke="#343a40" stroke-width="1" /><path d="M196,486 A14,14 0 0 1 196,514 A11.20,14 0 0 0 196,486 z" fill="#fff3bf" stroke="#e67700" stroke-width="0.8" transform="rotate(0 196 500)"/>
