<text x="248.0" y="114.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="700">Sol</text>
<line x1="220.0" y1="440.0" x2="220.0" y2="110.0" stroke="#4a5568" stroke-width="1" stroke-dasharray="5 4"/>
