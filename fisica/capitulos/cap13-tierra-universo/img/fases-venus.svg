<text x="281.0" y="300.0" font-size="11" text-anchor="start" fill="#e67700" font-weight="normal">epiciclo</text>
<circle cx="220.0" cy="205.0" r="7.0" fill="#fff3bf" stroke="#e67700" stroke-width="1" />
