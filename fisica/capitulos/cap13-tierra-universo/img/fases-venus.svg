<circle cx="626.0" cy="500.0" r="13.0" fill="#343a40" stroke="#343a40" stroke-width="1" /><path d="M626,487 A13,13 0 0 1 626,513 A0.00,13 0 0 0 626,487 z" fill="#fff3bf" stroke="#e67700" stroke-width="0.8" transform="rotate(0 626 500)"/>
<circle cx="673.0" cy="500.0" r="18.0" fill="#343a40" stroke="#343a40" stroke-width="1" /><path d="M673,482 A18,18 0 0 1 673,518 A9.00,18 0 0 0 673,482 z" fill="#fff3bf" stroke="#e67700" stroke-width="0.8" transform="rotate(0 673 500)"/>
<circle cx="725.0" cy="500.0" r="24.0" fill="#343a40" stroke="#343a40" stroke-width="1" /><path d="M725,476 A24,24 0 0 1 725,524 A20.16,24 0 0 0 725,476 z" fill="#fff3bf" stroke="#e67700" stroke-width="0.8" transform="rotate(0 725 500)"/>
<text x="450.0" y="548.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">Abajo: cómo se vería Venus desde la Tierra en cada caso (la parte iluminada mira hacia el Sol).</text>
<text x="450.0" y="566.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="700">Galileo observó en 1610 el ciclo completo de fases y el cambio de tamaño: el esquema de la izquierda no lo explica.</text>
