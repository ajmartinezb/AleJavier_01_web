<text x="240.0" y="486.0" font-size="12" text-anchor="middle" fill="#c92a2a" font-weight="normal">órbita de Marte</text>
<text x="240.0" y="442.0" font-size="12" text-anchor="middle" fill="#1c7ed6" font-weight="normal">órbita de la Tierra</text>
<text x="240.0" y="540.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal" font-style="italic">Líneas punteadas: dirección en que se ve Marte desde la Tierra.</text>
<text x="690.0" y="62.0" font-size="14" text-anchor="middle" fill="#1a202c" font-weight="700">Cómo se ve en el cielo, noche a noche</text>
