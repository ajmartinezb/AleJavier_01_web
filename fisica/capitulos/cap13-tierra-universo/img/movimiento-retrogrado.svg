<polyline points="837.7,134.0 685.7,136.0 618.1,150.0 690.0,176.0 761.9,158.0 694.3,148.0 542.3,132.0" fill="none" stroke="#ff8787" stroke-width="2" marker-end="url(#mr)"/>
<circle cx="837.7" cy="134.0" r="5.0" fill="#ff6b6b" stroke="none" stroke-width="1.5" />
