<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" width="900" height="555" role="img" aria-label="A la izquierda, vista desde arriba del Sol y de las órbitas de la Tierra y de Marte, con siete posiciones numeradas de cada planeta y la línea de visión de la Tierra hacia Marte en cada una. A la derecha, las posiciones aparentes de Marte sobre el fondo de estrellas: avanza de 1 a 3, retrocede de 3 a 5 y vuelve a avanzar de 5 a 7, formando un lazo" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
