<circle cx="685.7" cy="136.0" r="5.0" fill="#ff6b6b" stroke="none" stroke-width="1.5" />
<text x="685.7" y="126.0" font-size="12" text-anchor="middle" fill="#ffc9c9" font-weight="700">2</text>
<circle cx="618.1" cy="150.0" r="5.0" fill="#ff6b6b" stroke="none" stroke-width="1.5" />
<text x="618.1" y="170.0" font-size="12" text-anchor="middle" fill="#ffc9c9" font-weight="700">3</text>
<circle cx="690.0" cy="176.0" r="5.0" fill="#ff6b6b" stroke="none" stroke-width="1.5" />
<text x="690.0" y="196.0" font-size="12" text-anchor="middle" fill="#ffc9c9" font-weight="700">4</text>
<circle cx="761.9" cy="158.0" r="5.0" fill="#ff6b6b" stroke="none" stroke-width="1.5" />
<text x="761.9" y="178.0" font-size="12" text-anchor="middle" fill="#ffc9c9" font-weight="700">5</text>
<circle cx="694.3" cy="148.0" r="5.0" fill="#ff6b6b" stroke="none" stroke-width="1.5" />
<text x="694.3" y="168.0" font-size="12" text-anchor="middle" fill="#ffc9c9" font-weight="700">6</text>
<circle cx="542.3" cy="132.0" r="5.0" fill="#ff6b6b" stroke="none" stroke-width="1.5" />
<text x="542.3" y="122.0" font-size="12" text-anchor="middle" fill="#ffc9c9" font-weight="700">7</text>
<text x="510.0" y="240.0" font-size="11" text-anchor="start" fill="#adb5bd" font-weight="normal" font-style="italic">estrellas lejanas (fondo)</text>
<text x="500.0" y="350.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">1 → 3: Marte avanza entre las estrellas.</text>
<text x="500.0" y="370.0" font-size="13" text-anchor="start" fill="#c92a2a" font-weight="700">3 → 5: parece retroceder (movimiento retrógrado).</text>
<text x="500.0" y="390.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">5 → 7: vuelve a avanzar.</text>
<text x="500.0" y="410.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal"></text>
<text x="500.0" y="430.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">La Tierra, en su órbita interior, es más rápida</text>
<text x="500.0" y="450.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">y «adelanta» a Marte cerca de la posición 4</text>
<text x="500.0" y="470.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">(oposición). Por eso, durante unas semanas,</text>
<text x="500.0" y="490.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">Marte parece moverse hacia atrás. Marte</text>
<text x="500.0" y="510.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="700">nunca retrocede de verdad.</text>
<text x="500.0" y="540.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">Posiciones cada 36 días. Esquema sin escala.</text>
</svg>
