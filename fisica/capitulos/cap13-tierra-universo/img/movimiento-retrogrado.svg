<circle cx="188.3" cy="258.8" r="6.0" fill="#1c7ed6" stroke="none" stroke-width="1.5" />
<circle cx="196.0" cy="203.4" r="5.0" fill="#c92a2a" stroke="none" stroke-width="1.5" />
<text x="200.0" y="279.0" font-size="11" text-anchor="middle" fill="#1c7ed6" font-weight="700">5</text>
<text x="190.8" y="192.3" font-size="11" text-anchor="middle" fill="#c92a2a" font-weight="700">5</text>
