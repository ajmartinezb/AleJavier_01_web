<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 535" width="900" height="535" role="img" aria-label="Tres esquemas. Ptolomeo: la Tierra inmóvil al centro y alrededor la Luna, Mercurio, Venus, el Sol, Marte, Júpiter y Saturno. Copérnico: el Sol al centro y alrededor Mercurio, Venus, la Tierra con la Luna, Marte, Júpiter y Saturno. Tycho Brahe: la Tierra al centro, con la Luna y el Sol girando en torno a ella, y los demás planetas girando en torno al Sol" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
