<circle cx="470.6" cy="249.8" r="8.0" fill="#c92a2a" stroke="none" stroke-width="1.5" />
<text x="482.6" y="241.8" font-size="13" text-anchor="start" fill="#c92a2a" font-weight="700">planeta</text>
<text x="528.2" y="220.7" font-size="13" text-anchor="start" fill="#1c7ed6" font-weight="700">epiciclo</text>
<text x="170.0" y="436.0" font-size="13" text-anchor="start" fill="#4a5568" font-weight="700">deferente</text>
<circle cx="308.0" cy="306.0" r="11.0" fill="#2f9e44" stroke="none" stroke-width="1.5" />
<text x="308.0" y="332.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="700">Tierra</text>
<circle cx="352.0" cy="294.0" r="3.5" fill="#1a202c" stroke="none" stroke-width="1.5" />
<text x="358.0" y="288.0" font-size="11" text-anchor="start" fill="#1a202c" font-weight="normal">ecuante</text>
<text x="580.0" y="120.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">El planeta gira en un círculo pequeño,</text>
<text x="580.0" y="140.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">el epiciclo, cuyo centro recorre un</text>
<text x="580.0" y="160.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">círculo grande, el deferente.</text>
<text x="580.0" y="180.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal"></text>
<text x="580.0" y="200.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">Visto desde la Tierra, el planeta</text>
<text x="580.0" y="220.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">a veces avanza y a veces</text>
<text x="580.0" y="240.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">retrocede: la línea punteada roja</text>
<text x="580.0" y="260.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">muestra los lazos.</text>
<text x="580.0" y="280.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal"></text>
<text x="580.0" y="300.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">La Tierra no está exactamente en</text>
<text x="580.0" y="320.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">el centro del deferente, y el</text>
<text x="580.0" y="340.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">centro del epiciclo se mueve</text>
<text x="580.0" y="360.0" font-size="13" text-anchor="start" fill="#1a202c" font-weight="normal">uniforme visto desde el ecuante.</text>
<text x="580.0" y="520.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">Sin escala; un epiciclo por planeta.</text>
</svg>
