<path d="M834,150 A70,70 0 0 1 834,230" fill="none" stroke="#c92a2a" stroke-width="4"/>
<ellipse cx="716" cy="190" rx="8" ry="26" fill="#d0ebff" stroke="#1c7ed6"/>
<line x1="620.0" y1="168.0" x2="716.0" y2="168.0" stroke="#e67700" stroke-width="1.8" />
<line x1="716.0" y1="168.0" x2="840.0" y2="190.0" stroke="#e67700" stroke-width="1.8" />
<line x1="620.0" y1="212.0" x2="716.0" y2="212.0" stroke="#e67700" stroke-width="1.8" />
<line x1="716.0" y1="212.0" x2="840.0" y2="190.0" stroke="#e67700" stroke-width="1.8" />
<text x="770.0" y="290.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">la imagen cae sobre la retina</text>
<text x="170.0" y="320.0" font-size="13" text-anchor="middle" fill="#2f9e44" font-weight="700">Corrección: lente divergente (−D)</text>
<text x="470.0" y="320.0" font-size="13" text-anchor="middle" fill="#2f9e44" font-weight="700">Corrección: lente convergente (+D)</text>
<text x="770.0" y="320.0" font-size="13" text-anchor="middle" fill="#2f9e44" font-weight="700">ojo normal o con su lente</text>
<text x="450.0" y="350.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">En rojo, la retina; en celeste, el cristalino. Esquema sin escala.</text>
