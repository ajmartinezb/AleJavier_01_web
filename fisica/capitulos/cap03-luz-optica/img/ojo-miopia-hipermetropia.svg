<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" width="900" height="365" role="img" aria-label="Ojo miope con la imagen delante de la retina, ojo hipermétrope con la imagen detrás y ojo corregido con la imagen sobre la retina" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Ojo miope con la imagen delante de la retina, ojo hipermétrope con la imagen detrás y ojo corregido con la imagen sobre la retina</title>
<rect width="900" height="365" fill="#ffffff"/>
<defs><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67700"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<text x="450.0" y="28.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Defectos de la visión y su corrección</text>
<text x="140.0" y="62.0" font-size="14" text-anchor="middle" fill="#1c7ed6" font-weight="700">Miopía</text>
<circle cx="170" cy="190" r="70" fill="#f8f9fa" stroke="#4a5568" stroke-width="2"/>
<path d="M234,150 A70,70 0 0 1 234,230" fill="none" stroke="#c92a2a" stroke-width="4"/>
<ellipse cx="116" cy="190" rx="8" ry="26" fill="#d0ebff" stroke="#1c7ed6"/>
<line x1="20.0" y1="168.0" x2="116.0" y2="168.0" stroke="#e67700" stroke-width="1.8" />
<line x1="116.0" y1="168.0" x2="200.0" y2="190.0" stroke="#e67700" stroke-width="1.8" />
<line x1="200.0" y1="190.0" x2="240.0" y2="178.0" stroke="#e67700" stroke-width="1.8" stroke-dasharray="5 4"/>
<line x1="20.0" y1="212.0" x2="116.0" y2="212.0" stroke="#e67700" stroke-width="1.8" />
<line x1="116.0" y1="212.0" x2="200.0" y2="190.0" stroke="#e67700" stroke-width="1.8" />
<line x1="200.0" y1="190.0" x2="240.0" y2="202.0" stroke="#e67700" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="170.0" y="290.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">la imagen se forma delante de la retina</text>
<text x="440.0" y="62.0" font-size="14" text-anchor="middle" fill="#1c7ed6" font-weight="700">Hipermetropía</text>
<circle cx="470" cy="190" r="70" fill="#f8f9fa" stroke="#4a5568" stroke-width="2"/>
<path d="M534,150 A70,70 0 0 1 534,230" fill="none" stroke="#c92a2a" stroke-width="4"/>
<ellipse cx="416" cy="190" rx="8" ry="26" fill="#d0ebff" stroke="#1c7ed6"/>
<line x1="320.0" y1="168.0" x2="416.0" y2="168.0" stroke="#e67700" stroke-width="1.8" />
<line x1="416.0" y1="168.0" x2="580.0" y2="190.0" stroke="#e67700" stroke-width="1.8" />
<line x1="536.0" y1="184.0" x2="580.0" y2="190.0" stroke="#e67700" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="320.0" y1="212.0" x2="416.0" y2="212.0" stroke="#e67700" stroke-width="1.8" />
<line x1="416.0" y1="212.0" x2="580.0" y2="190.0" stroke="#e67700" stroke-width="1.8" />
<line x1="536.0" y1="196.0" x2="580.0" y2="190.0" stroke="#e67700" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="470.0" y="290.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">la imagen se formaría detrás de la retina</text>
<text x="740.0" y="62.0" font-size="14" text-anchor="middle" fill="#1c7ed6" font-weight="700">Corregidos</text>
