<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" width="900" height="425" role="img" aria-label="Refracción aire a agua acercándose a la normal, vidrio a aire alejándose de la normal y rayo perpendicular sin desviación" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Refracción aire a agua acercándose a la normal, vidrio a aire alejándose de la normal y rayo perpendicular sin desviación</title>
<rect width="900" height="425" fill="#ffffff"/>
<defs><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67700"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<text x="450.0" y="28.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Refracción de la luz</text>
<text x="160.0" y="64.0" font-size="13" text-anchor="middle" fill="#1c7ed6" font-weight="700">Aire → agua: se acerca a la normal</text>
<rect x="30" y="230" width="260" height="150" fill="#d0ebff"/>
<text x="38.0" y="220.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">aire (n = 1,00)</text>
<text x="38.0" y="370.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">agua (n = 1,33)</text>
<line x1="160.0" y1="80.0" x2="160.0" y2="380.0" stroke="#4a5568" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="52.8" y1="140.0" x2="160.0" y2="230.0" stroke="#c92a2a" stroke-width="2.2" /><line x1="52.8" y1="140.0" x2="106.4" y2="185.0" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#mr)" />
<line x1="160.0" y1="230.0" x2="240.6" y2="344.4" stroke="#c92a2a" stroke-width="2.2" /><line x1="160.0" y1="230.0" x2="200.3" y2="287.2" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#mr)" />
<text x="138.0" y="190.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="normal">50°</text>
<text x="138.0" y="290.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="normal">35°</text>
<text x="450.0" y="64.0" font-size="13" text-anchor="middle" fill="#1c7ed6" font-weight="700">Vidrio → aire: se aleja de la normal</text>
<rect x="320" y="80" width="260" height="150" fill="#e6fcf5"/>
<text x="328.0" y="98.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">vidrio (n = 1,50)</text>
<text x="328.0" y="250.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">aire (n = 1,00)</text>
<line x1="450.0" y1="80.0" x2="450.0" y2="380.0" stroke="#4a5568" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="380.0" y1="108.8" x2="450.0" y2="230.0" stroke="#c92a2a" stroke-width="2.2" /><line x1="380.0" y1="108.8" x2="415.0" y2="169.4" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#mr)" />
<line x1="450.0" y1="230.0" x2="555.0" y2="322.6" stroke="#c92a2a" stroke-width="2.2" /><line x1="450.0" y1="230.0" x2="502.5" y2="276.3" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#mr)" />
<text x="430.0" y="180.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="normal">30°</text>
<text x="428.0" y="280.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="normal">49°</text>
<text x="750.0" y="64.0" font-size="13" text-anchor="middle" fill="#1c7ed6" font-weight="700">Incidencia perpendicular: no se desvía</text>
<rect x="620" y="230" width="260" height="150" fill="#d0ebff"/>
<text x="628.0" y="220.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">aire</text>
<text x="628.0" y="370.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">agua</text>
<line x1="750.0" y1="90.0" x2="750.0" y2="230.0" stroke="#c92a2a" stroke-width="2.2" /><line x1="750.0" y1="90.0" x2="750.0" y2="160.0" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#mr)" />
<line x1="750.0" y1="230.0" x2="750.0" y2="370.0" stroke="#c92a2a" stroke-width="2.2" /><line x1="750.0" y1="230.0" x2="750.0" y2="300.0" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#mr)" />
<text x="760.0" y="290.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">cambia la rapidez,</text>
<text x="760.0" y="305.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">no la dirección</text>
<text x="450.0" y="410.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">Ángulos medidos desde la normal (línea punteada), calculados con la ley de Snell.</text>
</svg>
