<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-label="Bloque en reposo en una rampa de 30 grados con peso vertical, sus partes paralela y perpendicular, normal perpendicular a la rampa y roce estático rampa arriba" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Bloque en reposo en una rampa de 30 grados con peso vertical, sus partes paralela y perpendicular, normal perpendicular a la rampa y roce estático rampa arriba</title>
<rect width="900" height="410" fill="#ffffff"/>
<defs><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67700"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<text x="450.0" y="28.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Fuerzas en un plano inclinado</text>
<polygon points="150,360 669.6,360 669.6,60.0" fill="#f1f3f5" stroke="#1a202c" stroke-width="2"/>
<text x="220.0" y="350.0" font-size="13" text-anchor="middle" fill="#1a202c" font-weight="normal">30°</text>
<polygon points="401.1,215.0 470.4,175.0 438.4,119.6 369.1,159.6" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
<line x1="419.8" y1="167.3" x2="419.8" y2="287.3" stroke="#c92a2a" stroke-width="3.5" marker-end="url(#mr)"/><text x="429.8" y="287.3" font-size="13" text-anchor="start" fill="#c92a2a" font-weight="700">P</text>
<line x1="419.8" y1="167.3" x2="367.8" y2="197.3" stroke="#c92a2a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mr)"/>
<line x1="419.8" y1="167.3" x2="471.7" y2="257.3" stroke="#c92a2a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mr)"/>
<text x="357.8" y="213.3" font-size="11" text-anchor="end" fill="#c92a2a" font-weight="normal">parte paralela</text>
<text x="483.7" y="263.3" font-size="11" text-anchor="start" fill="#c92a2a" font-weight="normal">parte perpendicular</text>
<line x1="419.8" y1="167.3" x2="367.8" y2="77.3" stroke="#2f9e44" stroke-width="3.5" marker-end="url(#mv)"/><text x="357.8" y="73.3" font-size="13" text-anchor="end" fill="#2f9e44" font-weight="700">N</text>
<line x1="454.4" y1="147.3" x2="506.4" y2="117.3" stroke="#1c7ed6" stroke-width="3.5" marker-end="url(#ma)"/><text x="496.4" y="101.3" font-size="13" text-anchor="middle" fill="#1c7ed6" font-weight="700">roce estático</text>
<text x="450.0" y="395.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">La normal es perpendicular al plano; el roce estático compensa la parte del peso que empuja rampa abajo.</text>
</svg>
