<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Patinadora que empuja una pared, cohete que expulsa gases y Tierra y manzana que se atraen, con sus pares de fuerzas" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Patinadora que empuja una pared, cohete que expulsa gases y Tierra y manzana que se atraen, con sus pares de fuerzas</title>
<rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67700"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<text x="450.0" y="28.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Pares de acción y reacción</text>
<rect x="230" y="70" width="24" height="200" fill="#adb5bd"/>
<circle cx="170" cy="110" r="12" fill="#2f9e44"/><line x1="170.0" y1="122.0" x2="170.0" y2="180.0" stroke="#2f9e44" stroke-width="5" /><line x1="170.0" y1="180.0" x2="158.0" y2="220.0" stroke="#2f9e44" stroke-width="4" /><line x1="170.0" y1="180.0" x2="180.0" y2="220.0" stroke="#2f9e44" stroke-width="4" /><line x1="170.0" y1="140.0" x2="228.0" y2="140.0" stroke="#2f9e44" stroke-width="4" />
<line x1="256.0" y1="140.0" x2="320.0" y2="140.0" stroke="#1c7ed6" stroke-width="3.5" marker-end="url(#ma)"/><text x="320.0" y="126.0" font-size="13" text-anchor="middle" fill="#1c7ed6" font-weight="700">mano sobre pared</text>
<line x1="226.0" y1="162.0" x2="172.0" y2="162.0" stroke="#c92a2a" stroke-width="3.5" marker-end="url(#mr)"/><text x="162.0" y="188.0" font-size="13" text-anchor="middle" fill="#c92a2a" font-weight="700">pared sobre mano</text>
<path d="M420,80 l18,30 v80 h-36 v-80 z" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
<path d="M406,190 l14,40 l14,-40 z" fill="#f59f00"/>
<line x1="460.0" y1="170.0" x2="460.0" y2="90.0" stroke="#c92a2a" stroke-width="3.5" marker-end="url(#mr)"/><text x="466.0" y="90.0" font-size="13" text-anchor="start" fill="#c92a2a" font-weight="700">gases sobre cohete</text>
<line x1="380.0" y1="200.0" x2="380.0" y2="270.0" stroke="#1c7ed6" stroke-width="3.5" marker-end="url(#ma)"/><text x="390.0" y="270.0" font-size="13" text-anchor="start" fill="#1c7ed6" font-weight="700">cohete sobre gases</text>
<circle cx="700" cy="230" r="45" fill="#a5d8ff" stroke="#1c7ed6"/>
<text x="700.0" y="235.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="700">Tierra</text>
<circle cx="700" cy="90" r="10" fill="#c92a2a"/>
<line x1="720.0" y1="100.0" x2="720.0" y2="160.0" stroke="#c92a2a" stroke-width="3.5" marker-end="url(#mr)"/><text x="726.0" y="150.0" font-size="13" text-anchor="start" fill="#c92a2a" font-weight="700">Tierra sobre manzana</text>
<line x1="680.0" y1="170.0" x2="680.0" y2="110.0" stroke="#1c7ed6" stroke-width="3.5" marker-end="url(#ma)"/><text x="674.0" y="120.0" font-size="13" text-anchor="end" fill="#1c7ed6" font-weight="700">manzana sobre Tierra</text>
<text x="450.0" y="320.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">En cada par: igual magnitud, sentidos opuestos, sobre cuerpos distintos.</text>
</svg>
