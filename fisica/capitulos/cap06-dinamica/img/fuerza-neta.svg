<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Tres casos de fuerzas sobre una caja: 30 y 20 newtons en el mismo sentido dan 50; 30 y 20 opuestos dan 10; 25 y 25 opuestos dan cero" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
