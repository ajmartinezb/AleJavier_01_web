<text x="92.0" y="279.0" font-size="11" text-anchor="end" fill="#4a5568" font-weight="normal">50</text>
<line x1="96.0" y1="230.0" x2="104.0" y2="230.0" stroke="#4a5568" stroke-width="1" />
<line x1="104.0" y1="230.0" x2="790.0" y2="230.0" stroke="#edf2f7" stroke-width="1" />
<text x="92.0" y="234.0" font-size="11" text-anchor="end" fill="#4a5568" font-weight="normal">100</text>
<line x1="96.0" y1="185.0" x2="104.0" y2="185.0" stroke="#4a5568" stroke-width="1" />
