<text x="144.0" y="140.0" font-size="12" text-anchor="start" fill="#e67700" font-weight="700">roce estático = fuerza aplicada</text>
<text x="650.0" y="83.0" font-size="12" text-anchor="middle" fill="#e67700" font-weight="700">máximo: μe · N = 250 N</text>
<text x="663.2" y="173.0" font-size="12" text-anchor="start" fill="#c92a2a" font-weight="700">cinético: 150 N</text>
<text x="375.0" y="302.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">la caja no se mueve</text>
<text x="727.0" y="302.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">la caja desliza</text>
