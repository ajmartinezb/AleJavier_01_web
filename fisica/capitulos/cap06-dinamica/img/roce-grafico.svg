<text x="800.0" y="354.0" font-size="12" text-anchor="end" fill="#4a5568" font-weight="normal">fuerza aplicada (N)</text>
<text x="106.0" y="56.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">roce (N)</text>
<line x1="210.0" y1="316.0" x2="210.0" y2="324.0" stroke="#4a5568" stroke-width="1" />
<text x="210.0" y="338.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">50</text>
<line x1="320.0" y1="316.0" x2="320.0" y2="324.0" stroke="#4a5568" stroke-width="1" />
<text x="320.0" y="338.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">100</text>
<line x1="430.0" y1="316.0" x2="430.0" y2="324.0" stroke="#4a5568" stroke-width="1" />
<text x="430.0" y="338.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">150</text>
<line x1="540.0" y1="316.0" x2="540.0" y2="324.0" stroke="#4a5568" stroke-width="1" />
<text x="540.0" y="338.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">200</text>
<line x1="650.0" y1="316.0" x2="650.0" y2="324.0" stroke="#4a5568" stroke-width="1" />
<text x="650.0" y="338.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">250</text>
