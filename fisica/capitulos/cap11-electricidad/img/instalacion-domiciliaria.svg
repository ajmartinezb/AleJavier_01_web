<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" width="900" height="425" role="img" aria-label="Esquema de instalación domiciliaria: red, empalme, medidor, tablero con protector diferencial y automáticos para alumbrado, enchufes y cocina, y conexión a tierra" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
