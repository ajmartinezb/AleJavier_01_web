<text x="540.0" y="360.0" font-size="12" text-anchor="start" fill="#2f9e44" font-weight="700">conexión a tierra</text>
<text x="450.0" y="410.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">El diferencial protege a las personas; los automáticos protegen los cables de cada circuito.</text>
