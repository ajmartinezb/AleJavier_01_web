<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" width="900" height="345" role="img" aria-label="Circuito con pila, amperímetro en serie y ampolleta con un voltímetro conectado en paralelo a sus extremos" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Circuito con pila, amperímetro en serie y ampolleta con un voltímetro conectado en paralelo a sus extremos</title>
<rect width="900" height="345" fill="#ffffff"/>
<defs><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67700"/></marker><marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<text x="450.0" y="28.0" font-size="17" text-anchor="middle" fill="#1a202c" font-weight="700">Cómo se conectan el amperímetro y el voltímetro</text>
<polyline points="180.0,170.0 180.0,90.0 620.0,90.0 620.0,290.0 180.0,290.0 180.0,210.0" fill="none" stroke="#343a40" stroke-width="2.5" />
<rect x="158" y="176" width="44" height="28" fill="#ffffff" stroke="none"/><line x1="160.0" y1="184.0" x2="200.0" y2="184.0" stroke="#343a40" stroke-width="3" /><line x1="170.0" y1="196.0" x2="190.0" y2="196.0" stroke="#343a40" stroke-width="5" /><text x="206.0" y="188.0" font-size="14" text-anchor="start" fill="#c92a2a" font-weight="700">+</text><text x="206.0" y="204.0" font-size="14" text-anchor="start" fill="#1c7ed6" font-weight="700">−</text>
<circle cx="400" cy="90" r="17" fill="#ffffff" stroke="#2f9e44" stroke-width="2.5"/><text x="400.0" y="96.0" font-size="16" text-anchor="middle" fill="#2f9e44" font-weight="700">A</text>
<text x="400.0" y="64.0" font-size="12" text-anchor="middle" fill="#2f9e44" font-weight="700">amperímetro en serie</text>
<circle cx="620" cy="190.0" r="16" fill="#fff9db" stroke="#e67700" stroke-width="2.5"/><line x1="608.8" y1="178.8" x2="631.2" y2="201.2" stroke="#e67700" stroke-width="2" /><line x1="608.8" y1="201.2" x2="631.2" y2="178.8" stroke="#e67700" stroke-width="2" />
<polyline points="620.0,140.0 760.0,140.0 760.0,172.0" fill="none" stroke="#4a5568" stroke-width="2" />
<polyline points="620.0,240.0 760.0,240.0 760.0,208.0" fill="none" stroke="#4a5568" stroke-width="2" />
<circle cx="760" cy="190.0" r="17" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/><text x="760.0" y="196.0" font-size="16" text-anchor="middle" fill="#c92a2a" font-weight="700">V</text>
<circle cx="620" cy="140.0" r="4" fill="#343a40"/><circle cx="620" cy="240.0" r="4" fill="#343a40"/>
<text x="790.0" y="195.0" font-size="12" text-anchor="start" fill="#c92a2a" font-weight="700">voltímetro</text>
<text x="790.0" y="211.0" font-size="12" text-anchor="start" fill="#c92a2a" font-weight="700">en paralelo</text>
<text x="450.0" y="330.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">La corriente pasa por el amperímetro; el voltímetro mide la diferencia entre los extremos de la ampolleta.</text>
</svg>
