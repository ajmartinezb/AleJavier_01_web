<line x1="450.0" y1="70.0" x2="450.0" y2="480.0" stroke="#1a202c" stroke-width="2" />
<text x="340.0" y="64.0" font-size="14" text-anchor="middle" fill="#1c7ed6" font-weight="700">Modelo geoquímico</text>
<text x="560.0" y="64.0" font-size="14" text-anchor="middle" fill="#1c7ed6" font-weight="700">Modelo físico</text>
<text x="245.0" y="86.0" font-size="12" text-anchor="end" fill="#1a202c" font-weight="700">corteza (5–70 km)</text>
<text x="245.0" y="150.0" font-size="12" text-anchor="end" fill="#1a202c" font-weight="700">manto (hasta 2 900 km)</text>
<text x="245.0" y="275.0" font-size="12" text-anchor="end" fill="#1a202c" font-weight="700">núcleo (hierro y níquel)</text>
<text x="655.0" y="86.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="700">litosfera (rígida, ~100 km)</text>
<text x="655.0" y="110.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="700">astenosfera (plástica)</text>
<text x="655.0" y="170.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="700">mesosfera (sólida)</text>
<text x="655.0" y="215.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="700">núcleo externo (líquido)</text>
<text x="655.0" y="275.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="700">núcleo interno (sólido)</text>
<text x="450.0" y="480.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">Espesores sin escala (la corteza y la litosfera están exageradas). Radio terrestre: 6 371 km.</text>
