<text x="760.0" y="214.0" font-size="13" text-anchor="middle" fill="#2f855a" font-weight="700">específicos</text>
<line x1="712" y1="205" x2="676" y2="205" stroke="#2f855a" stroke-width="1.4"/>
<rect x="60" y="376" width="1000" height="168" rx="12" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.8"/>
<circle cx="96" cy="399" r="13" fill="#2f855a"/>
<text x="96.0" y="404.0" font-size="13.5" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
<text x="120.0" y="404.0" font-size="13.5" text-anchor="start" fill="#4a5568" font-weight="normal">Llega el potencial de acción al terminal</text>
<circle cx="96" cy="427" r="13" fill="#2f855a"/>
<text x="96.0" y="432.0" font-size="13.5" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
<text x="120.0" y="432.0" font-size="13.5" text-anchor="start" fill="#4a5568" font-weight="normal">Entra Ca²⁺ por canales dependientes de voltaje</text>
<circle cx="96" cy="455" r="13" fill="#2f855a"/>
<text x="96.0" y="460.0" font-size="13.5" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
<text x="120.0" y="460.0" font-size="13.5" text-anchor="start" fill="#4a5568" font-weight="normal">Las vesículas liberan el neurotransmisor por exocitosis</text>
<circle cx="96" cy="483" r="13" fill="#2f855a"/>
<text x="96.0" y="488.0" font-size="13.5" text-anchor="middle" fill="#ffffff" font-weight="700">4</text>
<text x="120.0" y="488.0" font-size="13.5" text-anchor="start" fill="#4a5568" font-weight="normal">El neurotransmisor se une a los receptores postsinápticos</text>
<circle cx="96" cy="511" r="13" fill="#2f855a"/>
<text x="96.0" y="516.0" font-size="13.5" text-anchor="middle" fill="#ffffff" font-weight="700">5</text>
<text x="120.0" y="516.0" font-size="13.5" text-anchor="start" fill="#4a5568" font-weight="normal">Se retira: se degrada, se recapta o lo retiran las células gliales</text>
<text x="760.0" y="432.0" font-size="13" text-anchor="start" fill="#c53030" font-weight="700">Sin entrada de calcio</text>
<text x="760.0" y="450.0" font-size="13" text-anchor="start" fill="#c53030" font-weight="700">no hay liberación:</text>
<text x="760.0" y="468.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">el paso 2 es el que</text>
<text x="760.0" y="484.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">más se olvida.</text>
