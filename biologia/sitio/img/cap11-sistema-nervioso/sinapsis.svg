<text x="850.0" y="108.0" font-size="15" text-anchor="middle" fill="#2f855a" font-weight="700">Neurona POSTSINÁPTICA</text>
<text x="850.0" y="128.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">(dendrita)</text>
<rect x="646" y="152" width="22" height="32" rx="6" fill="#2f855a"/>
