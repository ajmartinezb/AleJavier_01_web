<text x="555.0" y="582.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="600">misma función</text>
<text x="590.0" y="758.0" font-size="13" text-anchor="middle" fill="#c05621" font-weight="700">Misma función (volar) y origen distinto: la analogía NO indica parentesco, sino evolución convergente.</text>
