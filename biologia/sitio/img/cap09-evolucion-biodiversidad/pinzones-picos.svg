<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 570" width="1160" height="570" role="img" aria-label="Cuatro tipos de pico de los pinzones de Galápagos y su relación con la dieta" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Cuatro tipos de pico de los pinzones de Galápagos y su relación con la dieta</title>
<rect width="1160" height="570" fill="#ffffff"/>
<text x="580.0" y="32.0" font-size="21" text-anchor="middle" fill="#1a202c" font-weight="700">Pinzones de Galápagos: la forma del pico y la dieta</text>
<text x="580.0" y="56.0" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal">Un mismo linaje sudamericano, unas quince especies, un pico para cada recurso</text>
<rect x="28" y="84" width="230" height="372" rx="14" fill="#ffffff" stroke="#c05621" stroke-width="1.8"/>
<circle cx="146" cy="200" r="44" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.8"/>
<circle cx="132" cy="186" r="5" fill="#1a202c"/>
<path d="M104,174.5 L62.2,203 L104,203 z" fill="#c05621" stroke="#7b341e" stroke-width="1.2"/>
<path d="M104,225.5 L62.2,205 L104,205 z" fill="#c05621" opacity="0.72" stroke="#7b341e" stroke-width="1"/>
<text x="142.0" y="286.0" font-size="13.5" text-anchor="middle" fill="#1a202c" font-weight="700">Pinzón terrestre grande</text>
<text x="142.0" y="306.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal" font-style="italic">Geospiza magnirostris</text>
<line x1="54" y1="320" x2="230" y2="320" stroke="#cbd5e0" stroke-width="1.4"/>
<text x="142.0" y="342.0" font-size="12.5" text-anchor="middle" fill="#c05621" font-weight="700">Pico</text>
<text x="142.0" y="360.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">corto, alto</text>
<text x="142.0" y="377.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">y muy robusto</text>
<text x="142.0" y="410.0" font-size="12.5" text-anchor="middle" fill="#c05621" font-weight="700">Dieta</text>
<text x="142.0" y="428.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Semillas grandes</text>
<text x="142.0" y="445.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">y duras</text>
<rect x="296" y="84" width="230" height="372" rx="14" fill="#ffffff" stroke="#d69e2e" stroke-width="1.8"/>
<circle cx="414" cy="200" r="44" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.8"/>
<circle cx="400" cy="186" r="5" fill="#1a202c"/>
<path d="M372,182.66 L331.52,203 L372,203 z" fill="#d69e2e" stroke="#7b341e" stroke-width="1.2"/>
<path d="M372,217.34 L331.52,205 L372,205 z" fill="#d69e2e" opacity="0.72" stroke="#7b341e" stroke-width="1"/>
<text x="410.0" y="286.0" font-size="13.5" text-anchor="middle" fill="#1a202c" font-weight="700">Pinzón terrestre mediano</text>
<text x="410.0" y="306.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal" font-style="italic">Geospiza fortis</text>
<line x1="322" y1="320" x2="498" y2="320" stroke="#cbd5e0" stroke-width="1.4"/>
<text x="410.0" y="342.0" font-size="12.5" text-anchor="middle" fill="#d69e2e" font-weight="700">Pico</text>
<text x="410.0" y="360.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">mediano</text>
<text x="410.0" y="377.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">y cónico</text>
<text x="410.0" y="410.0" font-size="12.5" text-anchor="middle" fill="#d69e2e" font-weight="700">Dieta</text>
<text x="410.0" y="428.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Semillas de</text>
<text x="410.0" y="445.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">tamaño variado</text>
<rect x="564" y="84" width="230" height="372" rx="14" fill="#ffffff" stroke="#2f855a" stroke-width="1.8"/>
<circle cx="682" cy="200" r="44" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.8"/>
<circle cx="668" cy="186" r="5" fill="#1a202c"/>
<path d="M640,191.5 L582.8,203 L640,203 z" fill="#2f855a" stroke="#7b341e" stroke-width="1.2"/>
<path d="M640,208.5 L582.8,205 L640,205 z" fill="#2f855a" opacity="0.72" stroke="#7b341e" stroke-width="1"/>
<text x="678.0" y="286.0" font-size="13.5" text-anchor="middle" fill="#1a202c" font-weight="700">Pinzón arborícola</text>
<text x="678.0" y="306.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal" font-style="italic">Camarhynchus sp.</text>
<line x1="590" y1="320" x2="766" y2="320" stroke="#cbd5e0" stroke-width="1.4"/>
<text x="678.0" y="342.0" font-size="12.5" text-anchor="middle" fill="#2f855a" font-weight="700">Pico</text>
<text x="678.0" y="360.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">fino, largo</text>
<text x="678.0" y="377.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">y puntiagudo</text>
<text x="678.0" y="410.0" font-size="12.5" text-anchor="middle" fill="#2f855a" font-weight="700">Dieta</text>
<text x="678.0" y="428.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Insectos</text>
<text x="678.0" y="445.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">del follaje</text>
<rect x="832" y="84" width="230" height="372" rx="14" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.8"/>
<circle cx="950" cy="200" r="44" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.8"/>
<circle cx="936" cy="186" r="5" fill="#1a202c"/>
<path d="M908,189.46 Q870.49,192.622 839.8,205.797 Q877.31,199.473 908,203 z" fill="#2b6cb0" stroke="#7b341e" stroke-width="1.2"/>
<text x="946.0" y="286.0" font-size="13.5" text-anchor="middle" fill="#1a202c" font-weight="700">Pinzón de cactus</text>
<text x="946.0" y="306.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal" font-style="italic">Geospiza scandens</text>
<line x1="858" y1="320" x2="1034" y2="320" stroke="#cbd5e0" stroke-width="1.4"/>
<text x="946.0" y="342.0" font-size="12.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">Pico</text>
<text x="946.0" y="360.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">alargado</text>
<text x="946.0" y="377.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">y algo curvo</text>
<text x="946.0" y="410.0" font-size="12.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">Dieta</text>
<text x="946.0" y="428.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Flores y frutos</text>
<text x="946.0" y="445.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">de cactus</text>
<rect x="28" y="478" width="1104" height="66" rx="12" fill="#f0fff4" stroke="#2f855a" stroke-width="1.6"/>
<text x="580.0" y="502.0" font-size="13.5" text-anchor="middle" fill="#2f855a" font-weight="700">Radiación adaptativa: un linaje colonizó el archipiélago y cada población se especializó en el recurso disponible en su isla.</text>
<text x="580.0" y="526.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">El pico es medible en milímetros y es heredable (genes ALX1 y HMGA2): por eso la selección natural se puede cuantificar generación a generación.</text>
</svg>
