<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" role="img" aria-label="Partes de un árbol filogenético y reglas para leerlo" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Partes de un árbol filogenético y reglas para leerlo</title>
<rect width="1080" height="620" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="fln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker></defs>
<text x="540.0" y="32.0" font-size="21" text-anchor="middle" fill="#1a202c" font-weight="700">Cómo se lee un árbol filogenético</text>
<rect x="60" y="56" width="960" height="470" rx="14" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
<path d="M560,342 L560,342 L700,342" fill="none" stroke="#4a5568" stroke-width="2.6" stroke-linejoin="round"/>
<path d="M560,420 L560,420 L700,420" fill="none" stroke="#4a5568" stroke-width="2.6" stroke-linejoin="round"/>
<path d="M460,264 L460,264 L700,264" fill="none" stroke="#4a5568" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="460" y1="381" x2="560" y2="381" stroke="#4a5568" stroke-width="2.6"/>
<line x1="560" y1="342" x2="560" y2="420" stroke="#4a5568" stroke-width="2.6"/>
<path d="M360,186 L360,186 L700,186" fill="none" stroke="#4a5568" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="360" y1="322" x2="460" y2="322" stroke="#4a5568" stroke-width="2.6"/>
<line x1="460" y1="264" x2="460" y2="381" stroke="#4a5568" stroke-width="2.6"/>
<path d="M240,108 L240,108 L700,108" fill="none" stroke="#4a5568" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="240" y1="254" x2="360" y2="254" stroke="#4a5568" stroke-width="2.6"/>
<line x1="360" y1="186" x2="360" y2="322" stroke="#4a5568" stroke-width="2.6"/>
<line x1="240" y1="108" x2="240" y2="254" stroke="#4a5568" stroke-width="2.6"/>
<line x1="150" y1="181" x2="240" y2="181" stroke="#4a5568" stroke-width="2.6"/>
<circle cx="700" cy="108" r="6" fill="#2f855a"/>
<text x="716.0" y="113.0" font-size="15" text-anchor="start" fill="#1a202c" font-weight="700">Lamprea</text>
<circle cx="700" cy="186" r="6" fill="#2f855a"/>
<text x="716.0" y="191.0" font-size="15" text-anchor="start" fill="#1a202c" font-weight="700">Tiburón</text>
<circle cx="700" cy="264" r="6" fill="#2f855a"/>
<text x="716.0" y="269.0" font-size="15" text-anchor="start" fill="#1a202c" font-weight="700">Salmón</text>
<circle cx="700" cy="342" r="6" fill="#2f855a"/>
<text x="716.0" y="347.0" font-size="15" text-anchor="start" fill="#1a202c" font-weight="700">Rana</text>
<circle cx="700" cy="420" r="6" fill="#2f855a"/>
<text x="716.0" y="425.0" font-size="15" text-anchor="start" fill="#1a202c" font-weight="700">Gato</text>
<circle cx="240" cy="181" r="6.5" fill="#ffffff" stroke="#c05621" stroke-width="2.6"/>
<circle cx="360" cy="254" r="6.5" fill="#ffffff" stroke="#c05621" stroke-width="2.6"/>
<circle cx="460" cy="322" r="6.5" fill="#ffffff" stroke="#c05621" stroke-width="2.6"/>
<circle cx="560" cy="381" r="6.5" fill="#ffffff" stroke="#c05621" stroke-width="2.6"/>
<rect x="545" y="322" width="245" height="118" rx="12" fill="none" stroke="#6b46c1" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="668.0" y="462.0" font-size="13" text-anchor="middle" fill="#6b46c1" font-weight="700">clado: un nodo y TODOS sus descendientes</text>
<line x1="150" y1="181" x2="150" y2="181" stroke="#4a5568"/>
<text x="146.0" y="176.0" font-size="13.5" text-anchor="end" fill="#c05621" font-weight="700">raíz</text>
<text x="146.0" y="194.0" font-size="12" text-anchor="end" fill="#4a5568" font-weight="normal">ancestro de todos</text>
<line x1="600" y1="300" x2="566" y2="374" stroke="#c05621" stroke-width="1.5" marker-end="url(#fln)"/>
<text x="604.0" y="294.0" font-size="13" text-anchor="start" fill="#c05621" font-weight="700">nodo = ancestro común</text>
<text x="604.0" y="312.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">y momento de la división</text>
<line x1="300" y1="140" x2="300" y2="112" stroke="#4a5568" stroke-width="1.4" marker-end="url(#flg)"/>
<text x="302.0" y="156.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">rama = un linaje en el tiempo</text>
<line x1="150" y1="500" x2="700" y2="500" stroke="#4a5568" stroke-width="1.8" marker-end="url(#flg)"/>
<text x="152.0" y="492.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">pasado</text>
<text x="698.0" y="492.0" font-size="12.5" text-anchor="end" fill="#4a5568" font-weight="normal">presente</text>
<rect x="828" y="86" width="182" height="340" rx="12" fill="#fffaf0" stroke="#c05621" stroke-width="1.6"/>
<text x="919.0" y="112.0" font-size="14" text-anchor="middle" fill="#c05621" font-weight="700">La única regla</text>
<text x="840.0" y="138.0" font-size="12.3" text-anchor="start" fill="#1a202c" font-weight="600">Dos taxones están más</text>
<text x="840.0" y="158.0" font-size="12.3" text-anchor="start" fill="#1a202c" font-weight="600">emparentados cuanto</text>
<text x="840.0" y="178.0" font-size="12.3" text-anchor="start" fill="#1a202c" font-weight="600">MÁS RECIENTE es el</text>
<text x="840.0" y="198.0" font-size="12.3" text-anchor="start" fill="#1a202c" font-weight="600">nodo que comparten.</text>
<text x="840.0" y="218.0" font-size="12.3" text-anchor="start" fill="#1a202c" font-weight="normal"></text>
<text x="840.0" y="238.0" font-size="12.3" text-anchor="start" fill="#4a5568" font-weight="normal">· La cercanía en la punta</text>
<text x="840.0" y="258.0" font-size="12.3" text-anchor="start" fill="#4a5568" font-weight="normal">  no indica parentesco.</text>
<text x="840.0" y="278.0" font-size="12.3" text-anchor="start" fill="#4a5568" font-weight="normal"></text>
<text x="840.0" y="298.0" font-size="12.3" text-anchor="start" fill="#4a5568" font-weight="normal">· Rotar un nodo no</text>
<text x="840.0" y="318.0" font-size="12.3" text-anchor="start" fill="#4a5568" font-weight="normal">  cambia nada.</text>
<text x="840.0" y="338.0" font-size="12.3" text-anchor="start" fill="#4a5568" font-weight="normal"></text>
<text x="840.0" y="358.0" font-size="12.3" text-anchor="start" fill="#4a5568" font-weight="normal">· El de la derecha no es</text>
<text x="840.0" y="378.0" font-size="12.3" text-anchor="start" fill="#4a5568" font-weight="normal">  «más evolucionado».</text>
<text x="540.0" y="556.0" font-size="13.5" text-anchor="middle" fill="#1a202c" font-weight="600">El gato está más emparentado con la rana que con el salmón, porque comparte con ella un nodo más reciente.</text>
<text x="540.0" y="578.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Que el salmón esté dibujado al lado de la rana no significa nada: lo que importa es el nodo, no la vecindad.</text>
</svg>
