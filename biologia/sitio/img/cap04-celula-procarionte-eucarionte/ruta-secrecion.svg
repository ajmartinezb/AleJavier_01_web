<circle cx="835" cy="215" r="11" fill="#2f855a"/><text x="835" y="220" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">5</text>
<circle cx="60" cy="435" r="11" fill="#2f855a"/><text x="60" y="440" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">1</text>
<text x="82" y="440">El ARNm sale del núcleo por los poros y se une a ribosomas.</text>
<circle cx="60" cy="465" r="11" fill="#2f855a"/><text x="60" y="470" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">2</text>
<text x="82" y="470">En el RE rugoso la proteína se sintetiza, entra al lumen y se pliega.</text>
<circle cx="60" cy="495" r="11" fill="#2f855a"/><text x="60" y="500" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">3</text>
<text x="82" y="500">Vesículas de transporte la llevan hasta la cara cis del Golgi.</text>
<circle cx="60" cy="525" r="11" fill="#2f855a"/><text x="60" y="530" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">4</text>
<text x="82" y="530">El Golgi la modifica y empaca; de la cara trans brotan vesículas de secreción.</text>
<circle cx="60" cy="555" r="11" fill="#2f855a"/><text x="60" y="560" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">5</text>
<text x="82" y="560">La vesícula se fusiona con la membrana y libera la proteína (exocitosis).</text>
