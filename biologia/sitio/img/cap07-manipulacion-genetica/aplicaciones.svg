<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" width="1160" height="380" role="img" aria-label="Los cuatro campos de aplicación de la manipulación genética según el temario" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Los cuatro campos de aplicación de la manipulación genética según el temario</title>
<rect width="1160" height="380" fill="#ffffff"/>
<text x="580.0" y="34.0" font-size="21" text-anchor="middle" fill="#1a202c" font-weight="700">Los cuatro campos de aplicación del temario</text>
<text x="580.0" y="58.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">En los cuatro el esquema es el mismo: se toma un gen útil, se lo pone en un organismo que crece fácil, y se cosecha lo que produce</text>
<rect x="26" y="80" width="262" height="238" rx="14" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
<rect x="26" y="80" width="262" height="40" rx="14" fill="#2f855a"/>
<rect x="26" y="106" width="262" height="14" fill="#2f855a"/>
<text x="157.0" y="107.0" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">ALIMENTOS</text>
<text x="157.0" y="146.0" font-size="13.5" text-anchor="middle" fill="#2f855a" font-weight="700" font-style="italic">Quimosina para el queso</text>
<line x1="52" y1="160" x2="262" y2="160" stroke="#cbd5e0" stroke-width="1.2"/>
<text x="157.0" y="184.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Se le da a un microorganismo</text>
<text x="157.0" y="203.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">el gen bovino de la quimosina.</text>
<text x="157.0" y="222.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">La enzima resultante tiene la</text>
<text x="157.0" y="241.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">misma secuencia que la del</text>
<text x="157.0" y="260.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">ternero. También: cultivos Bt,</text>
<text x="157.0" y="279.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">arroz dorado, papaya.</text>
<rect x="310" y="80" width="262" height="238" rx="14" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
<rect x="310" y="80" width="262" height="40" rx="14" fill="#2b6cb0"/>
<rect x="310" y="106" width="262" height="14" fill="#2b6cb0"/>
<text x="441.0" y="107.0" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">FÁRMACOS</text>
<text x="441.0" y="146.0" font-size="13.5" text-anchor="middle" fill="#2b6cb0" font-weight="700" font-style="italic">Insulina humana</text>
<line x1="336" y1="160" x2="546" y2="160" stroke="#cbd5e0" stroke-width="1.2"/>
<text x="441.0" y="184.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Bacterias con el gen humano</text>
<text x="441.0" y="203.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">de la insulina la fabrican en</text>
<text x="441.0" y="222.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">biorreactores. Es idéntica a la</text>
<text x="441.0" y="241.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">humana y no puede transmitir</text>
<text x="441.0" y="260.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">virus. También: vacunas,</text>
<text x="441.0" y="279.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">factor VIII, eritropoyetina.</text>
<rect x="594" y="80" width="262" height="238" rx="14" fill="#ffffff" stroke="#c05621" stroke-width="2"/>
<rect x="594" y="80" width="262" height="40" rx="14" fill="#c05621"/>
<rect x="594" y="106" width="262" height="14" fill="#c05621"/>
<text x="725.0" y="107.0" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">DETERGENTES</text>
<text x="725.0" y="146.0" font-size="13.5" text-anchor="middle" fill="#c05621" font-weight="700" font-style="italic">Proteasas y amilasas</text>
<line x1="620" y1="160" x2="830" y2="160" stroke="#cbd5e0" stroke-width="1.2"/>
<text x="725.0" y="184.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Bacterias del género Bacillus</text>
<text x="725.0" y="203.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">producen las enzimas que</text>
<text x="725.0" y="222.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">degradan manchas de proteína,</text>
<text x="725.0" y="241.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">almidón y grasa. Se modifican</text>
<text x="725.0" y="260.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">para resistir el pH alcalino y</text>
<text x="725.0" y="279.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">permiten lavar en frío.</text>
<rect x="878" y="80" width="262" height="238" rx="14" fill="#ffffff" stroke="#6b46c1" stroke-width="2"/>
<rect x="878" y="80" width="262" height="40" rx="14" fill="#6b46c1"/>
<rect x="878" y="106" width="262" height="14" fill="#6b46c1"/>
<text x="1009.0" y="107.0" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">VESTUARIO</text>
<text x="1009.0" y="146.0" font-size="13.5" text-anchor="middle" fill="#6b46c1" font-weight="700" font-style="italic">Celulasas para la mezclilla</text>
<line x1="904" y1="160" x2="1114" y2="160" stroke="#cbd5e0" stroke-width="1.2"/>
<text x="1009.0" y="184.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">El bio-stoning desgasta el</text>
<text x="1009.0" y="203.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">jean con celulasas en vez de</text>
<text x="1009.0" y="222.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">piedra pómez. También:</text>
<text x="1009.0" y="241.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">algodón Bt en el cultivo y</text>
<text x="1009.0" y="260.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">seda de araña producida por</text>
<text x="1009.0" y="279.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">bacterias modificadas.</text>
<text x="580.0" y="352.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal" font-style="italic">El algodón aparece en dos campos a la vez: es cultivo alimentario y fibra textil.</text>
</svg>
