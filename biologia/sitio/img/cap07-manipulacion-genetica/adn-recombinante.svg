<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-label="Construcción de una molécula de ADN recombinante" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Construcción de una molécula de ADN recombinante</title>
<rect width="1120" height="620" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker></defs>
<text x="560.0" y="34.0" font-size="21" text-anchor="middle" fill="#1a202c" font-weight="700">Construcción de una molécula de ADN recombinante</text>
<text x="170.0" y="78.0" font-size="15" text-anchor="middle" fill="#2f855a" font-weight="700">1. Se parte de dos ADN</text>
<circle cx="140" cy="180" r="56" fill="none" stroke="#2b6cb0" stroke-width="7"/>
<text x="140.0" y="254.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Plásmido (vector)</text>
<rect x="248" y="150" width="200" height="22" rx="4" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.4"/>
<rect x="300" y="150" width="96" height="22" rx="4" fill="#c05621"/>
<text x="348.0" y="166.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700">gen</text>
<text x="348.0" y="196.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">ADN con el gen de interés</text>
<line x1="300" y1="140" x2="300" y2="182" stroke="#c53030" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="396" y1="140" x2="396" y2="182" stroke="#c53030" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="140" y1="118" x2="140" y2="136" stroke="#c53030" stroke-width="2" stroke-dasharray="4 3"/>
<text x="348.0" y="128.0" font-size="12" text-anchor="middle" fill="#c53030" font-weight="700">sitios de corte</text>
<line x1="470" y1="170" x2="536" y2="170" stroke="#2f855a" stroke-width="2.6" marker-end="url(#flv)"/>
<text x="503.0" y="126.0" font-size="12.5" text-anchor="middle" fill="#2f855a" font-weight="700">enzima de</text>
<text x="503.0" y="142.0" font-size="12.5" text-anchor="middle" fill="#2f855a" font-weight="700">restricción</text>
<text x="503.0" y="200.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">(la MISMA</text>
<text x="503.0" y="214.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">en los dos)</text>
<text x="760.0" y="78.0" font-size="15" text-anchor="middle" fill="#2f855a" font-weight="700">2. Corte: quedan extremos cohesivos</text>
<path d="M669.7,132.5 A56,56 0 1 1 610.3,132.5" fill="none" stroke="#2b6cb0" stroke-width="7" stroke-linecap="round"/>
<text x="640.0" y="254.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Plásmido abierto</text>
<rect x="756" y="150" width="96" height="22" rx="4" fill="#c05621"/>
<text x="804.0" y="166.0" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700">gen</text>
<text x="804.0" y="196.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Gen recortado</text>
<rect x="900" y="112" width="196" height="128" rx="12" fill="#fffaf0" stroke="#c05621" stroke-width="1.6"/>
<text x="998.0" y="134.0" font-size="13.5" text-anchor="middle" fill="#c05621" font-weight="700">Extremo cohesivo</text>
<text x="920" y="164" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a202c">…G</text>
<text x="960" y="164" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c05621" font-weight="700">AATTC…</text>
<text x="920" y="186" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a202c">…CTTAA</text>
<text x="1000" y="186" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c05621" font-weight="700">G…</text>
<text x="998.0" y="214.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Las puntas de cadena simple</text>
<text x="998.0" y="228.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">solo encajan entre sí</text>
<line x1="560" y1="300" x2="560" y2="344" stroke="#2f855a" stroke-width="2.6" marker-end="url(#flv)"/>
<text x="576.0" y="326.0" font-size="13" text-anchor="start" fill="#2f855a" font-weight="700">ADN ligasa: sella la unión</text>
<text x="560.0" y="384.0" font-size="15" text-anchor="middle" fill="#2f855a" font-weight="700">3. Molécula de ADN recombinante</text>
<circle cx="560" cy="480" r="62" fill="none" stroke="#2b6cb0" stroke-width="7"/><path d="M513.5,439.1 A62,62 0 0 1 606.5,439.1" fill="none" stroke="#c05621" stroke-width="7" stroke-linecap="round"/>
<line x1="640" y1="452" x2="700" y2="430" stroke="#c05621" stroke-width="1.4"/>
<text x="708.0" y="428.0" font-size="13" text-anchor="start" fill="#c05621" font-weight="700">gen de interés insertado</text>
<line x1="500" y1="520" x2="430" y2="546" stroke="#2b6cb0" stroke-width="1.4"/>
<text x="422.0" y="552.0" font-size="13" text-anchor="end" fill="#2b6cb0" font-weight="700">ADN del plásmido</text>
<text x="560.0" y="588.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Un mismo corte en ambos ADN es lo que permite que las puntas sean complementarias y se puedan unir.</text>
</svg>
