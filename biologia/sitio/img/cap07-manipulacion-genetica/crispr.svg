<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Cómo edita CRISPR-Cas9 una secuencia del genoma" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Cómo edita CRISPR-Cas9 una secuencia del genoma</title>
<rect width="1100" height="560" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="flr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker></defs>
<text x="550.0" y="34.0" font-size="21" text-anchor="middle" fill="#1a202c" font-weight="700">CRISPR-Cas9: cómo se edita una secuencia del genoma</text>
<rect x="34" y="60" width="330" height="240" rx="14" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.8"/>
<text x="199.0" y="86.0" font-size="14.5" text-anchor="middle" fill="#1a202c" font-weight="700">1. El ARN guía reconoce el sitio</text>
<rect x="60" y="150" width="278" height="14" rx="7" fill="#2b6cb0"/>
<rect x="60" y="186" width="278" height="14" rx="7" fill="#2b6cb0"/>
<rect x="168" y="150" width="62" height="14" rx="7" fill="#d69e2e"/>
<rect x="168" y="186" width="62" height="14" rx="7" fill="#d69e2e"/>
<text x="199.0" y="220.0" font-size="12" text-anchor="middle" fill="#d69e2e" font-weight="700">secuencia diana</text>
<path d="M199,120 q-34,-6 -40,-28" fill="none" stroke="#6b46c1" stroke-width="3"/>
<rect x="150" y="120" width="98" height="14" rx="7" fill="#6b46c1"/>
<text x="199.0" y="106.0" font-size="12.5" text-anchor="middle" fill="#6b46c1" font-weight="700">ARN guía</text>
<text x="199.0" y="254.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">Se diseña complementario</text>
<text x="199.0" y="270.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">a la secuencia que se quiere editar</text>
<rect x="384" y="60" width="330" height="240" rx="14" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.8"/>
<text x="549.0" y="86.0" font-size="14.5" text-anchor="middle" fill="#1a202c" font-weight="700">2. Cas9 corta las dos hebras</text>
<rect x="410" y="150" width="120" height="14" rx="7" fill="#2b6cb0"/>
<rect x="568" y="150" width="120" height="14" rx="7" fill="#2b6cb0"/>
<rect x="410" y="186" width="120" height="14" rx="7" fill="#2b6cb0"/>
<rect x="568" y="186" width="120" height="14" rx="7" fill="#2b6cb0"/>
<ellipse cx="549" cy="132" rx="52" ry="34" fill="#2f855a" opacity="0.9"/>
<text x="549.0" y="138.0" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">Cas9</text>
<line x1="549" y1="142" x2="549" y2="212" stroke="#c53030" stroke-width="2.6" stroke-dasharray="5 4"/>
<text x="549.0" y="234.0" font-size="12.5" text-anchor="middle" fill="#c53030" font-weight="700">corte de doble hebra</text>
<text x="549.0" y="266.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">La proteína corta en el sitio</text>
<text x="549.0" y="282.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">al que la lleva el ARN guía</text>
<rect x="734" y="60" width="332" height="240" rx="14" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
<text x="900.0" y="86.0" font-size="14.5" text-anchor="middle" fill="#2f855a" font-weight="700">3. La célula repara el corte</text>
<rect x="762" y="138" width="276" height="62" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.4"/>
<text x="900.0" y="160.0" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="700">Sin molde: pierde o agrega bases</text>
<text x="900.0" y="180.0" font-size="12.5" text-anchor="middle" fill="#c05621" font-weight="700">→ el gen queda INACTIVADO</text>
<rect x="762" y="212" width="276" height="70" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.4"/>
<text x="900.0" y="234.0" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="700">Con un molde de ADN aportado</text>
<text x="900.0" y="254.0" font-size="12.5" text-anchor="middle" fill="#2f855a" font-weight="700">→ se CORRIGE la secuencia</text>
<text x="900.0" y="272.0" font-size="12.5" text-anchor="middle" fill="#2f855a" font-weight="700">o se INSERTA una nueva</text>
<line x1="368" y1="180" x2="380" y2="180" stroke="#2f855a" stroke-width="2.6" marker-end="url(#flv)"/>
<line x1="718" y1="180" x2="730" y2="180" stroke="#2f855a" stroke-width="2.6" marker-end="url(#flv)"/>
<rect x="34" y="330" width="1032" height="80" rx="12" fill="#fffaf0" stroke="#c05621" stroke-width="1.6"/>
<text x="550.0" y="356.0" font-size="14" text-anchor="middle" fill="#c05621" font-weight="700">Para editar otro gen basta con cambiar el ARN guía: la proteína Cas9 es siempre la misma.</text>
<text x="550.0" y="380.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Por eso la técnica se volvió rápida y barata. Su principal limitación son los cortes fuera del blanco,</text>
<text x="550.0" y="398.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">en secuencias parecidas a la buscada, que hay que verificar secuenciando.</text>
<rect x="34" y="430" width="1032" height="98" rx="12" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.6"/>
<text x="300.0" y="456.0" font-size="14" text-anchor="middle" fill="#2b6cb0" font-weight="700">TRANSGÉNESIS</text>
<text x="300.0" y="480.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Se AGREGA un gen de otra especie.</text>
<text x="300.0" y="500.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">El organismo resultante es transgénico.</text>
<line x1="550" y1="446" x2="550" y2="514" stroke="#cbd5e0" stroke-width="1.6"/>
<text x="800.0" y="456.0" font-size="14" text-anchor="middle" fill="#2f855a" font-weight="700">EDICIÓN GENÓMICA</text>
<text x="800.0" y="480.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Se CORRIGE o se APAGA un gen propio.</text>
<text x="800.0" y="500.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Puede no quedar ADN de otra especie.</text>
</svg>
