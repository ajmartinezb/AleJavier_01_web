<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-label="Los seis eslabones de la cadena de transmisión y la medida de prevención que corta cada uno" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Los seis eslabones de la cadena de transmisión y la medida de prevención que corta cada uno</title>
<rect width="940" height="520" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker></defs>
<text x="470.0" y="30.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">La cadena de transmisión</text>
<text x="470.0" y="52.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Si falta un solo eslabón, la enfermedad no se propaga</text>
<rect x="40" y="100" width="132" height="104" rx="12" fill="#ffffff" stroke="#6b46c1" stroke-width="2.2"/>
<circle cx="106.0" cy="126" r="14" fill="#6b46c1"/>
<text x="106.0" y="131.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
<text x="106.0" y="162.0" font-size="12.5" text-anchor="middle" fill="#6b46c1" font-weight="700">Agente</text>
<text x="106.0" y="180.0" font-size="10.2" text-anchor="middle" fill="#4a5568" font-weight="normal">el virus o</text>
<text x="106.0" y="193.0" font-size="10.2" text-anchor="middle" fill="#4a5568" font-weight="normal">la bacteria</text>
<line x1="174" y1="152" x2="186" y2="152" stroke="#4a5568" stroke-width="2.2" marker-end="url(#flg)"/>
<line x1="106.0" y1="208" x2="106.0" y2="232" stroke="#c53030" stroke-width="1.8" stroke-dasharray="4 3"/>
<rect x="44" y="234" width="124" height="40" rx="9" fill="#fff5f5" stroke="#c53030" stroke-width="1.6"/>
<text x="106.0" y="259.0" font-size="10.8" text-anchor="middle" fill="#c53030" font-weight="700">desinfección</text>
<rect x="188" y="100" width="132" height="104" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="2.2"/>
<circle cx="254.0" cy="126" r="14" fill="#2b6cb0"/>
<text x="254.0" y="131.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
<text x="254.0" y="162.0" font-size="12.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">Reservorio</text>
<text x="254.0" y="180.0" font-size="10.2" text-anchor="middle" fill="#4a5568" font-weight="normal">donde vive y</text>
<text x="254.0" y="193.0" font-size="10.2" text-anchor="middle" fill="#4a5568" font-weight="normal">se multiplica</text>
<line x1="322" y1="152" x2="334" y2="152" stroke="#4a5568" stroke-width="2.2" marker-end="url(#flg)"/>
<line x1="254.0" y1="208" x2="254.0" y2="232" stroke="#c53030" stroke-width="1.8" stroke-dasharray="4 3"/>
<rect x="192" y="234" width="124" height="40" rx="9" fill="#fff5f5" stroke="#c53030" stroke-width="1.6"/>
<text x="254.0" y="252.0" font-size="10.5" text-anchor="middle" fill="#c53030" font-weight="700">tratar</text>
<text x="254.0" y="266.0" font-size="10.5" text-anchor="middle" fill="#c53030" font-weight="700">enfermos</text>
<rect x="336" y="100" width="132" height="104" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="2.2"/>
<circle cx="402.0" cy="126" r="14" fill="#2b6cb0"/>
<text x="402.0" y="131.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
<text x="402.0" y="158.0" font-size="11.8" text-anchor="middle" fill="#2b6cb0" font-weight="700">Puerta</text>
<text x="402.0" y="172.0" font-size="11.8" text-anchor="middle" fill="#2b6cb0" font-weight="700">de salida</text>
<text x="402.0" y="188.0" font-size="10.2" text-anchor="middle" fill="#4a5568" font-weight="normal">por donde</text>
<text x="402.0" y="201.0" font-size="10.2" text-anchor="middle" fill="#4a5568" font-weight="normal">abandona</text>
<line x1="470" y1="152" x2="482" y2="152" stroke="#4a5568" stroke-width="2.2" marker-end="url(#flg)"/>
<line x1="402.0" y1="208" x2="402.0" y2="232" stroke="#c53030" stroke-width="1.8" stroke-dasharray="4 3"/>
<rect x="340" y="234" width="124" height="40" rx="9" fill="#fff5f5" stroke="#c53030" stroke-width="1.6"/>
<text x="402.0" y="252.0" font-size="10.5" text-anchor="middle" fill="#c53030" font-weight="700">cubrirse</text>
<text x="402.0" y="266.0" font-size="10.5" text-anchor="middle" fill="#c53030" font-weight="700">al toser</text>
<rect x="484" y="100" width="132" height="104" rx="12" fill="#ffffff" stroke="#c05621" stroke-width="2.2"/>
<circle cx="550.0" cy="126" r="14" fill="#c05621"/>
<text x="550.0" y="131.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">4</text>
<text x="550.0" y="158.0" font-size="11.8" text-anchor="middle" fill="#c05621" font-weight="700">Vía</text>
<text x="550.0" y="172.0" font-size="11.8" text-anchor="middle" fill="#c05621" font-weight="700">de transmisión</text>
<text x="550.0" y="188.0" font-size="10.2" text-anchor="middle" fill="#4a5568" font-weight="normal">aire, contacto,</text>
<text x="550.0" y="201.0" font-size="10.2" text-anchor="middle" fill="#4a5568" font-weight="normal">agua, vector</text>
<line x1="618" y1="152" x2="630" y2="152" stroke="#4a5568" stroke-width="2.2" marker-end="url(#flg)"/>
<line x1="550.0" y1="208" x2="550.0" y2="232" stroke="#c53030" stroke-width="1.8" stroke-dasharray="4 3"/>
<rect x="488" y="234" width="124" height="40" rx="9" fill="#fff5f5" stroke="#c53030" stroke-width="1.6"/>
<text x="550.0" y="252.0" font-size="10.5" text-anchor="middle" fill="#c53030" font-weight="700">lavado</text>
<text x="550.0" y="266.0" font-size="10.5" text-anchor="middle" fill="#c53030" font-weight="700">de manos</text>
<rect x="632" y="100" width="132" height="104" rx="12" fill="#ffffff" stroke="#c05621" stroke-width="2.2"/>
<circle cx="698.0" cy="126" r="14" fill="#c05621"/>
<text x="698.0" y="131.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">5</text>
<text x="698.0" y="158.0" font-size="11.8" text-anchor="middle" fill="#c05621" font-weight="700">Puerta</text>
<text x="698.0" y="172.0" font-size="11.8" text-anchor="middle" fill="#c05621" font-weight="700">de entrada</text>
<text x="698.0" y="188.0" font-size="10.2" text-anchor="middle" fill="#4a5568" font-weight="normal">por donde</text>
<text x="698.0" y="201.0" font-size="10.2" text-anchor="middle" fill="#4a5568" font-weight="normal">ingresa</text>
<line x1="766" y1="152" x2="778" y2="152" stroke="#4a5568" stroke-width="2.2" marker-end="url(#flg)"/>
<line x1="698.0" y1="208" x2="698.0" y2="232" stroke="#c53030" stroke-width="1.8" stroke-dasharray="4 3"/>
<rect x="636" y="234" width="124" height="40" rx="9" fill="#fff5f5" stroke="#c53030" stroke-width="1.6"/>
<text x="698.0" y="259.0" font-size="10.8" text-anchor="middle" fill="#c53030" font-weight="700">curar heridas</text>
<rect x="780" y="100" width="132" height="104" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2.2"/>
<circle cx="846.0" cy="126" r="14" fill="#2f855a"/>
<text x="846.0" y="131.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">6</text>
<text x="846.0" y="158.0" font-size="11.8" text-anchor="middle" fill="#2f855a" font-weight="700">Hospedero</text>
<text x="846.0" y="172.0" font-size="11.8" text-anchor="middle" fill="#2f855a" font-weight="700">susceptible</text>
<text x="846.0" y="188.0" font-size="10.2" text-anchor="middle" fill="#4a5568" font-weight="normal">quien puede</text>
<text x="846.0" y="201.0" font-size="10.2" text-anchor="middle" fill="#4a5568" font-weight="normal">enfermar</text>
<line x1="846.0" y1="208" x2="846.0" y2="232" stroke="#c53030" stroke-width="1.8" stroke-dasharray="4 3"/>
<rect x="784" y="234" width="124" height="40" rx="9" fill="#fff5f5" stroke="#c53030" stroke-width="1.6"/>
<text x="846.0" y="259.0" font-size="10.8" text-anchor="middle" fill="#c53030" font-weight="700">VACUNACIÓN</text>
<text x="470.0" y="300.0" font-size="12.5" text-anchor="middle" fill="#c53030" font-weight="700">cómo se corta cada eslabón</text>
<rect x="40" y="330" width="860" height="86" rx="12" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
<text x="470.0" y="356.0" font-size="14.5" text-anchor="middle" fill="#2f855a" font-weight="700">La vacunación es la única medida que actúa sobre el hospedero susceptible</text>
<text x="470.0" y="380.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">El lavado de manos y la mascarilla actúan sobre la vía de transmisión; el preservativo, sobre la puerta de entrada.</text>
<text x="470.0" y="400.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">Con cobertura alta, la vacunación además protege de forma indirecta a quienes no pueden vacunarse.</text>
<rect x="40" y="432" width="860" height="62" rx="12" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.6"/>
<text x="470.0" y="456.0" font-size="13.5" text-anchor="middle" fill="#c05621" font-weight="700">Período de incubación</text>
<text x="470.0" y="478.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">Durante buena parte de él la persona transmite sin síntomas: aislar solo a quien los tiene llega tarde.</text>
</svg>
