<line x1="705" y1="496" x2="705" y2="484" stroke="#2f855a" stroke-width="1.6"/>
<line x1="714" y1="496" x2="714" y2="484" stroke="#2f855a" stroke-width="1.6"/>
<line x1="723" y1="496" x2="723" y2="484" stroke="#2f855a" stroke-width="1.6"/>
<line x1="732" y1="496" x2="732" y2="484" stroke="#2f855a" stroke-width="1.6"/>
<line x1="741" y1="496" x2="741" y2="484" stroke="#2f855a" stroke-width="1.6"/>
<text x="710.0" y="546.0" font-size="11.3" text-anchor="middle" fill="#4a5568" font-weight="normal">Enterocito: absorbe</text>
<text x="710.0" y="561.0" font-size="11.3" text-anchor="middle" fill="#4a5568" font-weight="normal">con microvellosidades</text>
<ellipse cx="832" cy="512" rx="15" ry="10" fill="#9ae6b4" stroke="#2f855a" stroke-width="1.8"/>
<path d="M847,512 q12,-11 22,0 q10,11 21,0" fill="none" stroke="#2f855a" stroke-width="2"/>
<text x="855.0" y="546.0" font-size="11.3" text-anchor="middle" fill="#4a5568" font-weight="normal">Espermatozoide:</text>
<text x="855.0" y="561.0" font-size="11.3" text-anchor="middle" fill="#4a5568" font-weight="normal">se desplaza rápido</text>
</svg>
