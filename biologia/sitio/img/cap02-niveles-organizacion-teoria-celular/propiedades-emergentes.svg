<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="Tres ejemplos de propiedades emergentes: hidrógeno y oxígeno que forman agua, biomoléculas que forman una célula y neuronas que forman tejido nervioso" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Tres ejemplos de propiedades emergentes: hidrógeno y oxígeno que forman agua, biomoléculas que forman una célula y neuronas que forman tejido nervioso</title>
<rect width="900" height="580" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs>
<text x="450.0" y="30.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Propiedades emergentes</text>
<text x="450.0" y="52.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">En cada nivel aparece algo que las partes, por separado, no tenían</text>
<rect x="60" y="90" width="250" height="96" rx="12" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/><text x="185.0" y="114.0" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="700">Átomos</text><text x="185.0" y="136.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">H: gas inflamable</text><text x="185.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">O: gas que aviva el fuego</text>
<line x1="322" y1="138" x2="392" y2="138" stroke="#2f855a" stroke-width="2.5" marker-end="url(#flg)"/>
<text x="357.0" y="124.0" font-size="11.5" text-anchor="middle" fill="#2f855a" font-weight="700">se organizan</text>
<rect x="400" y="90" width="250" height="96" rx="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/><text x="525.0" y="114.0" font-size="15" text-anchor="middle" fill="#2f855a" font-weight="700">Molécula de agua</text><text x="525.0" y="136.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">líquida a 20 °C</text><text x="525.0" y="154.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">apaga el fuego</text><text x="525.0" y="172.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">disuelve sales</text>
<line x1="662" y1="138" x2="678" y2="138" stroke="#cbd5e0" stroke-width="2"/>
<text x="686.0" y="134.0" font-size="11.5" text-anchor="start" fill="#c05621" font-weight="700">propiedad nueva:</text>
<text x="686.0" y="150.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">ninguno de los dos gases</text>
<text x="686.0" y="165.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">es líquido ni apaga nada</text>
<rect x="60" y="250" width="250" height="96" rx="12" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/><text x="185.0" y="274.0" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="700">Biomoléculas</text><text x="185.0" y="296.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">ADN, proteínas,</text><text x="185.0" y="314.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">lípidos: no vivos</text>
<line x1="322" y1="298" x2="392" y2="298" stroke="#2f855a" stroke-width="2.5" marker-end="url(#flg)"/>
<text x="357.0" y="284.0" font-size="11.5" text-anchor="middle" fill="#2f855a" font-weight="700">se organizan</text>
<rect x="400" y="250" width="250" height="96" rx="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/><text x="525.0" y="274.0" font-size="15" text-anchor="middle" fill="#2f855a" font-weight="700">Célula</text><text x="525.0" y="296.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">metabolismo</text><text x="525.0" y="314.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">homeostasis</text><text x="525.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">se divide</text>
<line x1="662" y1="298" x2="678" y2="298" stroke="#cbd5e0" stroke-width="2"/>
<text x="686.0" y="294.0" font-size="11.5" text-anchor="start" fill="#c05621" font-weight="700">propiedad nueva:</text>
<text x="686.0" y="310.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">ninguna biomolécula</text>
<text x="686.0" y="325.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">aislada está viva</text>
<rect x="60" y="410" width="250" height="96" rx="12" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/><text x="185.0" y="434.0" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="700">Neuronas</text><text x="185.0" y="456.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">cada una conduce</text><text x="185.0" y="474.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">una señal</text>
<line x1="322" y1="458" x2="392" y2="458" stroke="#2f855a" stroke-width="2.5" marker-end="url(#flg)"/>
<text x="357.0" y="444.0" font-size="11.5" text-anchor="middle" fill="#2f855a" font-weight="700">se organizan</text>
<rect x="400" y="410" width="250" height="96" rx="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/><text x="525.0" y="434.0" font-size="15" text-anchor="middle" fill="#2f855a" font-weight="700">Tejido nervioso</text><text x="525.0" y="456.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">integra señales</text><text x="525.0" y="474.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">guarda memoria</text>
<line x1="662" y1="458" x2="678" y2="458" stroke="#cbd5e0" stroke-width="2"/>
<text x="686.0" y="454.0" font-size="11.5" text-anchor="start" fill="#c05621" font-weight="700">propiedad nueva:</text>
<text x="686.0" y="470.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">una neurona sola</text>
<text x="686.0" y="485.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">no recuerda nada</text>
<rect x="60" y="526" width="780" height="1.5" fill="#cbd5e0"/>
<text x="450.0" y="556.0" font-size="13.5" text-anchor="middle" fill="#1a202c" font-weight="700">El todo no es la suma de las partes: es la suma de las partes MÁS su organización.</text>
</svg>
