<text x="910.0" y="324.0" font-size="12.5" text-anchor="start" fill="#1a202c" font-weight="700">Citoplasma: reservas</text>
<text x="910.0" y="342.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">y todas las mitocondrias</text>
<rect x="60" y="420" width="1040" height="152" rx="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<text x="190.0" y="452.0" font-size="13" text-anchor="middle" fill="#14532d" font-weight="700"></text>
<text x="500.0" y="452.0" font-size="13" text-anchor="middle" fill="#2b6cb0" font-weight="700">Espermatozoide</text>
<text x="880.0" y="452.0" font-size="13" text-anchor="middle" fill="#6b46c1" font-weight="700">Ovocito</text>
<text x="190.0" y="482.0" font-size="13" text-anchor="middle" fill="#14532d" font-weight="700">Movilidad</text>
<text x="500.0" y="482.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">móvil, por su flagelo</text>
<text x="880.0" y="482.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">inmóvil: lo transporta la trompa</text>
<text x="190.0" y="512.0" font-size="13" text-anchor="middle" fill="#14532d" font-weight="700">Cantidad</text>
<text x="500.0" y="512.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">decenas de millones</text>
<text x="880.0" y="512.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">habitualmente uno por ciclo</text>
<text x="190.0" y="542.0" font-size="13" text-anchor="middle" fill="#14532d" font-weight="700">Aporte al cigoto</text>
<text x="500.0" y="542.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">núcleo y centríolo</text>
<text x="880.0" y="542.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">núcleo, citoplasma y mitocondrias</text>
</svg>
