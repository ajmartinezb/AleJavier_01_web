<text x="946.0" y="122.0" font-size="12.5" text-anchor="start" fill="#1a202c" font-weight="700">Corona radiada</text>
<line x1="878" y1="206" x2="946" y2="182" stroke="#4a5568" stroke-width="1.6"/>
