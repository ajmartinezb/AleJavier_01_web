<text x="96.0" y="124.0" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="700">Acrosoma: enzimas</text>
<line x1="178" y1="176" x2="256" y2="132" stroke="#4a5568" stroke-width="1.6"/>
<text x="336.0" y="124.0" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="700">Núcleo: 23 cromosomas</text>
<line x1="241" y1="218" x2="230" y2="264" stroke="#4a5568" stroke-width="1.6"/>
<text x="226.0" y="282.0" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="700">Pieza media:</text>
<text x="226.0" y="300.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">mitocondrias (ATP)</text>
<line x1="430" y1="216" x2="452" y2="264" stroke="#4a5568" stroke-width="1.6"/>
<text x="452.0" y="282.0" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="700">Flagelo:</text>
<text x="452.0" y="300.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">movilidad</text>
<text x="800.0" y="80.0" font-size="15.5" text-anchor="middle" fill="#6b46c1" font-weight="700">Ovocito (~120 µm)</text>
