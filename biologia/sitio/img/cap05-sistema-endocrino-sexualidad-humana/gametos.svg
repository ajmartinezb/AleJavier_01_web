<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" width="1160" height="600" role="img" aria-label="Comparación entre el espermatozoide, con acrosoma, núcleo, pieza media y flagelo, y el ovocito, con núcleo, citoplasma, zona pelúcida y corona radiada" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Comparación entre el espermatozoide, con acrosoma, núcleo, pieza media y flagelo, y el ovocito, con núcleo, citoplasma, zona pelúcida y corona radiada</title>
<rect width="1160" height="600" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker></defs>
<text x="580.0" y="34.0" font-size="21" text-anchor="middle" fill="#1a202c" font-weight="700">Espermatozoide y ovocito: dos estrategias opuestas</text>
<text x="290.0" y="80.0" font-size="15.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">Espermatozoide (~60 µm)</text>
