<text x="952.0" y="198.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">reconocimiento</text>
<line x1="760" y1="200" x2="670" y2="160" stroke="#4a5568" stroke-width="1.6"/>
<text x="664.0" y="156.0" font-size="12.5" text-anchor="end" fill="#1a202c" font-weight="700">Núcleo</text>
