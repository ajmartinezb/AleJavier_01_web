<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 648" width="1180" height="648" role="img" aria-label="Estructuras del sistema reproductor masculino y del femenino con la función de cada una" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Estructuras del sistema reproductor masculino y del femenino con la función de cada una</title>
<rect width="1180" height="648" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="fla" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker></defs>
<text x="590.0" y="34.0" font-size="21" text-anchor="middle" fill="#1a202c" font-weight="700">Los sistemas reproductores y la función de cada estructura</text>
<line x1="590" y1="58" x2="590" y2="628" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="6 6"/>
<text x="292.0" y="80.0" font-size="15.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">Sistema reproductor masculino</text>
<rect x="60" y="120" width="464" height="86" rx="11" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="178.0" y="148.0" font-size="14" text-anchor="middle" fill="#2b6cb0" font-weight="700">Testículo</text>
<text x="390.0" y="150.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">produce espermatozoides</text>
<text x="390.0" y="169.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">y testosterona</text>
<line x1="292" y1="206" x2="292" y2="228" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#fla)"/>
<rect x="60" y="230" width="464" height="86" rx="11" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="178.0" y="258.0" font-size="14" text-anchor="middle" fill="#2b6cb0" font-weight="700">Epidídimo</text>
<text x="390.0" y="260.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">almacena y madura</text>
<text x="390.0" y="279.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">los espermatozoides</text>
<line x1="292" y1="316" x2="292" y2="338" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#fla)"/>
<rect x="60" y="340" width="464" height="86" rx="11" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="178.0" y="368.0" font-size="14" text-anchor="middle" fill="#2b6cb0" font-weight="700">Conducto deferente</text>
<text x="390.0" y="370.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">los transporta</text>
<text x="390.0" y="389.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">hasta la uretra</text>
<line x1="292" y1="426" x2="292" y2="448" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#fla)"/>
<rect x="60" y="450" width="464" height="86" rx="11" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="178.0" y="478.0" font-size="14" text-anchor="middle" fill="#2b6cb0" font-weight="700">Vesículas seminales</text>
<text x="178.0" y="496.0" font-size="14" text-anchor="middle" fill="#2b6cb0" font-weight="700">y próstata</text>
<text x="390.0" y="480.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">aportan fructosa</text>
<text x="390.0" y="499.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">y líquido alcalino</text>
<line x1="292" y1="536" x2="292" y2="558" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#fla)"/>
<rect x="60" y="566" width="464" height="58" rx="11" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="178.0" y="594.0" font-size="14" text-anchor="middle" fill="#2b6cb0" font-weight="700">Uretra</text>
<text x="390.0" y="596.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">conduce el semen</text>
<text x="390.0" y="615.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">al exterior</text>
<text x="886.0" y="80.0" font-size="15.5" text-anchor="middle" fill="#6b46c1" font-weight="700">Sistema reproductor femenino</text>
<rect x="626" y="120" width="492" height="86" rx="11" fill="#f3ebff" stroke="#6b46c1" stroke-width="2"/>
<text x="748.0" y="148.0" font-size="14" text-anchor="middle" fill="#6b46c1" font-weight="700">Ovario</text>
<text x="970.0" y="150.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">produce ovocitos, estrógenos</text>
<text x="970.0" y="169.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">y progesterona</text>
<line x1="872" y1="206" x2="872" y2="228" stroke="#6b46c1" stroke-width="2.5" marker-end="url(#flg)"/>
<rect x="626" y="230" width="492" height="86" rx="11" fill="#f3ebff" stroke="#6b46c1" stroke-width="2"/>
<text x="748.0" y="258.0" font-size="14" text-anchor="middle" fill="#6b46c1" font-weight="700">Trompa uterina</text>
<text x="970.0" y="260.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">capta y transporta el ovocito;</text>
<text x="970.0" y="279.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">aquí ocurre la fecundación</text>
<line x1="872" y1="316" x2="872" y2="338" stroke="#6b46c1" stroke-width="2.5" marker-end="url(#flg)"/>
<rect x="626" y="340" width="492" height="86" rx="11" fill="#f3ebff" stroke="#6b46c1" stroke-width="2"/>
<text x="748.0" y="368.0" font-size="14" text-anchor="middle" fill="#6b46c1" font-weight="700">Útero (endometrio)</text>
<text x="970.0" y="370.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">aquí se implanta y se desarrolla</text>
<text x="970.0" y="389.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">el embrión</text>
<line x1="872" y1="426" x2="872" y2="448" stroke="#6b46c1" stroke-width="2.5" marker-end="url(#flg)"/>
<rect x="626" y="450" width="492" height="86" rx="11" fill="#f3ebff" stroke="#6b46c1" stroke-width="2"/>
<text x="748.0" y="478.0" font-size="14" text-anchor="middle" fill="#6b46c1" font-weight="700">Cuello uterino</text>
<text x="970.0" y="480.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">su moco cambia a lo largo</text>
<text x="970.0" y="499.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">del ciclo</text>
<line x1="872" y1="536" x2="872" y2="558" stroke="#6b46c1" stroke-width="2.5" marker-end="url(#flg)"/>
<rect x="626" y="566" width="492" height="58" rx="11" fill="#f3ebff" stroke="#6b46c1" stroke-width="2"/>
<text x="748.0" y="594.0" font-size="14" text-anchor="middle" fill="#6b46c1" font-weight="700">Vagina</text>
<text x="970.0" y="596.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">recibe el semen; canal del parto</text>
</svg>
