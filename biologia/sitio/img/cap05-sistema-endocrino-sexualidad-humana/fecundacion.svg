<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img" aria-label="Recorrido desde el ovario y la trompa uterina, donde ocurre la fecundación, hasta la implantación del blastocisto en el útero, con los siete pasos de la fecundación" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Recorrido desde el ovario y la trompa uterina, donde ocurre la fecundación, hasta la implantación del blastocisto en el útero, con los siete pasos de la fecundación</title>
<rect width="1180" height="640" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="flm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/></marker><marker id="fln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker></defs>
<text x="590.0" y="34.0" font-size="21" text-anchor="middle" fill="#1a202c" font-weight="700">De la fecundación en la trompa a la implantación en el útero</text>
<path d="M470,330 L470,470 C470,520 530,540 590,540 C650,540 710,520 710,470 L710,330 C710,300 640,286 590,286 C540,286 470,300 470,330 z" fill="#f3ebff" stroke="#6b46c1" stroke-width="3"/>
<text x="590.0" y="504.0" font-size="15" text-anchor="middle" fill="#6b46c1" font-weight="700">ÚTERO</text>
<path d="M470,330 C440,290 400,250 330,232" fill="none" stroke="#6b46c1" stroke-width="16" stroke-linecap="round"/>
<path d="M470,330 C440,290 400,250 330,232" fill="none" stroke="#faf5ff" stroke-width="8" stroke-linecap="round"/>
<circle cx="286" cy="226" r="44" fill="#c6f6d5" stroke="#2f855a" stroke-width="3"/>
<text x="286.0" y="232.0" font-size="12.5" text-anchor="middle" fill="#2f855a" font-weight="700">OVARIO</text>
<text x="392.0" y="196.0" font-size="12.5" text-anchor="middle" fill="#6b46c1" font-weight="700">TROMPA UTERINA</text>
<path d="M590,540 L590,596" stroke="#6b46c1" stroke-width="14" stroke-linecap="round"/>
<text x="552.0" y="586.0" font-size="12" text-anchor="end" fill="#4a5568" font-weight="normal">cuello uterino y vagina</text>
<circle cx="372" cy="246" r="20" fill="#e9d8fd" stroke="#6b46c1" stroke-width="2.5"/>
<line x1="372" y1="212" x2="372" y2="152" stroke="#4a5568" stroke-width="1.6"/>
<rect x="240" y="92" width="272" height="58" rx="11" fill="#fff5eb" stroke="#c05621" stroke-width="2"/>
<text x="376.0" y="116.0" font-size="14" text-anchor="middle" fill="#c05621" font-weight="700">FECUNDACIÓN</text>
<text x="376.0" y="136.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">en el tercio externo de la trompa</text>
<circle cx="372" cy="246" r="15" fill="#ffffff" stroke="#6b46c1" stroke-width="2"/>
<text x="394.0" y="240.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="700">cigoto</text>
<text x="394.0" y="256.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal">día 1</text>
<circle cx="452" cy="288" r="15" fill="#ffffff" stroke="#6b46c1" stroke-width="2"/>
<circle cx="458.0" cy="288.0" r="4.4" fill="#d6bcfa"/>
<circle cx="452.0" cy="294.0" r="4.4" fill="#d6bcfa"/>
<circle cx="446.0" cy="288.0" r="4.4" fill="#d6bcfa"/>
<circle cx="452.0" cy="282.0" r="4.4" fill="#d6bcfa"/>
<text x="474.0" y="282.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="700">4–8 células</text>
<text x="474.0" y="298.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal">días 2–3</text>
<circle cx="528" cy="330" r="15" fill="#ffffff" stroke="#6b46c1" stroke-width="2"/>
<circle cx="534.0" cy="330.0" r="4.4" fill="#d6bcfa"/>
<circle cx="529.9" cy="335.7" r="4.4" fill="#d6bcfa"/>
<circle cx="523.1" cy="333.5" r="4.4" fill="#d6bcfa"/>
<circle cx="523.1" cy="326.5" r="4.4" fill="#d6bcfa"/>
<circle cx="529.9" cy="324.3" r="4.4" fill="#d6bcfa"/>
<text x="550.0" y="324.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="700">mórula</text>
<text x="550.0" y="340.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal">día 4</text>
<circle cx="590" cy="386" r="15" fill="#ffffff" stroke="#6b46c1" stroke-width="2"/>
<circle cx="596.0" cy="386.0" r="4.4" fill="#d6bcfa"/>
<circle cx="593.0" cy="391.2" r="4.4" fill="#d6bcfa"/>
<circle cx="587.0" cy="391.2" r="4.4" fill="#d6bcfa"/>
<circle cx="584.0" cy="386.0" r="4.4" fill="#d6bcfa"/>
<circle cx="587.0" cy="380.8" r="4.4" fill="#d6bcfa"/>
<circle cx="593.0" cy="380.8" r="4.4" fill="#d6bcfa"/>
<text x="612.0" y="380.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="700">blastocisto</text>
<text x="612.0" y="396.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal">días 5–6</text>
<path d="M390,258 C420,272 430,278 440,282" fill="none" stroke="#6b46c1" stroke-width="2.4" marker-end="url(#flm)"/>
<path d="M468,300 C492,312 500,318 514,324" fill="none" stroke="#6b46c1" stroke-width="2.4" marker-end="url(#flm)"/>
<path d="M542,344 C562,356 572,368 580,376" fill="none" stroke="#6b46c1" stroke-width="2.4" marker-end="url(#flm)"/>
<line x1="590" y1="404" x2="590" y2="436" stroke="#c53030" stroke-width="3" marker-end="url(#flg)"/>
<text x="590.0" y="456.0" font-size="12.5" text-anchor="middle" fill="#c53030" font-weight="700">IMPLANTACIÓN, días 6–7</text>
<rect x="760" y="92" width="386" height="470" rx="14" fill="#ffffff" stroke="#cbd5e0" stroke-width="2"/>
<text x="953.0" y="124.0" font-size="15" text-anchor="middle" fill="#1a202c" font-weight="700">Qué ocurre en la fecundación</text>
<text x="786.0" y="158.0" font-size="13" text-anchor="start" fill="#6b46c1" font-weight="700">1. Capacitación</text>
<text x="786.0" y="176.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">cambios en la membrana del</text>
<text x="786.0" y="202.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">espermatozoide dentro del tracto</text>
<text x="786.0" y="228.0" font-size="13" text-anchor="start" fill="#6b46c1" font-weight="700">2. Quimiotaxis</text>
<text x="786.0" y="246.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">se orienta hacia el ovocito</text>
<text x="786.0" y="272.0" font-size="13" text-anchor="start" fill="#6b46c1" font-weight="700">3. Corona radiada</text>
<text x="786.0" y="290.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">atraviesa las células foliculares</text>
<text x="786.0" y="316.0" font-size="13" text-anchor="start" fill="#6b46c1" font-weight="700">4. Reacción acrosómica</text>
<text x="786.0" y="334.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">las enzimas digieren la zona pelúcida</text>
<text x="786.0" y="360.0" font-size="13" text-anchor="start" fill="#6b46c1" font-weight="700">5. Reconocimiento y fusión</text>
<text x="786.0" y="378.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">se unen las membranas de los gametos</text>
<text x="786.0" y="404.0" font-size="13" text-anchor="start" fill="#6b46c1" font-weight="700">6. Bloqueo de poliespermia</text>
<text x="786.0" y="422.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">ningún otro espermatozoide entra</text>
<text x="786.0" y="448.0" font-size="13" text-anchor="start" fill="#6b46c1" font-weight="700">7. Cigoto</text>
<text x="786.0" y="466.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">se completa la meiosis: 46 cromosomas</text>
<rect x="778" y="486" width="350" height="58" rx="10" fill="#fde2e2" stroke="#c53030" stroke-width="2"/>
<text x="953.0" y="510.0" font-size="12" text-anchor="middle" fill="#c53030" font-weight="700">Sin el bloqueo de la poliespermia el cigoto</text>
<text x="953.0" y="528.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">tendría 69 cromosomas y no sería viable.</text>
<rect x="60" y="576" width="640" height="46" rx="10" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<text x="380.0" y="604.0" font-size="13" text-anchor="middle" fill="#14532d" font-weight="700">Ventana fértil: los 5 días previos a la ovulación y el día de la ovulación.</text>
</svg>
