<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="A la izquierda una trama trófica con productores, consumidores y descomponedores; a la derecha una pirámide de energía de cuatro niveles con la pérdida del noventa por ciento en cada paso" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
