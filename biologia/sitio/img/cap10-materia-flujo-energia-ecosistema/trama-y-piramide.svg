<text x="285.0" y="549.0" font-size="13" text-anchor="middle" fill="#c05621" font-weight="700">Descomponedores</text>
<path d="M520,392 C520,470 430,516 380,540" fill="none" stroke="#c05621" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#fln)"/>
<text x="452.0" y="470.0" font-size="11.5" text-anchor="middle" fill="#c05621" font-weight="700">materia muerta</text>
<text x="452.0" y="486.0" font-size="11.5" text-anchor="middle" fill="#c05621" font-weight="700">de todos los niveles</text>
<line x1="115" y1="460" x2="190" y2="534" stroke="#c05621" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#fln)"/>
<text x="285.0" y="592.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Las flechas van del que es comido al que come.</text>
