<line x1="698" y1="329.0" x2="726" y2="329.0" stroke="#cbd5e0" stroke-width="1.6"/>
<line x1="1048" y1="368" x2="1128" y2="368" stroke="#c53030" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#flr)"/>
<text x="1088.0" y="358.0" font-size="11.5" text-anchor="middle" fill="#c53030" font-weight="700">≈90 %</text>
<polygon points="782,292 990,292 944,210 828,210" fill="#68d391" stroke="#2f855a" stroke-width="2"/>
<text x="690.0" y="252.0" font-size="13" text-anchor="end" fill="#14532d" font-weight="700">Consumidores II</text>
<text x="690.0" y="269.0" font-size="11.5" text-anchor="end" fill="#4a5568" font-weight="normal">100 unidades</text>
<line x1="698" y1="247.0" x2="772" y2="247.0" stroke="#cbd5e0" stroke-width="1.6"/>
<line x1="1002" y1="286" x2="1082" y2="286" stroke="#c53030" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#flr)"/>
<text x="1042.0" y="276.0" font-size="11.5" text-anchor="middle" fill="#c53030" font-weight="700">≈90 %</text>
<polygon points="828,210 944,210 898,128 874,128" fill="#48a97a" stroke="#2f855a" stroke-width="2"/>
<text x="690.0" y="170.0" font-size="13" text-anchor="end" fill="#14532d" font-weight="700">Consumidores III</text>
<text x="690.0" y="187.0" font-size="11.5" text-anchor="end" fill="#4a5568" font-weight="normal">10 unidades</text>
<line x1="698" y1="165.0" x2="818" y2="165.0" stroke="#cbd5e0" stroke-width="1.6"/>
<text x="1184.0" y="176.0" font-size="11.5" text-anchor="end" fill="#c53030" font-weight="normal">se pierde como calor,</text>
<text x="1184.0" y="192.0" font-size="11.5" text-anchor="end" fill="#c53030" font-weight="normal">heces y partes no comidas</text>
<rect x="650" y="492" width="500" height="62" rx="11" fill="#fff5eb" stroke="#c05621" stroke-width="2"/>
<text x="900.0" y="516.0" font-size="13" text-anchor="middle" fill="#c05621" font-weight="700">La pirámide de energía nunca se invierte.</text>
<text x="900.0" y="538.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Las de biomasa y de números sí pueden hacerlo.</text>
