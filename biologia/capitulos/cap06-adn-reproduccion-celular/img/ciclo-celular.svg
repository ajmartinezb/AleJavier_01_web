<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 720" width="820" height="720" role="img" aria-label="Ciclo celular con sus fases y puntos de control" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Ciclo celular con sus fases y puntos de control</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker></defs>
<rect width="820" height="720" fill="#ffffff"/>
<text x="410.0" y="34.0" font-size="20" text-anchor="middle" fill="#1a202c" font-weight="700" >El ciclo celular (célula humana en cultivo, ≈ 24 h)</text><path d="M400.0,170.0 A200,200 0 0 1 451.8,563.2 L431.1,485.9 A120,120 0 0 0 400.0,250.0 Z" fill="#c6f6d5" stroke="#ffffff" stroke-width="3"/><text x="558.6" y="343.1" font-size="22" text-anchor="middle" fill="#1a202c" font-weight="700" >G1</text><text x="558.6" y="363.1" font-size="14" text-anchor="middle" fill="#1a202c" font-weight="normal" >≈ 11 h</text><path d="M451.8,563.2 A200,200 0 0 1 206.8,318.2 L284.1,338.9 A120,120 0 0 0 431.1,485.9 Z" fill="#9ae6b4" stroke="#ffffff" stroke-width="3"/><text x="286.9" y="477.1" font-size="22" text-anchor="middle" fill="#1a202c" font-weight="700" >S</text><text x="286.9" y="497.1" font-size="14" text-anchor="middle" fill="#1a202c" font-weight="normal" >≈ 8 h</text><path d="M206.8,318.2 A200,200 0 0 1 348.2,176.8 L368.9,254.1 A120,120 0 0 0 284.1,338.9 Z" fill="#68d391" stroke="#ffffff" stroke-width="3"/><text x="286.9" y="250.9" font-size="22" text-anchor="middle" fill="#1a202c" font-weight="700" >G2</text><text x="286.9" y="270.9" font-size="14" text-anchor="middle" fill="#1a202c" font-weight="normal" >≈ 4 h</text><path d="M348.2,176.8 A200,200 0 0 1 400.0,170.0 L400.0,250.0 A120,120 0 0 0 368.9,254.1 Z" fill="#2f855a" stroke="#ffffff" stroke-width="3"/><line x1="373.1" y1="165.8" x2="440.0" y2="118.0" stroke="#4a5568" stroke-width="1.2" /><text x="446.0" y="106.0" font-size="15" text-anchor="start" fill="#1a202c" font-weight="700" >Fase M ≈ 1 h</text><text x="446.0" y="124.0" font-size="14" text-anchor="start" fill="#4a5568" font-weight="normal" >mitosis + citocinesis</text><text x="240.9" y="538.1" font-size="14" text-anchor="end" fill="#4a5568" font-weight="normal" >S: replicación del ADN</text><text x="244.7" y="218.7" font-size="14" text-anchor="end" fill="#4a5568" font-weight="normal" >G2: preparación</text><text x="244.7" y="235.7" font-size="14" text-anchor="end" fill="#4a5568" font-weight="normal" >para la mitosis</text><path d="M405.4,266.1 A104,104 0 1 1 367.9,271.1" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#ar)"/><text x="400.0" y="360.0" font-size="18" text-anchor="middle" fill="#2f855a" font-weight="700" >INTERFASE</text><text x="400.0" y="382.0" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="normal" >G1 + S + G2</text><text x="400.0" y="402.0" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal" >≈ 23 h</text><line x1="600.9" y1="334.6" x2="665.9" y2="323.1" stroke="#2f855a" stroke-width="2.5" marker-end="url(#arg)"/><circle cx="701.9" cy="327.1" r="32" fill="#ffffff" stroke="#2f855a" stroke-width="2.5"/><text x="701.9" y="334.1" font-size="20" text-anchor="middle" fill="#2f855a" font-weight="700" >G0</text><text x="701.9" y="385.1" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal" >Salida del ciclo:</text><text x="701.9" y="402.1" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal" >células que no se dividen</text><text x="701.9" y="419.1" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal" >(p. ej., neuronas)</text><line x1="451.8" y1="563.2" x2="457.5" y2="584.4" stroke="#c05621" stroke-width="2" /><polygon points="469.5,589.4 462.4,596.4 452.5,596.4 445.4,589.4 445.4,579.5 452.5,572.4 462.4,572.4 469.5,579.5" fill="#c05621" stroke="#ffffff" stroke-width="1.5"/><rect x="450.45782801275965" y="582.4355334361732" width="14" height="4" fill="#ffffff"/><text x="477.5" y="589.4" font-size="15" text-anchor="start" fill="#c05621" font-weight="700" >Punto de control G1–S</text><text x="477.5" y="607.4" font-size="14" text-anchor="start" fill="#4a5568" font-weight="normal" >¿tamaño, nutrientes y ADN correctos?</text><line x1="348.2" y1="176.8" x2="340.5" y2="147.8" stroke="#c05621" stroke-width="2" /><polygon points="352.5,152.8 345.4,159.8 335.5,159.8 328.5,152.8 328.5,142.9 335.5,135.8 345.4,135.8 352.5,142.9" fill="#c05621" stroke="#ffffff" stroke-width="1.5"/><rect x="333.47161962642025" y="145.83705995351428" width="14" height="4" fill="#ffffff"/><text x="322.5" y="145.8" font-size="15" text-anchor="end" fill="#c05621" font-weight="700" >Punto de control G2–M</text><text x="322.5" y="163.8" font-size="14" text-anchor="end" fill="#4a5568" font-weight="normal" >¿ADN replicado sin daños?</text><polygon points="391.1,216.3 384.1,223.4 374.1,223.4 367.1,216.3 367.1,206.4 374.1,199.4 384.1,199.4 391.1,206.4" fill="#c05621" stroke="#ffffff" stroke-width="1.5"/><rect x="372.1158092447917" y="209.36882218019034" width="14" height="4" fill="#ffffff"/><line x1="391.1" y1="221.4" x2="470.0" y2="205.0" stroke="#c05621" stroke-width="1.5" /><text x="476.0" y="200.0" font-size="15" text-anchor="start" fill="#c05621" font-weight="700" >Punto de control de metafase</text><text x="476.0" y="218.0" font-size="14" text-anchor="start" fill="#4a5568" font-weight="normal" >¿todos los cromosomas unidos al huso?</text><polygon points="72.0,695.0 65.0,702.0 55.0,702.0 48.0,695.0 48.0,685.0 55.0,678.0 65.0,678.0 72.0,685.0" fill="#c05621" stroke="#ffffff" stroke-width="1.5"/><rect x="53" y="688" width="14" height="4" fill="#ffffff"/><text x="80.0" y="695.0" font-size="14" text-anchor="start" fill="#4a5568" font-weight="normal" >= punto de control   ·   la flecha interior indica el sentido del ciclo</text>
</svg>
