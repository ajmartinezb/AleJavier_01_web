<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-label="Eje hipotálamo-hipófisis-gónada: el hipotálamo libera GnRH, la hipófisis libera FSH y LH, las gónadas producen hormonas sexuales que frenan a los dos niveles superiores" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Eje hipotálamo-hipófisis-gónada: el hipotálamo libera GnRH, la hipófisis libera FSH y LH, las gónadas producen hormonas sexuales que frenan a los dos niveles superiores</title>
<rect width="1100" height="640" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="flr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="fla" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker></defs>
<text x="550.0" y="34.0" font-size="21" text-anchor="middle" fill="#1a202c" font-weight="700">El eje hipotálamo–hipófisis–gónada</text>
<rect x="300" y="80" width="260" height="74" rx="12" fill="#f3ebff" stroke="#6b46c1" stroke-width="2"/><text x="430.0" y="104.0" font-size="15" text-anchor="middle" fill="#6b46c1" font-weight="700">HIPOTÁLAMO</text><text x="430.0" y="126.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">libera GnRH en pulsos</text>
<rect x="300" y="250" width="260" height="74" rx="12" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/><text x="430.0" y="274.0" font-size="15" text-anchor="middle" fill="#2b6cb0" font-weight="700">HIPÓFISIS anterior</text><text x="430.0" y="296.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">libera FSH y LH</text>
<rect x="270" y="420" width="320" height="92" rx="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/><text x="430.0" y="444.0" font-size="15" text-anchor="middle" fill="#2f855a" font-weight="700">GÓNADAS</text><text x="430.0" y="466.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">ovario: estrógenos y progesterona</text><text x="430.0" y="484.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">testículo: testosterona</text>
<line x1="430" y1="154" x2="430" y2="244" stroke="#6b46c1" stroke-width="3" marker-end="url(#flg)"/>
<text x="442.0" y="204.0" font-size="13" text-anchor="start" fill="#6b46c1" font-weight="700">GnRH</text>
<line x1="430" y1="324" x2="430" y2="414" stroke="#2b6cb0" stroke-width="3" marker-end="url(#flg)"/>
<text x="442.0" y="374.0" font-size="13" text-anchor="start" fill="#2b6cb0" font-weight="700">FSH y LH</text>
<line x1="390" y1="512" x2="390" y2="566" stroke="#2f855a" stroke-width="3" marker-end="url(#flv)"/>
<rect x="180" y="566" width="420" height="56" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2"/><text x="390.0" y="599.0" font-size="14" text-anchor="middle" fill="#2f855a" font-weight="700">Órganos reproductores y todo el cuerpo</text>
<path d="M600,466 C730,430 730,180 564,117" fill="none" stroke="#c53030" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#flr)"/>
<path d="M600,476 C680,440 680,320 564,287" fill="none" stroke="#c53030" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#flr)"/>
<text x="746.0" y="300.0" font-size="13.5" text-anchor="start" fill="#c53030" font-weight="700">retroalimentación</text>
<text x="746.0" y="320.0" font-size="13.5" text-anchor="start" fill="#c53030" font-weight="700">negativa</text>
<text x="746.0" y="344.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">las hormonas sexuales</text>
<text x="746.0" y="362.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">frenan los dos niveles</text>
<text x="746.0" y="380.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">superiores</text>
<rect x="36" y="250" width="236" height="150" rx="12" fill="#fff5eb" stroke="#c05621" stroke-width="2"/>
<text x="154.0" y="278.0" font-size="14" text-anchor="middle" fill="#c05621" font-weight="700">La excepción</text>
<text x="154.0" y="302.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">Antes de ovular, los</text>
<text x="154.0" y="320.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">estrógenos altos invierten</text>
<text x="154.0" y="338.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">el efecto y provocan el</text>
<text x="154.0" y="356.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">pico de LH:</text>
<text x="154.0" y="380.0" font-size="12.5" text-anchor="middle" fill="#c05621" font-weight="700">retroalimentación positiva</text>
</svg>
