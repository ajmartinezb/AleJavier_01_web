<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-label="Fases del potencial de acción en función del tiempo" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Fases del potencial de acción en función del tiempo</title>
<rect width="1120" height="600" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="fln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker></defs>
<text x="560.0" y="34.0" font-size="21" text-anchor="middle" fill="#1a202c" font-weight="700">El potencial de acción</text>
<line x1="130" y1="430" x2="750" y2="430" stroke="#4a5568" stroke-width="1.8" marker-end="url(#flg)"/>
<line x1="130" y1="430" x2="130" y2="96" stroke="#4a5568" stroke-width="1.8" marker-end="url(#flg)"/>
<text x="138.0" y="456.0" font-size="13" text-anchor="start" fill="#4a5568" font-weight="normal">tiempo (milisegundos)</text>
<text x="72.0" y="88.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">mV</text>
<line x1="124" y1="110.0" x2="130" y2="110.0" stroke="#4a5568" stroke-width="1.5"/>
<text x="118.0" y="114.0" font-size="12.5" text-anchor="end" fill="#4a5568" font-weight="normal">+40</text>
<line x1="124" y1="208.5" x2="130" y2="208.5" stroke="#4a5568" stroke-width="1.5"/>
<text x="118.0" y="212.5" font-size="12.5" text-anchor="end" fill="#4a5568" font-weight="normal">0</text>
<line x1="124" y1="343.8" x2="130" y2="343.8" stroke="#4a5568" stroke-width="1.5"/>
<text x="118.0" y="347.8" font-size="12.5" text-anchor="end" fill="#4a5568" font-weight="normal">-55</text>
<line x1="124" y1="380.8" x2="130" y2="380.8" stroke="#4a5568" stroke-width="1.5"/>
<text x="118.0" y="384.8" font-size="12.5" text-anchor="end" fill="#4a5568" font-weight="normal">-70</text>
<line x1="124" y1="430.0" x2="130" y2="430.0" stroke="#4a5568" stroke-width="1.5"/>
<text x="118.0" y="434.0" font-size="12.5" text-anchor="end" fill="#4a5568" font-weight="normal">-90</text>
<line x1="130" y1="343.8" x2="720" y2="343.8" stroke="#c05621" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="728.0" y="347.8" font-size="12.5" text-anchor="start" fill="#c05621" font-weight="700">umbral −55 mV</text>
<line x1="130" y1="380.8" x2="720" y2="380.8" stroke="#2b6cb0" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="728.0" y="384.8" font-size="12.5" text-anchor="start" fill="#2b6cb0" font-weight="700">reposo −70 mV</text>
<path d="M130.0,380.8 L189.0,380.8 L224.4,361.1 L248.0,343.8 L271.6,282.3 L295.2,196.2 L318.8,139.5 L330.6,134.6 L354.2,178.9 L389.6,270.0 L425.0,351.2 L460.4,400.5 L495.8,410.3 L554.8,395.5 L631.5,380.8 L720.0,380.8" fill="none" stroke="#2f855a" stroke-width="3.4" stroke-linejoin="round"/>
<line x1="280.4" y1="238.0" x2="230.0" y2="200.0" stroke="#c05621" stroke-width="1.3"/>
<text x="230.0" y="204.0" font-size="13" text-anchor="end" fill="#c05621" font-weight="700">Despolarización</text>
<text x="230.0" y="220.0" font-size="12" text-anchor="end" fill="#4a5568" font-weight="normal">entra Na⁺</text>
<line x1="398.4" y1="252.8" x2="441.0" y2="214.8" stroke="#2b6cb0" stroke-width="1.3"/>
<text x="441.0" y="218.8" font-size="13" text-anchor="start" fill="#2b6cb0" font-weight="700">Repolarización</text>
<text x="441.0" y="234.8" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">sale K⁺</text>
<line x1="495.8" y1="410.3" x2="557.0" y2="454.2" stroke="#6b46c1" stroke-width="1.3"/>
<text x="557.0" y="446.2" font-size="13" text-anchor="start" fill="#6b46c1" font-weight="700">Hiperpolarización</text>
<text x="557.0" y="462.2" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">sale K⁺ de más</text>
<line x1="165.4" y1="380.8" x2="156.6" y2="314.8" stroke="#4a5568" stroke-width="1.3"/>
<text x="156.6" y="318.8" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="700">Reposo</text>
<text x="156.6" y="334.8" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">−70 mV</text>
<rect x="60" y="470" width="1000" height="112" rx="12" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.8"/>
<text x="90.0" y="496.0" font-size="12.5" text-anchor="start" fill="#1a202c" font-weight="700">Fase</text>
<text x="330.0" y="496.0" font-size="12.5" text-anchor="start" fill="#1a202c" font-weight="700">Canales</text>
<text x="590.0" y="496.0" font-size="12.5" text-anchor="start" fill="#1a202c" font-weight="700">Ion</text>
<text x="820.0" y="496.0" font-size="12.5" text-anchor="start" fill="#1a202c" font-weight="700">Potencial</text>
<line x1="80" y1="504" x2="1040" y2="504" stroke="#cbd5e0" stroke-width="1.2"/>
<text x="90.0" y="522.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">Despolarización</text>
<text x="330.0" y="522.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">se abren los de Na⁺</text>
<text x="590.0" y="522.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">Na⁺ ENTRA</text>
<text x="820.0" y="522.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">sube a ≈ +30 mV</text>
<text x="90.0" y="548.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">Repolarización</text>
<text x="330.0" y="548.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">se abren los de K⁺</text>
<text x="590.0" y="548.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">K⁺ SALE</text>
<text x="820.0" y="548.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">baja hacia el reposo</text>
<text x="90.0" y="574.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">Retorno al reposo</text>
<text x="330.0" y="574.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">bomba Na⁺/K⁺ (gasta ATP)</text>
<text x="590.0" y="574.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">3 Na⁺ fuera, 2 K⁺ dentro</text>
<text x="820.0" y="574.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">vuelve a −70 mV</text>
<rect x="790" y="120" width="300" height="150" rx="12" fill="#fffaf0" stroke="#c05621" stroke-width="1.6"/>
<text x="940.0" y="146.0" font-size="14.5" text-anchor="middle" fill="#c05621" font-weight="700">Ley del todo o nada</text>
<text x="940.0" y="170.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">Si NO se alcanza el umbral,</text>
<text x="940.0" y="186.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">no hay potencial de acción.</text>
<text x="940.0" y="202.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal"></text>
<text x="940.0" y="218.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">Si se alcanza, siempre tiene</text>
<text x="940.0" y="234.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">la MISMA amplitud.</text>
<text x="940.0" y="250.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal"></text>
<text x="940.0" y="266.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">Un estímulo más intenso da</text>
<text x="940.0" y="282.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">más picos por segundo.</text>
</svg>
