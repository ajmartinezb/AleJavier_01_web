<text x="68.0" y="104.0" font-size="14" text-anchor="middle" fill="#6b46c1" font-weight="700">Dendritas</text>
<text x="68.0" y="121.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">reciben la señal</text>
<text x="166.0" y="312.0" font-size="14" text-anchor="middle" fill="#2f855a" font-weight="700">Soma</text>
<text x="166.0" y="329.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">integra las señales</text>
<text x="352.0" y="366.0" font-size="14" text-anchor="middle" fill="#2f855a" font-weight="700">Cono axónico</text>
<text x="352.0" y="383.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">dispara el potencial</text>
<text x="560.0" y="138.0" font-size="14" text-anchor="middle" fill="#975a16" font-weight="700">Vaina de mielina</text>
<text x="560.0" y="155.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">aísla y acelera</text>
<text x="742.0" y="308.0" font-size="14" text-anchor="middle" fill="#c05621" font-weight="700">Nodo de Ranvier</text>
<text x="742.0" y="325.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">el impulso se regenera</text>
<text x="1048.0" y="108.0" font-size="14" text-anchor="middle" fill="#2b6cb0" font-weight="700">Terminales axónicos</text>
<text x="1048.0" y="125.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">liberan neurotransmisor</text>
