<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 664" width="920" height="664" role="img" aria-label="Las tres líneas de defensa del organismo con sus componentes y sus características" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Las tres líneas de defensa del organismo con sus componentes y sus características</title>
<rect width="920" height="664" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs>
<text x="460.0" y="30.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Las tres líneas de defensa</text>
<text x="460.0" y="52.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Las dos primeras son inespecíficas; solo la tercera reconoce y recuerda</text>
<rect x="50" y="84" width="820" height="166" rx="14" fill="#f7fafc" stroke="#4a5568" stroke-width="2.4"/>
<text x="70.0" y="112.0" font-size="15" text-anchor="start" fill="#4a5568" font-weight="700">1.ª línea · BARRERAS EXTERNAS</text>
<text x="850.0" y="112.0" font-size="11.5" text-anchor="end" fill="#4a5568" font-weight="normal" font-style="italic">inespecífica · inmediata · sin memoria</text>
<rect x="68" y="134" width="390" height="46" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="84.0" y="154.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="700">Piel</text>
<text x="84.0" y="170.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">capa queratinizada intacta</text>
<rect x="478" y="134" width="390" height="46" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="494.0" y="154.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="700">Mucosas y cilios</text>
<text x="494.0" y="170.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">mucus que atrapa y barre</text>
<rect x="68" y="190" width="390" height="46" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="84.0" y="210.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="700">Secreciones</text>
<text x="84.0" y="226.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">pH ácido y lisozima</text>
<rect x="478" y="190" width="390" height="46" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="494.0" y="210.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="700">Microbiota</text>
<text x="494.0" y="226.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">ocupa el espacio del patógeno</text>
<rect x="50" y="264" width="820" height="166" rx="14" fill="#fffaf0" stroke="#c05621" stroke-width="2.4"/>
<text x="70.0" y="292.0" font-size="15" text-anchor="start" fill="#c05621" font-weight="700">2.ª línea · RESPUESTA INNATA</text>
<text x="850.0" y="292.0" font-size="11.5" text-anchor="end" fill="#4a5568" font-weight="normal" font-style="italic">inespecífica · horas · sin memoria</text>
<rect x="68" y="314" width="390" height="46" rx="10" fill="#ffffff" stroke="#c05621" stroke-width="1.5"/>
<text x="84.0" y="334.0" font-size="12.5" text-anchor="start" fill="#c05621" font-weight="700">Inflamación</text>
<text x="84.0" y="350.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">más flujo de células y plasma</text>
<rect x="478" y="314" width="390" height="46" rx="10" fill="#ffffff" stroke="#c05621" stroke-width="1.5"/>
<text x="494.0" y="334.0" font-size="12.5" text-anchor="start" fill="#c05621" font-weight="700">Fagocitosis</text>
<text x="494.0" y="350.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">macrófagos y neutrófilos</text>
<rect x="68" y="370" width="390" height="46" rx="10" fill="#ffffff" stroke="#c05621" stroke-width="1.5"/>
<text x="84.0" y="390.0" font-size="12.5" text-anchor="start" fill="#c05621" font-weight="700">Fiebre</text>
<text x="84.0" y="406.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">frena la multiplicación</text>
<rect x="478" y="370" width="390" height="46" rx="10" fill="#ffffff" stroke="#c05621" stroke-width="1.5"/>
<text x="494.0" y="390.0" font-size="12.5" text-anchor="start" fill="#c05621" font-weight="700">Interferón</text>
<text x="494.0" y="406.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">avisa a las células vecinas</text>
<rect x="50" y="444" width="820" height="166" rx="14" fill="#f0fff4" stroke="#2f855a" stroke-width="2.4"/>
<text x="70.0" y="472.0" font-size="15" text-anchor="start" fill="#2f855a" font-weight="700">3.ª línea · RESPUESTA ESPECÍFICA</text>
<text x="850.0" y="472.0" font-size="11.5" text-anchor="end" fill="#4a5568" font-weight="normal" font-style="italic">ESPECÍFICA · días la 1.ª vez · CON MEMORIA</text>
<rect x="68" y="494" width="390" height="46" rx="10" fill="#ffffff" stroke="#2f855a" stroke-width="1.5"/>
<text x="84.0" y="514.0" font-size="12.5" text-anchor="start" fill="#2f855a" font-weight="700">Linfocito B</text>
<text x="84.0" y="530.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">produce anticuerpos</text>
<rect x="478" y="494" width="390" height="46" rx="10" fill="#ffffff" stroke="#2f855a" stroke-width="1.5"/>
<text x="494.0" y="514.0" font-size="12.5" text-anchor="start" fill="#2f855a" font-weight="700">Linfocito T citotóxico</text>
<text x="494.0" y="530.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">destruye células infectadas</text>
<rect x="68" y="550" width="390" height="46" rx="10" fill="#ffffff" stroke="#2f855a" stroke-width="1.5"/>
<text x="84.0" y="570.0" font-size="12.5" text-anchor="start" fill="#2f855a" font-weight="700">Linfocito T colaborador</text>
<text x="84.0" y="586.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">coordina la respuesta</text>
<rect x="478" y="550" width="390" height="46" rx="10" fill="#ffffff" stroke="#2f855a" stroke-width="1.5"/>
<text x="494.0" y="570.0" font-size="12.5" text-anchor="start" fill="#2f855a" font-weight="700">Células de memoria</text>
<text x="494.0" y="586.0" font-size="11" text-anchor="start" fill="#4a5568" font-weight="normal">respuesta rápida la 2.ª vez</text>
<line x1="460.0" y1="250" x2="460.0" y2="264" stroke="#4a5568" stroke-width="2.2" marker-end="url(#flg)"/>
<line x1="460.0" y1="430" x2="460.0" y2="444" stroke="#4a5568" stroke-width="2.2" marker-end="url(#flg)"/>
<text x="460.0" y="640.0" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="700">Cada línea actúa solo si la anterior no bastó. La memoria de la tercera es lo que hace posibles las vacunas.</text>
</svg>
