<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-label="Curvas de respuesta primaria y secundaria, principio de la vacunación e inmunidad activa frente a pasiva" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Curvas de respuesta primaria y secundaria, principio de la vacunación e inmunidad activa frente a pasiva</title>
<rect width="920" height="560" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker></defs>
<text x="460.0" y="30.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Respuesta primaria, secundaria y vacunación</text>
<text x="460.0" y="52.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">La vacuna provoca la primera respuesta sin provocar la enfermedad</text>
<line x1="90" y1="320" x2="530" y2="320" stroke="#4a5568" stroke-width="2"/>
<line x1="90" y1="320" x2="90" y2="90" stroke="#4a5568" stroke-width="2"/>
<text x="530.0" y="340.0" font-size="12" text-anchor="end" fill="#4a5568" font-weight="normal">tiempo →</text>
<text transform="translate(64,205.0) rotate(-90)" font-size="12" text-anchor="middle" fill="#4a5568">anticuerpos en sangre</text>
<line x1="150" y1="320" x2="150" y2="100" stroke="#cbd5e0" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="150.0" y="342.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">1.er contacto</text>
<line x1="330" y1="320" x2="330" y2="100" stroke="#cbd5e0" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="330.0" y="342.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">2.º contacto</text>
<path d="M150,320 C186,320 194,256 220,256 C260,256 290,316 326,318" fill="none" stroke="#2b6cb0" stroke-width="2.8"/>
<path d="M330,318 C348,318 356,114 386,114 C430,114 470,200 520,230" fill="none" stroke="#2f855a" stroke-width="2.8"/>
<text x="230.0" y="218.0" font-size="11.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">respuesta primaria</text>
<text x="230.0" y="234.0" font-size="10.5" text-anchor="middle" fill="#2b6cb0" font-weight="normal">lenta y baja</text>
<text x="390.0" y="96.0" font-size="11.5" text-anchor="middle" fill="#2f855a" font-weight="700">respuesta secundaria</text>
<text x="484.0" y="148.0" font-size="10.5" text-anchor="middle" fill="#2f855a" font-weight="normal">rápida, alta y duradera</text>
<rect x="570" y="90" width="300" height="230" rx="14" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
<text x="720.0" y="116.0" font-size="15" text-anchor="middle" fill="#2f855a" font-weight="700">Qué hace la vacuna</text>
<text x="588.0" y="146.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">1. Entra el antígeno sin la enfermedad:</text>
<text x="588.0" y="171.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">    agente muerto, atenuado o un fragmento.</text>
<text x="588.0" y="196.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">2. El cuerpo monta la respuesta primaria.</text>
<text x="588.0" y="221.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">3. Quedan linfocitos de MEMORIA.</text>
<text x="588.0" y="246.0" font-size="12" text-anchor="start" fill="#1a202c" font-weight="normal">4. Si llega el agente real, la respuesta</text>
<text x="588.0" y="271.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="normal">    que se desencadena es la secundaria.</text>
<text x="720.0" y="300.0" font-size="11.5" text-anchor="middle" fill="#c05621" font-weight="700">No cura: prepara. Se da a personas sanas.</text>
<rect x="50" y="356" width="400" height="176" rx="14" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
<text x="250.0" y="382.0" font-size="14.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">Inmunidad ACTIVA</text>
<text x="250.0" y="408.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">los anticuerpos los produce el propio cuerpo</text>
<text x="250.0" y="434.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">se adquiere por infección o por vacuna</text>
<text x="250.0" y="460.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">tarda días o semanas en hacer efecto</text>
<text x="250.0" y="486.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="700">DEJA MEMORIA · dura años</text>
<rect x="470" y="356" width="400" height="176" rx="14" fill="#ffffff" stroke="#c05621" stroke-width="2"/>
<text x="670.0" y="382.0" font-size="14.5" text-anchor="middle" fill="#c05621" font-weight="700">Inmunidad PASIVA</text>
<text x="670.0" y="408.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">los anticuerpos vienen ya formados de fuera</text>
<text x="670.0" y="434.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">placenta, leche materna o suero inyectado</text>
<text x="670.0" y="460.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">protege de inmediato</text>
<text x="670.0" y="486.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="700">NO deja memoria · dura semanas</text>
</svg>
