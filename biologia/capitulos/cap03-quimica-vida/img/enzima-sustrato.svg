<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" role="img" aria-label="Ciclo de una enzima con su sustrato, curva de energía de activación con y sin enzima, y efecto de la temperatura y el pH" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Ciclo de una enzima con su sustrato, curva de energía de activación con y sin enzima, y efecto de la temperatura y el pH</title>
<rect width="920" height="600" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker></defs>
<text x="460.0" y="30.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Cómo trabaja una enzima</text>
<text x="460.0" y="52.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Baja la energía de activación; no aporta energía ni cambia el resultado</text>
<text x="70.0" y="88.0" font-size="14.5" text-anchor="start" fill="#2f855a" font-weight="700">1. El ciclo</text>
<rect x="80" y="112" width="150" height="112" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
<text x="155.0" y="216.0" font-size="12" text-anchor="middle" fill="#2f855a" font-weight="700">Enzima libre</text>
<line x1="236" y1="162" x2="294" y2="162" stroke="#4a5568" stroke-width="2.2" marker-end="url(#flg)"/>
<rect x="300" y="112" width="150" height="112" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
<text x="375.0" y="216.0" font-size="12" text-anchor="middle" fill="#2f855a" font-weight="700">Enzima-sustrato</text>
<line x1="456" y1="162" x2="514" y2="162" stroke="#4a5568" stroke-width="2.2" marker-end="url(#flg)"/>
<rect x="520" y="112" width="150" height="112" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
<text x="595.0" y="216.0" font-size="12" text-anchor="middle" fill="#2f855a" font-weight="700">Reacción</text>
<line x1="676" y1="162" x2="734" y2="162" stroke="#4a5568" stroke-width="2.2" marker-end="url(#flg)"/>
<rect x="740" y="112" width="150" height="112" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
<text x="815.0" y="216.0" font-size="12" text-anchor="middle" fill="#2f855a" font-weight="700">Productos</text>
<path d="M86,172 q0,-40 38,-40 q10,0 14,10 l8,14 l10,-14 q5,-10 15,-10 q38,0 38,40 q0,34 -56,34 q-56,0 -56,-34 z" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<text x="148.0" y="186.0" font-size="10" text-anchor="middle" fill="#4a5568" font-weight="normal">sitio activo</text>
<path d="M306,172 q0,-40 38,-40 q10,0 14,10 l8,14 l10,-14 q5,-10 15,-10 q38,0 38,40 q0,34 -56,34 q-56,0 -56,-34 z" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<path d="M354,130 l14,0 l6,12 l8,-12 l14,0 l0,22 l-42,0 z" fill="#fbd38d" stroke="#c05621" stroke-width="1.8"/>
<text x="375.0" y="106.0" font-size="10.5" text-anchor="middle" fill="#c05621" font-weight="700">sustrato</text>
<path d="M526,172 q0,-40 38,-40 q10,0 14,10 l8,14 l10,-14 q5,-10 15,-10 q38,0 38,40 q0,34 -56,34 q-56,0 -56,-34 z" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<path d="M574,130 l14,0 l6,12 l8,-12 l14,0 l0,22 l-42,0 z" fill="#fbd38d" stroke="#c05621" stroke-width="1.8"/>
<line x1="596" y1="132" x2="596" y2="156" stroke="#c53030" stroke-width="2.4" stroke-dasharray="4 3"/>
<path d="M746,172 q0,-40 38,-40 q10,0 14,10 l8,14 l10,-14 q5,-10 15,-10 q38,0 38,40 q0,34 -56,34 q-56,0 -56,-34 z" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<path d="M786,116 l14,0 l6,12 l0,10 l-20,0 z" fill="#fbd38d" stroke="#c05621" stroke-width="1.8"/>
<path d="M828,116 l14,0 l6,12 l0,10 l-20,0 z" fill="#fbd38d" stroke="#c05621" stroke-width="1.8"/>
<text x="460.0" y="254.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="700">La enzima queda intacta y vuelve a empezar: no se consume en la reacción.</text>
<rect x="70" y="272" width="780" height="1.5" fill="#cbd5e0"/>
<text x="70.0" y="300.0" font-size="14.5" text-anchor="start" fill="#2f855a" font-weight="700">2. La energía de activación</text>
<line x1="100" y1="510" x2="420" y2="510" stroke="#4a5568" stroke-width="2"/>
<line x1="100" y1="510" x2="100" y2="330" stroke="#4a5568" stroke-width="2"/>
<text x="260.0" y="536.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">avance de la reacción</text>
<text transform="translate(82,420.0) rotate(-90)" font-size="11.5" text-anchor="middle" fill="#4a5568">energía</text>
<path d="M114,464 C190,458 210,342 260,342 C310,342 330,480 400,486" fill="none" stroke="#c53030" stroke-width="2.6"/>
<path d="M114,464 C190,460 216,408 260,408 C304,408 330,480 400,486" fill="none" stroke="#2f855a" stroke-width="2.6" stroke-dasharray="7 5"/>
<text x="260.0" y="332.0" font-size="11.5" text-anchor="middle" fill="#c53030" font-weight="700">sin enzima</text>
<text x="260.0" y="400.0" font-size="11.5" text-anchor="middle" fill="#2f855a" font-weight="700">con enzima</text>
<text x="110.0" y="480.0" font-size="10.5" text-anchor="start" fill="#4a5568" font-weight="normal">reactantes</text>
<text x="400.0" y="504.0" font-size="10.5" text-anchor="end" fill="#4a5568" font-weight="normal">productos</text>
<rect x="450" y="330" width="400" height="92" rx="12" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.6"/>
<text x="468.0" y="356.0" font-size="12.5" text-anchor="start" fill="#c05621" font-weight="700">La enzima NO aporta energía</text>
<text x="468.0" y="378.0" font-size="11.8" text-anchor="start" fill="#4a5568" font-weight="normal">ni cambia el resultado final:</text>
<text x="468.0" y="396.0" font-size="11.8" text-anchor="start" fill="#4a5568" font-weight="normal">solo baja la barrera y por eso</text>
<text x="468.0" y="414.0" font-size="11.8" text-anchor="start" fill="#4a5568" font-weight="normal">la reacción ocurre más rápido.</text>
<line x1="480" y1="544" x2="640" y2="544" stroke="#4a5568" stroke-width="1.8"/>
<line x1="480" y1="544" x2="480" y2="448" stroke="#4a5568" stroke-width="1.8"/>
<path d="M484,540 C530,534 552,454 572,454 C584,454 588,538 600,540" fill="none" stroke="#2b6cb0" stroke-width="2.4"/>
<text x="560.0" y="564.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">temperatura</text>
<text x="560.0" y="440.0" font-size="10.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">óptimo, luego se desnaturaliza</text>
<line x1="700" y1="544" x2="860" y2="544" stroke="#4a5568" stroke-width="1.8"/>
<line x1="700" y1="544" x2="700" y2="448" stroke="#4a5568" stroke-width="1.8"/>
<path d="M708,540 C730,536 734,458 752,458 C770,458 774,540 796,540" fill="none" stroke="#6b46c1" stroke-width="2.2"/>
<path d="M762,540 C784,536 792,472 812,472 C832,472 838,540 856,540" fill="none" stroke="#c05621" stroke-width="2.2"/>
<text x="780.0" y="564.0" font-size="11" text-anchor="middle" fill="#4a5568" font-weight="normal">pH</text>
<text x="740.0" y="450.0" font-size="10.5" text-anchor="middle" fill="#6b46c1" font-weight="700">pepsina</text>
<text x="824.0" y="464.0" font-size="10.5" text-anchor="middle" fill="#c05621" font-weight="700">amilasa</text>
</svg>
