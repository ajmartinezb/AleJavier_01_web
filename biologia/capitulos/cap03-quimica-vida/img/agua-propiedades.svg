<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Molécula polar de agua, red de puentes de hidrógeno y cuatro propiedades biológicas derivadas" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Molécula polar de agua, red de puentes de hidrógeno y cuatro propiedades biológicas derivadas</title>
<rect width="900" height="600" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs>
<text x="450.0" y="30.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">El agua: de la polaridad a la función</text>
<text x="450.0" y="52.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Una molécula torcida explica casi todo lo que el agua hace en una célula</text>
<circle cx="190" cy="150" r="34" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/>
<text x="190.0" y="157.0" font-size="22" text-anchor="middle" fill="#2b6cb0" font-weight="700">O</text>
<line x1="190" y1="150" x2="146" y2="190" stroke="#4a5568" stroke-width="2.4"/>
<circle cx="146" cy="190" r="19" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="146.0" y="196.0" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="700">H</text>
<text x="128.0" y="214.0" font-size="13" text-anchor="middle" fill="#c53030" font-weight="700">δ+</text>
<line x1="190" y1="150" x2="234" y2="190" stroke="#4a5568" stroke-width="2.4"/>
<circle cx="234" cy="190" r="19" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
<text x="234.0" y="196.0" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="700">H</text>
<text x="252.0" y="214.0" font-size="13" text-anchor="middle" fill="#c53030" font-weight="700">δ+</text>
<text x="190.0" y="104.0" font-size="14" text-anchor="middle" fill="#c53030" font-weight="700">δ−</text>
<text x="190.0" y="268.0" font-size="13.5" text-anchor="middle" fill="#1a202c" font-weight="700">molécula POLAR</text>
<text x="190.0" y="286.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">el oxígeno atrae los electrones</text>
<line x1="300" y1="170" x2="348" y2="170" stroke="#2f855a" stroke-width="2.4" marker-end="url(#flg)"/>
<circle cx="500" cy="160" r="17" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1.8"/>
<text x="500.0" y="165.0" font-size="10.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">H₂O</text>
<circle cx="428" cy="108" r="17" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1.8"/>
<text x="428.0" y="113.0" font-size="10.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">H₂O</text>
<line x1="480" y1="145" x2="448" y2="123" stroke="#6b46c1" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="572" cy="108" r="17" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1.8"/>
<text x="572.0" y="113.0" font-size="10.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">H₂O</text>
<line x1="520" y1="145" x2="552" y2="123" stroke="#6b46c1" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="428" cy="212" r="17" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1.8"/>
<text x="428.0" y="217.0" font-size="10.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">H₂O</text>
<line x1="480" y1="175" x2="448" y2="197" stroke="#6b46c1" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="572" cy="212" r="17" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1.8"/>
<text x="572.0" y="217.0" font-size="10.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">H₂O</text>
<line x1="520" y1="175" x2="552" y2="197" stroke="#6b46c1" stroke-width="2" stroke-dasharray="5 4"/>
<text x="500.0" y="268.0" font-size="13.5" text-anchor="middle" fill="#6b46c1" font-weight="700">red de PUENTES DE HIDRÓGENO</text>
<text x="500.0" y="286.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">débiles uno a uno, decisivos en conjunto</text>
<rect x="700" y="100" width="150" height="150" rx="12" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.6"/>
<text x="775.0" y="128.0" font-size="13" text-anchor="middle" fill="#c05621" font-weight="700">Cuidado</text>
<text x="775.0" y="152.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">el agua disuelve</text>
<text x="775.0" y="169.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">lo polar y lo iónico,</text>
<text x="775.0" y="186.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">no lo apolar.</text>
<text x="775.0" y="212.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Por eso el aceite</text>
<text x="775.0" y="229.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">no se mezcla.</text>
<rect x="70" y="312" width="760" height="1.5" fill="#cbd5e0"/>
<rect x="80" y="340" width="360" height="92" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
<text x="260.0" y="366.0" font-size="14" text-anchor="middle" fill="#2b6cb0" font-weight="700">Disolvente</text>
<text x="260.0" y="390.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">rodea y separa los iones</text>
<text x="260.0" y="409.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">→ las reacciones ocurren en agua</text>
<rect x="480" y="340" width="360" height="92" rx="12" fill="#ffffff" stroke="#c05621" stroke-width="2"/>
<text x="660.0" y="366.0" font-size="14" text-anchor="middle" fill="#c05621" font-weight="700">Alto calor específico</text>
<text x="660.0" y="390.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">calentarla exige romper puentes</text>
<text x="660.0" y="409.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">→ amortigua la temperatura</text>
<rect x="80" y="450" width="360" height="92" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
<text x="260.0" y="476.0" font-size="14" text-anchor="middle" fill="#2f855a" font-weight="700">Cohesión</text>
<text x="260.0" y="500.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">las moléculas se atraen entre sí</text>
<text x="260.0" y="519.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">→ la savia sube por el tallo</text>
<rect x="480" y="450" width="360" height="92" rx="12" fill="#ffffff" stroke="#6b46c1" stroke-width="2"/>
<text x="660.0" y="476.0" font-size="14" text-anchor="middle" fill="#6b46c1" font-weight="700">El hielo flota</text>
<text x="660.0" y="500.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">congelada ocupa más volumen</text>
<text x="660.0" y="519.0" font-size="11.5" text-anchor="middle" fill="#4a5568" font-weight="normal">→ el lago se congela arriba</text>
<text x="450.0" y="580.0" font-size="12" text-anchor="middle" fill="#1a202c" font-weight="700">Todas estas propiedades salen del mismo hecho: la molécula es polar y forma puentes de hidrógeno.</text>
</svg>
