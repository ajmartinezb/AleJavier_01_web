<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="1160" height="660" role="img" aria-label="Ciclo del carbono con la atmósfera, los productores, los consumidores, el suelo, los descomponedores, el océano y los combustibles fósiles, y los procesos que mueven el carbono entre ellos" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Ciclo del carbono con la atmósfera, los productores, los consumidores, el suelo, los descomponedores, el océano y los combustibles fósiles, y los procesos que mueven el carbono entre ellos</title>
<rect width="1160" height="660" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="fln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker><marker id="fla" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="flr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker></defs>
<text x="580.0" y="34.0" font-size="21" text-anchor="middle" fill="#1a202c" font-weight="700">El ciclo del carbono</text>
<rect x="150" y="66" width="860" height="70" rx="14" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2.5"/>
<text x="580.0" y="98.0" font-size="16" text-anchor="middle" fill="#2b6cb0" font-weight="700">ATMÓSFERA</text>
<text x="580.0" y="120.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">carbono como CO₂</text>
<rect x="120" y="250" width="210" height="92" rx="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/><text x="225.0" y="274.0" font-size="15" text-anchor="middle" fill="#2f855a" font-weight="700">Productores</text><text x="225.0" y="296.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">plantas, algas,</text><text x="225.0" y="314.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">fitoplancton</text>
<rect x="400" y="250" width="210" height="92" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2"/><text x="505.0" y="274.0" font-size="15" text-anchor="middle" fill="#2f855a" font-weight="700">Consumidores</text><text x="505.0" y="296.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">animales, hongos,</text><text x="505.0" y="314.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">bacterias</text>
<rect x="120" y="420" width="210" height="92" rx="12" fill="#fff5eb" stroke="#c05621" stroke-width="2"/><text x="225.0" y="444.0" font-size="15" text-anchor="middle" fill="#c05621" font-weight="700">Suelo</text><text x="225.0" y="466.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">materia orgánica</text><text x="225.0" y="484.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">y humus</text>
<rect x="400" y="420" width="210" height="92" rx="12" fill="#fff5eb" stroke="#c05621" stroke-width="2"/><text x="505.0" y="444.0" font-size="15" text-anchor="middle" fill="#c05621" font-weight="700">Descomponedores</text><text x="505.0" y="466.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">devuelven el carbono</text><text x="505.0" y="484.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">al ambiente</text>
<rect x="700" y="250" width="250" height="118" rx="12" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/><text x="825.0" y="274.0" font-size="15" text-anchor="middle" fill="#2b6cb0" font-weight="700">Océano</text><text x="825.0" y="296.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">CO₂ disuelto, bicarbonato</text><text x="825.0" y="314.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">y conchas de carbonato</text><text x="825.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">de calcio</text>
<rect x="700" y="456" width="250" height="104" rx="12" fill="#f2f2f2" stroke="#4a5568" stroke-width="2"/><text x="825.0" y="480.0" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="700">Combustibles fósiles</text><text x="825.0" y="502.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">carbón, petróleo y gas;</text><text x="825.0" y="520.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">se forman en millones</text><text x="825.0" y="538.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">de años</text>
<line x1="200" y1="140" x2="200" y2="244" stroke="#2f855a" stroke-width="2.8" marker-end="url(#flv)"/><text x="196.0" y="196.0" font-size="12.5" text-anchor="end" fill="#2f855a" font-weight="700">fotosíntesis</text>
<line x1="268" y1="244" x2="268" y2="142" stroke="#4a5568" stroke-width="2.8" marker-end="url(#flg)"/><text x="334.0" y="196.0" font-size="12.5" text-anchor="end" fill="#4a5568" font-weight="700">respiración</text>
<line x1="330" y1="296" x2="394" y2="296" stroke="#2f855a" stroke-width="2.8" marker-end="url(#flv)"/>
<text x="346.0" y="278.0" font-size="11.5" text-anchor="middle" fill="#2f855a" font-weight="700">alimentación</text>
<line x1="500" y1="244" x2="500" y2="142" stroke="#4a5568" stroke-width="2.8" marker-end="url(#flg)"/><text x="508.0" y="196.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="700">respiración</text>
<line x1="505" y1="348" x2="505" y2="414" stroke="#c05621" stroke-width="2.8" marker-end="url(#fln)"/><text x="620.0" y="386.0" font-size="12.5" text-anchor="start" fill="#c05621" font-weight="700">materia muerta</text>
<line x1="225" y1="348" x2="225" y2="414" stroke="#c05621" stroke-width="2.8" marker-end="url(#fln)"/>
<line x1="398" y1="482" x2="334" y2="482" stroke="#c05621" stroke-width="2.8" marker-end="url(#fln)"/><text x="366.0" y="472.0" font-size="12.5" text-anchor="middle" fill="#c05621" font-weight="700">humus</text>
<path d="M398,428 L386,428 L386,142" fill="none" stroke="#4a5568" stroke-width="2.8" stroke-dasharray="7 5" marker-end="url(#flg)"/>
<text x="376.0" y="374.0" font-size="12.5" text-anchor="end" fill="#4a5568" font-weight="700">descomposición</text>
<line x1="824" y1="250" x2="824" y2="142" stroke="#2b6cb0" stroke-width="2.8" marker-end="url(#fla)"/>
<line x1="886" y1="142" x2="886" y2="244" stroke="#2b6cb0" stroke-width="2.8" marker-end="url(#fla)"/>
<text x="800.0" y="196.0" font-size="12.5" text-anchor="end" fill="#2b6cb0" font-weight="700">intercambio</text>
<text x="800.0" y="214.0" font-size="12.5" text-anchor="end" fill="#2b6cb0" font-weight="700">aire–océano</text>
<line x1="760" y1="374" x2="760" y2="450" stroke="#4a5568" stroke-width="2.8" marker-end="url(#flg)" stroke-dasharray="9 6"/>
<text x="748.0" y="404.0" font-size="12.5" text-anchor="end" fill="#4a5568" font-weight="700">fosilización</text>
<text x="748.0" y="422.0" font-size="11.5" text-anchor="end" fill="#4a5568" font-weight="normal">(muy lenta)</text>
<path d="M900,450 C980,360 1000,220 940,146" fill="none" stroke="#c53030" stroke-width="3.2" marker-end="url(#flr)"/>
<text x="1024.0" y="330.0" font-size="13" text-anchor="middle" fill="#c53030" font-weight="700">combustión</text>
<text x="1024.0" y="348.0" font-size="11.5" text-anchor="middle" fill="#c53030" font-weight="normal">(muy rápida)</text>
<rect x="120" y="580" width="920" height="60" rx="12" fill="#fff5eb" stroke="#c53030" stroke-width="2"/>
<text x="580.0" y="604.0" font-size="13" text-anchor="middle" fill="#c53030" font-weight="700">El desajuste está en las velocidades: el carbono fósil tardó millones de años en salir del ciclo</text>
<text x="580.0" y="626.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">y la combustión lo devuelve a la atmósfera en décadas.</text>
</svg>
