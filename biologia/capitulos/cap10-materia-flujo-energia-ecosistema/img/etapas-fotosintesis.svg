<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img" aria-label="Esquema de la fase luminosa en el tilacoide y del ciclo de Calvin en el estroma, con el ATP y el NADPH que van de una a otra y el ADP y NADP+ que vuelven" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Esquema de la fase luminosa en el tilacoide y del ciclo de Calvin en el estroma, con el ATP y el NADPH que van de una a otra y el ADP y NADP+ que vuelven</title>
<rect width="1180" height="640" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="fla" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="flm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/></marker><marker id="fln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker></defs>
<text x="590.0" y="34.0" font-size="21" text-anchor="middle" fill="#1a202c" font-weight="700">Las dos etapas de la fotosíntesis y cómo se acoplan</text>
<rect x="60" y="80" width="470" height="440" rx="16" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2.5"/>
<text x="295.0" y="112.0" font-size="17" text-anchor="middle" fill="#2b6cb0" font-weight="700">FASE LUMINOSA</text>
<text x="295.0" y="134.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">en la membrana del tilacoide</text>
<rect x="100" y="176" width="390" height="34" rx="8" fill="#68d391" stroke="#2f855a" stroke-width="2"/>
<text x="295.0" y="199.0" font-size="13" text-anchor="middle" fill="#14532d" font-weight="700">membrana del tilacoide (clorofila)</text>
<circle cx="150" cy="128" r="0" fill="none"/>
<line x1="150" y1="152" x2="150" y2="172" stroke="#d69e2e" stroke-width="3" marker-end="url(#fln)"/>
<text x="150.0" y="148.0" font-size="13.5" text-anchor="middle" fill="#d69e2e" font-weight="700">luz</text>
<line x1="295" y1="152" x2="295" y2="172" stroke="#2b6cb0" stroke-width="3" marker-end="url(#fln)"/>
<text x="295.0" y="148.0" font-size="13.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">H₂O</text>
<text x="295.0" y="250.0" font-size="13.5" text-anchor="middle" fill="#1a202c" font-weight="normal">1. la clorofila absorbe la luz</text>
<text x="295.0" y="274.0" font-size="13.5" text-anchor="middle" fill="#1a202c" font-weight="normal">2. fotólisis del agua: 2 H₂O → 4 H⁺ + 4 e⁻ + O₂</text>
<text x="295.0" y="298.0" font-size="13.5" text-anchor="middle" fill="#1a202c" font-weight="normal">3. la cadena de electrones produce ATP y NADPH</text>
<rect x="96" y="330" width="180" height="62" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2"/><text x="186.0" y="354.0" font-size="16" text-anchor="middle" fill="#2f855a" font-weight="700">O₂</text><text x="186.0" y="376.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">se libera al ambiente</text>
<rect x="312" y="330" width="180" height="62" rx="12" fill="#ffffff" stroke="#6b46c1" stroke-width="2"/><text x="402.0" y="354.0" font-size="15" text-anchor="middle" fill="#6b46c1" font-weight="700">ATP + NADPH</text><text x="402.0" y="376.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">bajan al estroma</text>
<text x="295.0" y="434.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Entra: luz, H₂O, ADP + Pi, NADP⁺</text>
<text x="295.0" y="456.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Sale: ATP, NADPH, O₂</text>
<text x="295.0" y="492.0" font-size="12.5" text-anchor="middle" fill="#2b6cb0" font-weight="normal" font-style="italic">Requiere luz de forma directa</text>
<rect x="650" y="80" width="470" height="440" rx="16" fill="#f3ebff" stroke="#6b46c1" stroke-width="2.5"/>
<text x="885.0" y="112.0" font-size="17" text-anchor="middle" fill="#6b46c1" font-weight="700">CICLO DE CALVIN</text>
<text x="885.0" y="134.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">en el estroma</text>
<line x1="885" y1="152" x2="885" y2="176" stroke="#4a5568" stroke-width="3" marker-end="url(#flg)"/>
<text x="885.0" y="148.0" font-size="13.5" text-anchor="middle" fill="#4a5568" font-weight="700">CO₂</text>
<circle cx="885" cy="286" r="84" fill="none" stroke="#6b46c1" stroke-width="3" stroke-dasharray="9 7"/>
<path d="M967.7,300.6 A84,84 0 0 1 899.6,368.7" fill="none" stroke="#6b46c1" stroke-width="3" marker-end="url(#flm)"/>
<path d="M831.0,350.3 A84,84 0 0 1 806.1,257.3" fill="none" stroke="#6b46c1" stroke-width="3" marker-end="url(#flm)"/>
<path d="M856.3,207.1 A84,84 0 0 1 949.3,232.0" fill="none" stroke="#6b46c1" stroke-width="3" marker-end="url(#flm)"/>
<text x="885.0" y="272.0" font-size="13" text-anchor="middle" fill="#1a202c" font-weight="700">1. fijación</text>
<text x="885.0" y="292.0" font-size="13" text-anchor="middle" fill="#1a202c" font-weight="700">2. reducción</text>
<text x="885.0" y="312.0" font-size="13" text-anchor="middle" fill="#1a202c" font-weight="700">3. regeneración</text>
<text x="789.0" y="220.0" font-size="12.5" text-anchor="end" fill="#6b46c1" font-weight="700">RuBisCO</text>
<rect x="700" y="400" width="370" height="58" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2"/><text x="885.0" y="424.0" font-size="15" text-anchor="middle" fill="#2f855a" font-weight="700">Materia orgánica</text><text x="885.0" y="446.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">glucosa, sacarosa, almidón, celulosa…</text>
<text x="885.0" y="486.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Entra: CO₂, ATP, NADPH   ·   Sale: materia orgánica, ADP, NADP⁺</text>
<text x="885.0" y="508.0" font-size="12.5" text-anchor="middle" fill="#6b46c1" font-weight="normal" font-style="italic">No usa luz directamente, pero depende de ella</text>
<path d="M500,352 C570,330 590,330 656,330" fill="none" stroke="#6b46c1" stroke-width="3.5" marker-end="url(#flm)"/>
<text x="590.0" y="318.0" font-size="12.5" text-anchor="middle" fill="#6b46c1" font-weight="700">ATP y NADPH</text>
<path d="M656,452 C590,470 570,470 500,470" fill="none" stroke="#2b6cb0" stroke-width="3.5" marker-end="url(#fla)"/>
<text x="590.0" y="496.0" font-size="12.5" text-anchor="middle" fill="#2b6cb0" font-weight="700">ADP y NADP⁺</text>
<rect x="230" y="558" width="720" height="58" rx="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<text x="590.0" y="582.0" font-size="15" text-anchor="middle" fill="#14532d" font-weight="700">Balance global:  6 CO₂ + 6 H₂O + energía luminosa → C₆H₁₂O₆ + 6 O₂</text>
<text x="590.0" y="604.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">El O₂ liberado proviene del agua, no del CO₂.</text>
</svg>
