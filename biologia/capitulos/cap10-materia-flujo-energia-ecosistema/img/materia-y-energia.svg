<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 620" width="1140" height="620" role="img" aria-label="La materia circula en un ciclo cerrado y la energía fluye en una sola dirección desde el Sol hasta el calor" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>La materia circula en un ciclo cerrado y la energía fluye en una sola dirección desde el Sol hasta el calor</title>
<rect width="1140" height="620" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="fln" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker><marker id="fla" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d69e2e"/></marker></defs>
<text x="570.0" y="34.0" font-size="21" text-anchor="middle" fill="#1a202c" font-weight="700">La materia circula, la energía fluye</text>
<text x="285.0" y="62.0" font-size="15" text-anchor="middle" fill="#2f855a" font-weight="700">La materia recorre un ciclo cerrado</text>
<text x="855.0" y="62.0" font-size="15" text-anchor="middle" fill="#c05621" font-weight="700">La energía hace un viaje de ida</text>
<line x1="570" y1="52" x2="570" y2="600" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="285" cy="340" r="150" fill="none" stroke="#68d391" stroke-width="3" stroke-dasharray="10 8"/>
<rect x="207" y="164" width="156" height="64" rx="10" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<text x="285.0" y="186.0" font-size="13" text-anchor="middle" fill="#2f855a" font-weight="700">CO₂ del aire</text>
<text x="285.0" y="204.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">y minerales</text>
<rect x="365" y="314" width="140" height="42" rx="10" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<text x="435.0" y="336.0" font-size="13" text-anchor="middle" fill="#2f855a" font-weight="700">Productores</text>
<rect x="215" y="464" width="140" height="42" rx="10" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<text x="285.0" y="486.0" font-size="13" text-anchor="middle" fill="#2f855a" font-weight="700">Consumidores</text>
<rect x="65" y="314" width="140" height="42" rx="10" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<text x="135.0" y="336.0" font-size="13" text-anchor="middle" fill="#2f855a" font-weight="700">Descomponedores</text>
<path d="M373.0,187.6 A176,176 0 0 1 458.3,309.4" fill="none" stroke="#2f855a" stroke-width="2.5" marker-end="url(#flv)"/>
<path d="M437.4,428.0 A176,176 0 0 1 315.6,513.3" fill="none" stroke="#2f855a" stroke-width="2.5" marker-end="url(#flv)"/>
<path d="M197.0,492.4 A176,176 0 0 1 111.7,370.6" fill="none" stroke="#2f855a" stroke-width="2.5" marker-end="url(#flv)"/>
<path d="M132.6,252.0 A176,176 0 0 1 254.4,166.7" fill="none" stroke="#2f855a" stroke-width="2.5" marker-end="url(#flv)"/>
<text x="285.0" y="344.0" font-size="13.5" text-anchor="middle" fill="#1a202c" font-weight="700">Los mismos</text>
<text x="285.0" y="362.0" font-size="13.5" text-anchor="middle" fill="#1a202c" font-weight="700">átomos vuelven</text>
<rect x="60" y="540" width="450" height="58" rx="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<text x="285.0" y="564.0" font-size="13" text-anchor="middle" fill="#14532d" font-weight="700">No hace falta materia nueva:</text>
<text x="285.0" y="584.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">los ciclos de la materia son cerrados.</text>
<circle cx="660" cy="118" r="30" fill="#d69e2e" stroke="#c05621" stroke-width="2"/>
<text x="660.0" y="124.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">Sol</text>
<line x1="660" y1="150" x2="660" y2="172" stroke="#d69e2e" stroke-width="3" marker-end="url(#fla)"/>
<text x="645.0" y="166.0" font-size="12" text-anchor="end" fill="#c05621" font-weight="normal">energía luminosa</text>
<rect x="530.0" y="175" width="260" height="52" rx="10" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<text x="660.0" y="197.0" font-size="14" text-anchor="middle" fill="#2f855a" font-weight="700">Productores</text>
<text x="660.0" y="216.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">energía disponible: 300</text>
<line x1="660" y1="227" x2="660" y2="263" stroke="#2f855a" stroke-width="3" marker-end="url(#flv)"/>
<text x="700.0" y="251.0" font-size="12" text-anchor="start" fill="#2f855a" font-weight="700">10 %</text>
<line x1="790.0" y1="201" x2="900.0" y2="201" stroke="#c53030" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#fln)"/>
<text x="846.0" y="191.0" font-size="12" text-anchor="middle" fill="#c53030" font-weight="700">calor</text>
<rect x="530.0" y="265" width="260" height="52" rx="10" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<text x="660.0" y="287.0" font-size="14" text-anchor="middle" fill="#2f855a" font-weight="700">Consumidores I</text>
<text x="660.0" y="306.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">energía disponible: 30</text>
<line x1="660" y1="317" x2="660" y2="353" stroke="#2f855a" stroke-width="3" marker-end="url(#flv)"/>
<text x="700.0" y="341.0" font-size="12" text-anchor="start" fill="#2f855a" font-weight="700">10 %</text>
<line x1="790.0" y1="291" x2="900.0" y2="291" stroke="#c53030" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#fln)"/>
<text x="846.0" y="281.0" font-size="12" text-anchor="middle" fill="#c53030" font-weight="700">calor</text>
<rect x="530.0" y="355" width="260" height="52" rx="10" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
<text x="660.0" y="377.0" font-size="14" text-anchor="middle" fill="#2f855a" font-weight="700">Consumidores II</text>
<text x="660.0" y="396.0" font-size="12" text-anchor="middle" fill="#4a5568" font-weight="normal">energía disponible: 3</text>
<line x1="790.0" y1="381" x2="900.0" y2="381" stroke="#c53030" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#fln)"/>
<text x="846.0" y="371.0" font-size="12" text-anchor="middle" fill="#c53030" font-weight="700">calor</text>
<rect x="620" y="440" width="470" height="76" rx="12" fill="#fff5eb" stroke="#c05621" stroke-width="2"/>
<text x="855.0" y="466.0" font-size="13" text-anchor="middle" fill="#c05621" font-weight="700">El calor se disipa y ningún organismo lo recupera.</text>
<text x="855.0" y="490.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Por eso el ecosistema necesita luz de forma permanente</text>
<text x="855.0" y="508.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">y por eso solo hay cuatro o cinco niveles tróficos.</text>
</svg>
