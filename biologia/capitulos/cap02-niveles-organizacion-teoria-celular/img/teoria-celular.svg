<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-label="Línea de tiempo de la teoría celular, de Hooke en 1665 a Pasteur en 1861, y sus tres postulados" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Línea de tiempo de la teoría celular, de Hooke en 1665 a Pasteur en 1861, y sus tres postulados</title>
<rect width="920" height="560" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs>
<text x="460.0" y="30.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">La teoría celular: cómo se construyó</text>
<text x="460.0" y="52.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Ninguna persona la formuló sola; se armó con observaciones de dos siglos</text>
<line x1="70" y1="200" x2="870" y2="200" stroke="#4a5568" stroke-width="2.5" marker-end="url(#flg)"/>
<circle cx="120" cy="200" r="7" fill="#c05621"/>
<line x1="120" y1="192" x2="120" y2="162" stroke="#c05621" stroke-width="1.5"/>
<rect x="40" y="70" width="160" height="92" rx="10" fill="#ffffff" stroke="#c05621" stroke-width="2"/>
<text x="120.0" y="90.0" font-size="14" text-anchor="middle" fill="#c05621" font-weight="700">1665</text>
<text x="120.0" y="107.0" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="700">Hooke</text>
<text x="120.0" y="123.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">observa corcho al</text>
<text x="120.0" y="136.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">microscopio y llama</text>
<text x="120.0" y="149.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">«celdas» a los huecos</text>
<circle cx="280" cy="200" r="7" fill="#c05621"/>
<line x1="280" y1="208" x2="280" y2="238" stroke="#c05621" stroke-width="1.5"/>
<rect x="200" y="238" width="160" height="92" rx="10" fill="#ffffff" stroke="#c05621" stroke-width="2"/>
<text x="280.0" y="258.0" font-size="14" text-anchor="middle" fill="#c05621" font-weight="700">1670s</text>
<text x="280.0" y="275.0" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="700">van Leeuwenhoek</text>
<text x="280.0" y="291.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">ve «animálculos»:</text>
<text x="280.0" y="304.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">las primeras células</text>
<text x="280.0" y="317.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">vivas observadas</text>
<circle cx="450" cy="200" r="7" fill="#2f855a"/>
<line x1="450" y1="192" x2="450" y2="162" stroke="#2f855a" stroke-width="1.5"/>
<rect x="370" y="70" width="160" height="92" rx="10" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
<text x="450.0" y="90.0" font-size="14" text-anchor="middle" fill="#2f855a" font-weight="700">1838-39</text>
<text x="450.0" y="107.0" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="700">Schleiden y Schwann</text>
<text x="450.0" y="123.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">plantas y animales</text>
<text x="450.0" y="136.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">están hechos</text>
<text x="450.0" y="149.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">de células</text>
<circle cx="630" cy="200" r="7" fill="#2f855a"/>
<line x1="630" y1="208" x2="630" y2="238" stroke="#2f855a" stroke-width="1.5"/>
<rect x="550" y="238" width="160" height="92" rx="10" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
<text x="630.0" y="258.0" font-size="14" text-anchor="middle" fill="#2f855a" font-weight="700">1855</text>
<text x="630.0" y="275.0" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="700">Virchow</text>
<text x="630.0" y="291.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">toda célula proviene</text>
<text x="630.0" y="304.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">de otra célula</text>
<text x="630.0" y="317.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">preexistente</text>
<circle cx="800" cy="200" r="7" fill="#2b6cb0"/>
<line x1="800" y1="192" x2="800" y2="162" stroke="#2b6cb0" stroke-width="1.5"/>
<rect x="720" y="70" width="160" height="92" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
<text x="800.0" y="90.0" font-size="14" text-anchor="middle" fill="#2b6cb0" font-weight="700">1861</text>
<text x="800.0" y="107.0" font-size="12.5" text-anchor="middle" fill="#1a202c" font-weight="700">Pasteur</text>
<text x="800.0" y="123.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">el cuello de cisne</text>
<text x="800.0" y="136.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">refuta la generación</text>
<text x="800.0" y="149.0" font-size="10.8" text-anchor="middle" fill="#4a5568" font-weight="normal">espontánea</text>
<rect x="70" y="400" width="780" height="130" rx="14" fill="#f7fafc" stroke="#2f855a" stroke-width="2"/>
<text x="460.0" y="426.0" font-size="15.5" text-anchor="middle" fill="#2f855a" font-weight="700">Los tres postulados</text>
<circle cx="100.0" cy="470" r="15" fill="#2f855a"/>
<text x="100.0" y="475.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
<text x="122.0" y="466.0" font-size="12.5" text-anchor="start" fill="#1a202c" font-weight="normal">Todos los seres vivos</text>
<text x="122.0" y="482.0" font-size="12.5" text-anchor="start" fill="#1a202c" font-weight="normal">están formados por células</text>
<circle cx="360.0" cy="470" r="15" fill="#2f855a"/>
<text x="360.0" y="475.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
<text x="382.0" y="466.0" font-size="12.5" text-anchor="start" fill="#1a202c" font-weight="normal">La célula es la unidad</text>
<text x="382.0" y="482.0" font-size="12.5" text-anchor="start" fill="#1a202c" font-weight="normal">estructural y funcional</text>
<circle cx="620.0" cy="470" r="15" fill="#2f855a"/>
<text x="620.0" y="475.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
<text x="642.0" y="466.0" font-size="12.5" text-anchor="start" fill="#1a202c" font-weight="normal">Toda célula proviene</text>
<text x="642.0" y="482.0" font-size="12.5" text-anchor="start" fill="#1a202c" font-weight="normal">de otra célula preexistente</text>
<text x="460.0" y="516.0" font-size="11.8" text-anchor="middle" fill="#4a5568" font-weight="normal" font-style="italic">Es una TEORÍA porque explica un conjunto amplio de observaciones y ha resistido 160 años de pruebas.</text>
</svg>
