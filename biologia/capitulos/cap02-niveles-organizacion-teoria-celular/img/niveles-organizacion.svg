<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img" aria-label="Escalera de los niveles de organización, del átomo a la biosfera, con el umbral de la vida en el nivel celular" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Escalera de los niveles de organización, del átomo a la biosfera, con el umbral de la vida en el nivel celular</title>
<rect width="900" height="720" fill="#ffffff"/>
<defs><marker id="flg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker></defs>
<text x="450.0" y="30.0" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="700">Niveles de organización de la materia</text>
<text x="450.0" y="52.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">La vida aparece en el nivel celular, no antes</text>
<rect x="250" y="640.0" width="300" height="40" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
<text x="262.0" y="658.0" font-size="13.5" text-anchor="start" fill="#4a5568" font-weight="700">Átomo</text>
<text x="262.0" y="673.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">C, H, O, N</text>
<rect x="250" y="592.0" width="322" height="40" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
<text x="262.0" y="610.0" font-size="13.5" text-anchor="start" fill="#4a5568" font-weight="700">Molécula</text>
<text x="262.0" y="625.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">H₂O, CO₂</text>
<rect x="250" y="544.0" width="344" height="40" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
<text x="262.0" y="562.0" font-size="13.5" text-anchor="start" fill="#4a5568" font-weight="700">Biomolécula</text>
<text x="262.0" y="577.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">proteína, ADN</text>
<rect x="250" y="496.0" width="366" height="40" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
<text x="262.0" y="514.0" font-size="13.5" text-anchor="start" fill="#4a5568" font-weight="700">Organelo</text>
<text x="262.0" y="529.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">mitocondria, núcleo</text>
<rect x="250" y="448.0" width="388" height="40" rx="8" fill="#68d391" stroke="#2f855a" stroke-width="2.5"/>
<text x="262.0" y="466.0" font-size="13.5" text-anchor="start" fill="#1a202c" font-weight="700">Célula</text>
<text x="262.0" y="481.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">neurona, bacteria</text>
<rect x="250" y="400.0" width="410" height="40" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.5"/>
<text x="262.0" y="418.0" font-size="13.5" text-anchor="start" fill="#1a202c" font-weight="700">Tejido</text>
<text x="262.0" y="433.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">tejido nervioso</text>
<rect x="250" y="352.0" width="432" height="40" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.5"/>
<text x="262.0" y="370.0" font-size="13.5" text-anchor="start" fill="#1a202c" font-weight="700">Órgano</text>
<text x="262.0" y="385.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">cerebro</text>
<rect x="250" y="304.0" width="454" height="40" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.5"/>
<text x="262.0" y="322.0" font-size="13.5" text-anchor="start" fill="#1a202c" font-weight="700">Sistema de órganos</text>
<text x="262.0" y="337.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">sistema nervioso</text>
<rect x="250" y="256.0" width="476" height="40" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.5"/>
<text x="262.0" y="274.0" font-size="13.5" text-anchor="start" fill="#1a202c" font-weight="700">Organismo</text>
<text x="262.0" y="289.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">un ser humano</text>
<rect x="250" y="208.0" width="498" height="40" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="262.0" y="226.0" font-size="13.5" text-anchor="start" fill="#1a202c" font-weight="700">Población</text>
<text x="262.0" y="241.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">los huemules de un valle</text>
<rect x="250" y="160.0" width="520" height="40" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="262.0" y="178.0" font-size="13.5" text-anchor="start" fill="#1a202c" font-weight="700">Comunidad</text>
<text x="262.0" y="193.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">todas las especies del valle</text>
<rect x="250" y="112.0" width="542" height="40" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="262.0" y="130.0" font-size="13.5" text-anchor="start" fill="#1a202c" font-weight="700">Ecosistema</text>
<text x="262.0" y="145.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">el valle y su clima</text>
<rect x="250" y="64.0" width="564" height="40" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="262.0" y="82.0" font-size="13.5" text-anchor="start" fill="#1a202c" font-weight="700">Biosfera</text>
<text x="262.0" y="97.0" font-size="11.5" text-anchor="start" fill="#4a5568" font-weight="normal" font-style="italic">toda la vida del planeta</text>
<line x1="224" y1="678" x2="224" y2="70" stroke="#4a5568" stroke-width="2" marker-end="url(#flg)"/>
<text transform="translate(210,395.0) rotate(-90)" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="700">complejidad creciente</text>
<line x1="60" y1="492.0" x2="870" y2="492.0" stroke="#c53030" stroke-width="2" stroke-dasharray="7 5"/>
<text x="866.0" y="483.0" font-size="12.5" text-anchor="end" fill="#c53030" font-weight="700">umbral de la vida</text>
<text x="64.0" y="466.0" font-size="12" text-anchor="start" fill="#2f855a" font-weight="700">unidad mínima</text>
<text x="64.0" y="481.0" font-size="12" text-anchor="start" fill="#2f855a" font-weight="700">de vida</text>
<text x="64.0" y="281.0" font-size="12" text-anchor="start" fill="#2f855a" font-weight="700">niveles</text>
<text x="64.0" y="296.0" font-size="12" text-anchor="start" fill="#2f855a" font-weight="700">biológicos</text>
<text x="64.0" y="137.0" font-size="12" text-anchor="start" fill="#2b6cb0" font-weight="700">niveles</text>
<text x="64.0" y="152.0" font-size="12" text-anchor="start" fill="#2b6cb0" font-weight="700">ecológicos</text>
<text x="64.0" y="617.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="700">niveles</text>
<text x="64.0" y="632.0" font-size="12" text-anchor="start" fill="#4a5568" font-weight="700">abióticos</text>
</svg>
