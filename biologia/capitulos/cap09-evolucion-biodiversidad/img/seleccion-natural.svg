<text x="1012.0" y="314.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">La variante ventajosa es ahora</text>
<text x="1012.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">más frecuente. La POBLACIÓN</text>
<text x="1012.0" y="350.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">cambió, no los individuos.</text>
<text x="730.0" y="286.0" font-size="11.5" text-anchor="middle" fill="#c05621" font-weight="normal" font-style="italic">(las claras dejaron menos descendencia)</text>
<rect x="38" y="392" width="1104" height="66" rx="12" fill="#fffaf0" stroke="#c05621" stroke-width="1.6"/>
<text x="590.0" y="416.0" font-size="14" text-anchor="middle" fill="#c05621" font-weight="700">La selección natural NO crea las variantes: las crea la mutación, al azar y antes de la presión.</text>
<text x="590.0" y="440.0" font-size="13" text-anchor="middle" fill="#4a5568" font-weight="normal">Lo que hace la selección es dejar más descendencia a unas que a otras. La unidad que evoluciona es la población, nunca el individuo.</text>
<ellipse cx="60" cy="370" rx="13" ry="9" fill="#f6e05e" stroke="#2d3748" stroke-width="1.3"/>
<text x="80.0" y="375.0" font-size="12.5" text-anchor="start" fill="#4a5568" font-weight="normal">variante clara</text>
