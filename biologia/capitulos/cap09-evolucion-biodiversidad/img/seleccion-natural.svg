<text x="730.0" y="314.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">Sobreviven y se reproducen</text>
<text x="730.0" y="332.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">más las oscuras. No es al azar</text>
<text x="730.0" y="350.0" font-size="12.5" text-anchor="middle" fill="#4a5568" font-weight="normal">respecto del ambiente.</text>
